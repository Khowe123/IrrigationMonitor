function ZoneRow({zone,data,onChange}){
  const d=data||emptyZone();
  const sk=zone.stage||null;
  const dd=zone.drainDrippers||null,pd=zone.privaDrippers||null;
  const{overall,flags}=zoneStatus(d,sk,dd,pd);
  const[open,setOpen]=useState(true);
  const upd=(f,v)=>onChange(zone.id,f,v);
  const dot=overall==='danger'?'danger':overall==='warn'?'warn':'';
  const bd=overall==='danger'?'#ef9a9a':overall==='warn'?'#ffe082':'#e8e8e8';
  const sg=GROWTH_STAGES[sk];
  const der=calcDer(d,dd,pd);
  return html`
  <div class="card" style=${{borderColor:bd}}>
    <button class=${'card-head '+overall} onClick=${()=>setOpen(o=>!o)}>
      <div class="chl">
        <span class=${'dot '+dot}></span>
        <span class="zname">${zone.label}</span>
        <span class="vname">${zone.valve}</span>
        ${sg?html`<span class="sbadge">${sg.label.split(' (')[0].replace('Up to ','→').replace('During ','').replace('Between ','~').replace('Initial ','Init.')}</span>`:null}
      </div>
      <div class="chips">
        ${(()=>{
          const drainFlag=flags.find(f=>f.msg.includes('Drain')||f.msg.includes('drain'));
          const drS=drainFlag?drainFlag.lvl:(der.pct!==null?'ok':'neutral');
          const otherFlags=flags.filter(f=>!f.msg.includes('Drain')&&!f.msg.includes('drain'));
          return html`
            ${der.pct!==null?html`<span class=${'chip chip-'+(drS==='danger'?'danger':drS==='warn'?'warn':'neutral')}>Dr ${der.pct.toFixed(0)}%</span>`:null}
            ${otherFlags.slice(0,1).map((f,i)=>html`<span key=${i} class=${'chip chip-'+f.lvl}>${f.msg}</span>`)}
          `;
        })()}
        ${!dd&&flags.length===0?html`<span class="chip chip-warn">Dr ?%</span>`:null}
        <span class="chev">${open?'▲':'▼'}</span>
      </div>
    </button>
    <div class=${'cbody'+(open?' open':'')}>
      ${zone.location?html`<div class="zloc">${zone.location}</div>`:null}
      <div class="g2">
        ${[['Drip','drip'],['Drain','drain']].map(([lbl,pfx])=>html`
        <div key=${pfx}>
          <div class="flbl">${lbl}</div>
          <div class="fg">
            ${[['EC',pfx+'_ec','1.40'],['pH',pfx+'_ph','5.4'],['mL',pfx+'_ml','500']].map(([fl,fk,ph])=>html`
            <div key=${fk}>
              <span class="fl">${fl}</span>
              <${NInput} value=${d[fk]} onChange=${v=>upd(fk,v)} placeholder=${ph}
                flagged=${fk==='drip_ph'&&!isNaN(parseFloat(d[fk]))&&(parseFloat(d[fk])<4.5||parseFloat(d[fk])>7.5)}/>
            </div>`)}
          </div>
        </div>`)}
      </div>
      ${zone.hasPriva?html`
      <div class="priva-box">
        <div class="priva-lbl">Drain – Priva sensor</div>
        <div class="fg">
          ${[['EC','priva_ec'],['pH','priva_ph'],['mL','priva_ml']].map(([fl,fk])=>html`
          <div key=${fk}><span class="fl">${fl}</span><${NInput} value=${d[fk]} onChange=${v=>upd(fk,v)} placeholder="—"/></div>`)}
        </div>
        
    </div>`:null}
    </div>
  </div>`;
}

function ImageSection({cropId,date,attachments,onUpdate,entry,zones,stageKey,cropLabel}){
  const[imgs,setImgs]=useState({});
  const[missingImgs,setMissingImgs]=useState({});
  const[lb,setLb]=useState(null);
  const[analyzing,setAnalyzing]=useState(null);
  const[analyses,setAnalyses]=useState({});
  const[uploading,setUploading]=useState(false);
  const atts=attachments||[];

  useEffect(()=>{
    const loaded={};const missing={};
    atts.forEach(att=>{
      const b=LS.get('hff:'+cropId+':imgdata:'+att.id,null);
      if(b)loaded[att.id]=b;else missing[att.id]=true;
    });
    setImgs(loaded);
    setMissingImgs(missing);
    setAnalyses({});
  },[date,cropId]);

  async function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    setUploading(true);
    try{
      const comp=await compressImg(file);
      const id='img_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      LS.set('hff:'+cropId+':imgdata:'+id,comp);
      const att={id,caption:'',timestamp:Date.now(),name:file.name};
      const updated=[...atts,att];
      onUpdate(updated);
      setImgs(p=>({...p,[id]:comp}));
    }catch(err){alert('Attach failed: '+err.message);}
    setUploading(false);e.target.value='';
  }

  function delAtt(id){
    if(!confirm('Remove this attachment?'))return;
    LS.del('hff:'+cropId+':imgdata:'+id);
    onUpdate(atts.filter(a=>a.id!==id));
    setImgs(p=>{const n={...p};delete n[id];return n;});
    setAnalyses(p=>{const n={...p};delete n[id];return n;});
    if(lb===id)setLb(null);
  }

  async function doAnalyze(att){
    const b64=imgs[att.id];if(!b64){alert('Image not loaded.');return;}
    setAnalyzing(att.id);
    const result=await analyzeChart(b64,entry,zones,cropLabel,stageKey);
    setAnalyses(p=>({...p,[att.id]:result}));
    setAnalyzing(null);
  }

  return html`
  <div style=${{marginBottom:14}}>
    <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
      <span style=${{fontSize:11,fontWeight:600,color:'#666',letterSpacing:'.06em',textTransform:'uppercase'}}>📸 Screenshots & Charts</span>
      <label style=${{padding:'6px 14px',borderRadius:8,border:'1.5px solid #1a2b1a',color:'#1a2b1a',fontWeight:600,fontSize:12,cursor:'pointer',opacity:uploading?0.5:1}}>
        ${uploading?'Compressing…':'+ Attach'}
        <input type="file" accept="image/*" onInput=${handleFile} style=${{display:'none'}} disabled=${uploading}/>
      </label>
    </div>
    ${atts.length===0?html`<p style=${{fontSize:12,color:'#ccc',lineHeight:1.5}}>Attach Soilsense moisture charts, Priva graphs, or any screenshot worth flagging. Tap "Analyse" for AI interpretation alongside today's readings.</p>`:null}
    <div class="img-grid">
      ${atts.map(att=>html`
      <div class="img-card" key=${att.id}>
        ${imgs[att.id]?html`
        <div style=${{position:'relative'}}>
          <img class="img-thumb" src=${imgs[att.id]} onClick=${()=>setLb(att.id)} alt=${att.caption||att.name||''}/>
          <button onClick=${()=>delAtt(att.id)} style=${{position:'absolute',top:5,right:5,width:22,height:22,borderRadius:'50%',background:'rgba(0,0,0,.6)',color:'#fff',border:'none',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>✕</button>
        </div>`:missingImgs[att.id]?html`
        <div class="img-ph" style=${{flexDirection:'column',gap:3,padding:'8px'}}>
          <span>📸</span>
          <span style=${{fontSize:10,textAlign:'center',color:'#bbb'}}>Saved on another device</span>
          <button onClick=${()=>delAtt(att.id)} style=${{fontSize:10,color:'#e65100',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Remove</button>
        </div>`:html`<div class="img-ph">Loading…</div>`}
        <div class="img-inner">
          <input class="img-cap" type="text" value=${att.caption} onInput=${e=>onUpdate(atts.map(a=>a.id===att.id?{...a,caption:e.target.value}:a))} placeholder="Zone, issue, date…"/>
          <button class="img-analyse" disabled=${analyzing===att.id||!imgs[att.id]}
            style=${{background:analyzing===att.id?'#e0e0e0':'#1a2b1a',color:analyzing===att.id?'#888':'#fff',cursor:analyzing===att.id?'default':'pointer'}}
            onClick=${()=>doAnalyze(att)}>
            ${analyzing===att.id?'Analysing…':'Analyse with AI ↗'}
          </button>
          ${analyses[att.id]?html`<div class="img-analysis">${analyses[att.id]}</div>`:null}
        </div>
      </div>`)}
    </div>
    ${lb&&imgs[lb]?html`
    <div class="lightbox" onClick=${()=>setLb(null)}>
      <img src=${imgs[lb]} onClick=${e=>e.stopPropagation()} alt=""/>
      <button class="lightbox-close" onClick=${()=>setLb(null)}>✕</button>
      
    </div>`:null}
  </div>`;
}


// ── TREND CHART ───────────────────────────────────────────────────────────────
function TrendChart({entries,zones}){
  const d14=()=>{const d=new Date();d.setDate(d.getDate()-14);return d.toISOString().slice(0,10);};
  const[from,setFrom]=useState(d14);
  const[to,setTo]=useState(todayStr);
  const[variable,setVariable]=useState('drain_pct');
  const canvasRef=useRef(null);
  const chartRef=useRef(null);
  const VARS=[
    {id:'drain_pct',label:'Drain %',   fn:(d,z)=>{const r=calcDer(d,z.drainDrippers,z.privaDrippers);return r.pct;}},
    {id:'drip_ec',  label:'Drip EC',   fn:(d)=>{const v=parseFloat(d.drip_ec);return isNaN(v)||v<=0?null:v;}},
    {id:'drain_ec', label:'Drain EC',  fn:(d)=>{const v=parseFloat(d.drain_ec);return isNaN(v)||v<=0?null:v;}},
    {id:'drip_ph',  label:'Drip pH',   fn:(d)=>{const v=parseFloat(d.drip_ph);return isNaN(v)||v<=0?null:v;}},
    {id:'drain_ph', label:'Drain pH',  fn:(d)=>{const v=parseFloat(d.drain_ph);return isNaN(v)||v<=0?null:v;}},
    {id:'ec_sum',   label:'EC Sum',    fn:(d,z)=>{const r=calcDer(d,z.drainDrippers,z.privaDrippers);return r.ecSum;}},
  ];
  const COLORS=['#1976d2','#388e3c','#d32f2f','#f57c00','#7b1fa2','#0097a7','#689f38','#ffa000','#c2185b','#5d4037'];

  useEffect(()=>{
    if(!canvasRef.current||typeof Chart==='undefined')return;
    const sorted=Object.values(entries)
      .filter(e=>e&&e.date&&e.date>=from&&e.date<=to)
      .sort((a,b)=>a.date.localeCompare(b.date));
    if(sorted.length===0){if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}return;}
    const labels=sorted.map(e=>fmtDate(e.date));
    const varDef=VARS.find(v=>v.id===variable)||VARS[0];
    const datasets=zones.map((zone,i)=>{
      const data=sorted.map(entry=>{
        const d=entry[zone.id];if(!d)return null;
        const val=varDef.fn(d,zone);
        return(val===null||val===undefined||isNaN(val))?null:parseFloat(parseFloat(val).toFixed(2));
      });
      const lbl=zone.label.replace('Zone ','Z').replace(' North','N').replace(' South','S').replace('1.','');
      return{label:lbl,data,borderColor:COLORS[i%COLORS.length],backgroundColor:COLORS[i%COLORS.length]+'20',borderWidth:1.5,pointRadius:3,spanGaps:false,tension:0.15};
    });
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}
    chartRef.current=new Chart(canvasRef.current,{type:'line',data:{labels,datasets},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}},
        scales:{
          y:{title:{display:true,text:varDef.label,font:{size:11}},grid:{color:'rgba(0,0,0,.05)'}},
          x:{ticks:{maxRotation:40,font:{size:10}},grid:{color:'rgba(0,0,0,.03)'}}
        }
      }
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[from,to,variable,entries,zones]);

  const cnt=Object.values(entries).filter(e=>e&&e.date&&e.date>=from&&e.date<=to).length;
  return html`
  <div style=${{background:'#fff',border:'1.5px solid #e8e8e8',borderRadius:12,padding:'12px 14px',marginBottom:14}}>
    <p style=${{fontSize:11,fontWeight:700,color:'#555',letterSpacing:'.06em',textTransform:'uppercase',margin:'0 0 10px'}}>Trend Chart</p>
    <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      <input type="date" value=${from} onChange=${e=>setFrom(e.target.value)}
        style=${{flex:1,minWidth:110,padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafaf8'}}/>
      <span style=${{fontSize:12,color:'#aaa',alignSelf:'center'}}>→</span>
      <input type="date" value=${to} onChange=${e=>setTo(e.target.value)}
        style=${{flex:1,minWidth:110,padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafal8'}}/>
      <select value=${variable} onChange=${e=>setVariable(e.target.value)}
        style=${{width:'100%',padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafaf8',cursor:'pointer'}}>
        ${VARS.map(v=>html`<option key=${v.id} value=${v.id}>${v.label}</option>`)}
      </select>
    </div>
    ${cnt===0
      ?html`<p style=${{textAlign:'center',color:'#ccc',padding:'30px 0',fontSize:13}}>No entries in this date range</p>`
      :html`<div style=${{position:'relative',height:260}}><canvas ref=${canvasRef}></canvas></div>
            <p style=${{fontSize:10,color:'#ccc',marginTop:5,textAlign:'center'}}>${cnt} day${cnt!==1?'s':''} · tap legend labels to show/hide zones</p>`
    }
  </div>`;
}

function ZoneEditor({zones,onSave}){
  const[local,setLocal]=useState(zones.map(z=>({...z})));
  const[editId,setEditId]=useState(null);
  const[draft,setDraft]=useState(null);
  const[dirty,setDirty]=useState(false);
  const startEdit=z=>{setEditId(z.id);setDraft({...z});};
  const cancelEdit=()=>{setEditId(null);setDraft(null);};
  const saveEdit=()=>{setLocal(l=>l.map(z=>z.id===editId?{...draft}:z));setEditId(null);setDraft(null);setDirty(true);};
  const addZone=()=>{const nz={id:genId(),label:'New Zone',valve:'Valve —',location:'',variety:'',hasPriva:false,stage:'first_crop'};setLocal(l=>[...l,nz]);setEditId(nz.id);setDraft({...nz});setDirty(true);};
  const delZone=id=>{if(!confirm('Remove zone? Saved readings are not deleted.'))return;setLocal(l=>l.filter(z=>z.id!==id));setDirty(true);};
  const move=(id,dir)=>{setLocal(l=>{const i=l.findIndex(z=>z.id===id);if(i<0)return l;const n=[...l];const s=i+dir;if(s<0||s>=n.length)return l;[n[i],n[s]]=[n[s],n[i]];return n;});setDirty(true);};
  const sg=draft?GROWTH_STAGES[draft.stage||'first_crop']:null;

    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>

      <div style=${{display:'flex',gap:7}}>
        ${dirty?html`<button class="btn btn-sm" onClick=${()=>{onSave(local);setDirty(false);}}>Save changes</button>`:null}

      </div>
    </div>
    ${local.map((z,i)=>html`
    <div class="card" key=${z.id}>
      ${editId===z.id?html`
      <div class="ze-form">
        <div class="fg2">
          <div><label class="fl" style=${{fontSize:11}}>Zone label</label><${TInput} value=${draft.label} onChange=${v=>setDraft(d=>({...d,label:v}))} placeholder="Zone 1 North"/></div>
          <div><label class="fl" style=${{fontSize:11}}>Valve / Block</label><${TInput} value=${draft.valve} onChange=${v=>setDraft(d=>({...d,valve:v}))} placeholder="Valve 1"/></div>
        </div>
        <div style=${{marginBottom:8}}><label class="fl" style=${{fontSize:11}}>Location / description</label><${TInput} value=${draft.location} onChange=${v=>setDraft(d=>({...d,location:v}))} placeholder="e.g. 2nd Tunnel, 14 drippers"/></div>
        <div style=${{marginBottom:8}}><label class="fl" style=${{fontSize:11}}>Variety</label><${TInput} value=${draft.variety} onChange=${v=>setDraft(d=>({...d,variety:v}))} placeholder="e.g. Florida Beauty – 250cc"/></div>
        <div style=${{marginBottom:10}}>
          <label class="fl" style=${{fontSize:11}}>Current Growth Stage</label>
          <select style=${{width:'100%',padding:'8px 10px',border:'1.5px solid #ddd',borderRadius:8,fontSize:14,background:'#fafaf8',fontFamily:'inherit',outline:'none',cursor:'pointer'}}
            value=${draft.stage||'first_crop'} onChange=${e=>setDraft(d=>({...d,stage:e.target.value}))}>
            <option value="">— None (Raspberry / non-staged) —</option>
            ${STAGE_ORDER.map(k=>html`<option key=${k} value=${k}>${GROWTH_STAGES[k].label}</option>`)}
          </select>
          ${sg?html`<p style=${{fontSize:11,color:'#888',marginTop:4}}>Drip ${sg.drip[0]}–${sg.drip[1]} mS | Drain ${sg.drain[0]}–${sg.drain[1]} mS | R/O ${sg.pct[0]}–${sg.pct[1]}%</p>`:null}
        </div>
        <div style=${{marginBottom:10}}>
          <div class="fg2" style=${{marginBottom:0}}>
            <div>
              <label class="fl" style=${{fontSize:11}}>Drain drippers <span style=${{color:'#e65100'}}>*required for drain%</span></label>
              <input type="number" min="1" max="50" class="ti" style=${{fontSize:15}}
                value=${draft.drainDrippers||''} onInput=${e=>setDraft(d=>({...d,drainDrippers:parseInt(e.target.value)||null}))} placeholder="e.g. 13"/>
            </div>

                value=${draft.privaDrippers||''} onInput=${e=>setDraft(d=>({...d,privaDrippers:parseInt(e.target.value)||null}))} placeholder="e.g. 12"/>
              
    </div>`:null}
          </div>
          <p style=${{fontSize:11,color:'#888',marginTop:4}}>Number of emitters over which you collect drain (drip is always from 1). drain% = drain_mL ÷ (drip_mL × N).</p>
        </div>
        <label style=${{display:'flex',alignItems:'center',gap:7,fontSize:13,color:'#555',cursor:'pointer',marginBottom:12}}>
          <input type="checkbox" checked=${!!draft.hasPriva} onChange=${e=>setDraft(d=>({...d,hasPriva:e.target.checked}))} style=${{width:16,height:16}}/>

        <div style=${{display:'flex',gap:8}}>

          <span style=${{fontSize:11,color:'#aaa',marginLeft:7}}>${z.valve}</span>
          ${z.hasPriva?html`<span class="badge-priva">Priva</span>`:null}

          <button class="btn btn-sm btn-out" onClick=${()=>startEdit(z)}>Edit</button>
          <button class="btn btn-sm btn-danger" onClick=${()=>delZone(z.id)}>✕</button>
        </div>
      </div>`}
    </div>`)}
  </div>`;
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[cropId,setCropId]=useState('str');
  // Migrate old view keys to new top-level structure
  const[view,setView]=useState(()=>{
    const v=LS.get('hff:view','irrigation');
    if(['entry','history','zones'].includes(v))return 'irrigation';
    if(!['irrigation','spray','fert','orders','tasks','settings'].includes(v))return 'irrigation';
    return v;
  });
  const[irrView,setIrrView]=useState(()=>{
    const saved=LS.get('hff:irr_view',null);
    if(['entry','history','zones'].includes(saved))return saved;
    const old=LS.get('hff:view','entry');
    if(['entry','history','zones'].includes(old))return old;
    return 'entry';
  });
  const[date,setDate]=useState(todayStr);
  const[zones,setZones]=useState(()=>LS.get('hff:str:zones',STR_ZONES));
  const[entries,setEntries]=useState(()=>{const map={};LS.keys('hff:str:d:').forEach(k=>{const e=LS.get(k,null);if(e&&e.date)map[e.date]=e;});return map;});
  const[strat,setStrat]=useState(()=>LS.get('hff:str:strat',STR_STRAT));
  const[defaultStage,setDefaultStage]=useState(()=>LS.get('hff:str:defstage','first_crop'));
  const[aiOut,setAiOut]=useState('');
  const[aiLoading,setAiLoading]=useState(false);
  const[saved,setSaved]=useState(false);
  const[syncSt,setSyncSt]=useState('idle');
  const[invSyncSt,setInvSyncSt]=useState('idle');
  const[horizonDays,setHorizonDays]=useState(7);  // orders date range
  const[pickHorizon,setPickHorizon]=useState(4);  // pick list days
  const[customSkus,setCustomSkus]=useState(()=>LS.get('hff:ord:custom_skus',[]));
  const[showAddSku,setShowAddSku]=useState(false);
  const[newSkuName,setNewSkuName]=useState('');
  const[newSkuCrop,setNewSkuCrop]=useState('pumpkin'); // idle|syncing|ok|err
  const[lastSync,setLastSync]=useState(null);
  const sbOn=()=>!!(LS.get('hff:sb_url','')&&LS.get('hff:sb_key',''));

  const crop=CROPS[cropId];
  const isStraw=cropId==='str';

  // Reload state when crop changes
  // One-time migration: redirect old view values
  useEffect(()=>{
    const old=LS.get('hff:view','');
    if(['entry','history','zones'].includes(old)){
      setIrrView(old);
      setView('irrigation');
      LS.set('hff:irr_view',old);
      LS.set('hff:view','irrigation');
    }
  },[]);
  useEffect(()=>{
    setIrrView('entry');LS.set('hff:irr_view','entry');setDate(todayStr());setAiOut('');setSaved(false);
    const z=LS.get('hff:'+cropId+':zones',crop.zones);setZones(z);
    const map={};LS.keys('hff:'+cropId+':d:').forEach(k=>{const e=LS.get(k,null);if(e&&e.date)map[e.date]=e;});setEntries(map);
    setStrat(LS.get('hff:'+cropId+':strat',crop.strat));
    setDefaultStage(LS.get('hff:'+cropId+':defstage','first_crop'));
    // Pull from Supabase and merge with local (async, non-blocking)
    if(sbOn()){
      setSyncSt('syncing');
      sbPull(cropId).then(rows=>{
        if(rows){
          const mapRef={};LS.keys('hff:'+cropId+':d:').forEach(k=>{const e=LS.get(k,null);if(e?.date)mapRef[e.date]=e;});
          setEntries(prev=>{
            const base={...mapRef,...prev};
            const merged=mergeRemote(base,rows);
            Object.values(merged).forEach(e=>{LS.set('hff:'+cropId+':d:'+e.date,e);});
            return {...merged};
          });
          setSyncSt('ok');setLastSync(new Date());
        }else{setSyncSt('err');}
      });
    }
  },[cropId]);

  const entry=entries[date]||emptyDay(zones,date);
  const history=Object.values(entries).sort((a,b)=>b.date.localeCompare(a.date));

  const updateField=useCallback((zoneId,field,val)=>{
    setEntries(es=>{const cur=es[date]||emptyDay(zones,date);const upd={...cur,[zoneId]:{...(cur[zoneId]||emptyZone()),[field]:val}};return{...es,[date]:upd};});
    setSaved(false);
  },[date,zones]);

  const updateAttachments=useCallback(atts=>{
    setEntries(es=>{const cur=es[date]||emptyDay(zones,date);const upd={...cur,attachments:atts};LS.set('hff:'+cropId+':d:'+date,upd);return{...es,[date]:upd};});
  },[date,zones,cropId]);

  function saveEntry(){
    const ts=new Date().toISOString();
    const stamped={...entry,_savedAt:ts};
    LS.set('hff:'+cropId+':d:'+date,stamped);
    setEntries(es=>({...es,[date]:stamped}));setSaved(true);
    if(sbOn()){
      setSyncSt('syncing');
      sbPush(stamped,cropId).then(r=>{
        if(r.ok){setSyncSt('ok');setLastSync(new Date());}
        else setSyncSt('err');
      });
    }
  }

  async function syncNow(){
    setSyncSt('syncing');
    const rows=await sbPull(cropId);
    if(rows){
      setEntries(prev=>{
        const merged=mergeRemote({...prev},rows);
        Object.values(merged).forEach(e=>{LS.set('hff:'+cropId+':d:'+e.date,e);});
        return {...merged};
      });
      setSyncSt('ok');setLastSync(new Date());
    }else setSyncSt('err');
  }

  // Switch view and auto-pull on History/Today if sync is configured
  function switchView(v){
    setView(v);
    LS.set('hff:view',v);
    if(sbOn()&&v==='irrigation')syncNow();
  }

  // Poll Supabase every 5 minutes while the app is open
  useEffect(()=>{
    if(!sbOn())return;
    const id=setInterval(()=>{
      sbPull(cropId).then(rows=>{
        if(!rows)return;
        setEntries(prev=>{
          const merged=mergeRemote({...prev},rows);
          Object.values(merged).forEach(e=>LS.set('hff:'+cropId+':d:'+e.date,e));
          return merged;
        });
        setSyncSt('ok');setLastSync(new Date());
      });
    }, 5*60*1000); // every 5 minutes
    return ()=>clearInterval(id);
  },[cropId]);

  function saveZones(nz){setZones(nz);LS.set('hff:'+cropId+':zones',nz);}

  function updateZoneStage(zoneId,newStage){
    const updated=zones.map(z=>z.id===zoneId?{...z,stage:newStage}:z);
    setZones(updated);LS.set('hff:'+cropId+':zones',updated);
  }

  function saveStrat(s){setStrat(s);LS.set('hff:'+cropId+':strat',s);}
  function saveDefStage(s){setDefaultStage(s);LS.set('hff:'+cropId+':defstage',s);}

  async function runAI(){
    const apiKey=LS.get('hff:apikey','');
    if(!apiKey){setAiOut('⚠ No API key set — go to Settings to add your Anthropic API key.');return;}
    const prompt=buildPrompt(entry,zones,strat,crop.label,defaultStage);
    if(!prompt){setAiOut('⚠ No zone data entered yet — fill in at least one zone\'s drip EC to generate a briefing.');return;}
    setAiLoading(true);setAiOut('');
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1024,messages:[{role:'user',content:prompt}]})});
      const d=await r.json();
      if(!r.ok)setAiOut('API error ('+r.status+'): '+(d?.error?.message||JSON.stringify(d)));
      else setAiOut(d.content?.[0]?.text||'No response received.');
    }catch(e){setAiOut('Network error: '+e.message);}
    setAiLoading(false);
  }

  // Alert summary
  const allD=zones.map(z=>{const d=entry[z.id]||emptyZone();const{overall,flags}=zoneStatus(d,isStraw?(z.stage||null):null,z.drainDrippers,z.privaDrippers);return{zone:z,overall,flags};});
  const alerts=allD.filter(x=>x.overall==='danger');
  const warns=allD.filter(x=>x.overall==='warn');

  const histLvl=h=>zones.reduce((w,z)=>{const{overall}=zoneStatus(h[z.id]||emptyZone(),isStraw?(z.stage||null):null,z.drainDrippers,z.privaDrippers);return overall==='danger'?'danger':w==='danger'?'danger':overall==='warn'?'warn':w;},'ok');

  const{bg,acc,act,actTxt}=crop;
  const TABS=[{id:'irrigation',lbl:'🌿 Irrigation'},{id:'spray',lbl:'Spray'},{id:'fert',lbl:'Fert 🌱'},{id:'orders',lbl:'Orders 📦'},{id:'tasks',lbl:'Tasks 📋'}];

  const FlagBox=({level,items})=>items.length===0?null:html`
  <div class=${'flag-box '+level}>
    <div class=${'flag-ttl '+level}>${level==='danger'?'⚠ Action Required':'Caution'} — ${items.length} zone${items.length>1?'s':''}</div>
    ${items.map(({zone,flags})=>html`
    <div key=${zone.id} class=${'flag-item '+level}>
      <strong>${zone.label}:</strong> ${flags.filter(f=>f.lvl===level).map(f=>f.msg).join(' · ')||flags[0]?.msg||'Check readings'}
    </div>`)}
  </div>`;

  return html`
  <div style=${{fontFamily:'-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif',maxWidth:680,margin:'0 auto',paddingBottom:40}}>

    <div class="hdr" style=${{background:bg}}>
      <div class="hdr-row">
        <div>
          <div class="hdr-sub" style=${{color:acc}}>Howe Family Farms</div>
          <div class="hdr-title">Irrigation Monitor</div>
        </div>
        <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
          <div style=${{display:'flex',gap:5,alignItems:'center'}}>
            <button title="Settings" onClick=${()=>switchView('settings')}
              style=${{background:view==='settings'?acc:'transparent',border:'1.5px solid '+(view==='settings'?acc:'#555'),
                borderRadius:7,color:'#fff',fontSize:13,width:30,height:28,cursor:'pointer',
                display:'flex',alignItems:'center',justifyContent:'center'}}>⚙️</button>
          </div>
          ${sbOn()&&view==='irrigation'?html`<span class=${'sync-pill '+(syncSt==='syncing'?'sync-ing':syncSt==='ok'?'sync-ok':syncSt==='err'?'sync-err':'sync-idle')}>
            ${syncSt==='syncing'?'⟳':syncSt==='ok'?'☁ synced':syncSt==='err'?'⚠ sync error':'☁'}
          </span>`:null}
        </div>
      </div>
      <div class="vtabs">
        ${TABS.map(t=>html`
        <button key=${t.id} class="vtab" style=${{borderColor:view===t.id?acc:'#444',background:view===t.id?act:'transparent',color:view===t.id?actTxt:'#777'}} onClick=${()=>switchView(t.id)}>
          ${t.lbl}
        </button>`)}
      </div>
    </div>

    <div class="main">
      ${view==='irrigation'?html`
      <div>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
          <div class="crop-tabs">
            ${Object.values(CROPS).map(c=>html`
            <button key=${c.id} class=${'ctab'+(cropId===c.id?' active':'')} style=${{borderColor:cropId===c.id?acc:'#ccc',color:cropId===c.id?'#fff':'#666',background:cropId===c.id?acc:'transparent'}} onClick=${()=>setCropId(c.id)}>
              ${c.emoji} ${c.label}
            </button>`)}
          </div>
        </div>
        <div style=${{display:'flex',gap:4,marginBottom:12}}>
          ${[{id:'entry',lbl:'📅 Today'},{id:'history',lbl:'📈 History'},{id:'zones',lbl:'⚙️ Zones'}].map(t=>html`
          <button key=${t.id} onClick=${()=>{setIrrView(t.id);LS.set('hff:irr_view',t.id);}}
            style=${{flex:1,padding:'8px',borderRadius:8,border:'1.5px solid '+(irrView===t.id?acc:'#ddd'),
              background:irrView===t.id?acc:'transparent',color:irrView===t.id?'#fff':'#888',
              fontWeight:600,fontSize:12,cursor:'pointer',fontFamily:'inherit'}}>
            ${t.lbl}
          </button>`)}
        </div>
      </div>`:null}
      ${view==='irrigation'&&irrView==='entry'?html`
      <div>
        <div class="drow">
          <input type="date" value=${date} onChange=${e=>{setDate(e.target.value);setSaved(false);setAiOut('');}}/>
          ${sbOn()?html`<button title="Pull latest from cloud" onClick=${syncNow} disabled=${syncSt==='syncing'}
            style=${{padding:'9px 12px',borderRadius:8,border:'1.5px solid #ddd',background:'#fff',fontSize:15,cursor:syncSt==='syncing'?'default':'pointer',color:syncSt==='err'?'#c62828':syncSt==='ok'?'#2e7d32':'#666',flexShrink:0}}>
            ${syncSt==='syncing'?'⟳':syncSt==='err'?'⚠':'☁'}
          </button>`:null}
          <button class=${'btn'+(saved?' saved':'')} onClick=${saveEntry}>${saved?'✓ Saved':'Save'}</button>
        </div>
        ${isStraw?html`<${SeasonOverview} zones=${zones} onChangeStage=${updateZoneStage}/>`:null}
        <${ZoneSummaryChart} zones=${zones} entry=${entry}/>
        ${zones.map(z=>html`<${ZoneRow} key=${z.id} zone=${z} data=${entry[z.id]} onChange=${updateField}/>`)}
        <textarea class="notes-area" placeholder="Tech notes: hot day, bucket issues, maintenance, recipe change…"
          value=${entry.notes} onInput=${e=>setEntries(es=>({...es,[date]:{...(es[date]||emptyDay(zones,date)),notes:e.target.value}}))}></textarea>
        <${ImageSection} cropId=${cropId} date=${date} attachments=${entry.attachments||[]} onUpdate=${updateAttachments}
          entry=${entry} zones=${zones} stageKey=${isStraw?(entry[zones[0]?.id]?.drip_ec?zones[0]?.stage||defaultStage:defaultStage):null} cropLabel=${crop.label}/>
        <div class="ai-box">
          <div class="sec-lbl">AI Advisor</div>
          <p class="ai-hint">Evaluates each zone against its stage targets (Delphy protocol). Save first, then generate. Customise focus areas in Settings.</p>
          <button class=${'btn'+(aiLoading?' loading':'')} onClick=${runAI} disabled=${aiLoading}>${aiLoading?'Generating…':'Generate briefing ↗'}</button>
          ${aiOut?html`<div class=${'ai-out'+(aiOut.startsWith('⚠')||aiOut.startsWith('API')||aiOut.startsWith('Network')?' err':'')}>${aiOut}</div>`:null}
        </div>
        
    </div>`:null}

      ${view==='irrigation'&&irrView==='history'?html`
      <div>
        <${TrendChart} entries=${entries} zones=${zones}/>
        <div class="exp-row">
          <button class="btn btn-sm btn-out" onClick=${()=>exportCSV([entry],zones,cropId+'_irrigation_'+date+'.csv')}>↓ Export today</button>
          <button class="btn btn-sm" disabled=${history.length===0} style=${{opacity:history.length===0?0.4:1}} onClick=${()=>exportCSV(history,zones,cropId+'_irrigation_season_'+todayStr()+'.csv')}>↓ Export all history</button>
        </div>
        <p style=${{fontSize:13,color:'#aaa',marginBottom:10}}>${history.length} day${history.length!==1?'s':''} saved — ${crop.label}</p>
        ${history.length===0?html`<div class="empty">
          ${sbOn()?'No entries yet — if Binod has saved data, tap ☁ on the Today tab to pull from cloud.':'No saved entries yet for this crop.'}
          
    </div>`:null}
        ${history.map(h=>{
          const lvl=histLvl(h);
          return html`
          <button key=${h.date} class=${'hr-btn '+lvl} onClick=${()=>{setDate(h.date);setSaved(true);setAiOut('');setIrrView('entry');LS.set('hff:irr_view','entry');}}>
            <div style=${{display:'flex',alignItems:'center',gap:8}}>
              <span class=${'dot'+(lvl==='danger'?' danger':lvl==='warn'?' warn':'')}></span>
              <span style=${{fontWeight:600,fontSize:14,color:'#222'}}>${fmtDate(h.date)}</span>
              ${h.date===todayStr()?html`<span style=${{fontSize:11,background:'#e8f5e9',color:'#2e7d32',borderRadius:5,padding:'2px 7px',fontWeight:600}}>today</span>`:null}
              ${(h.attachments||[]).length>0?html`<span style=${{fontSize:11,color:'#aaa'}}>📸 ${(h.attachments||[]).length}</span>`:null}
            </div>
            <span style=${{fontSize:12,color:'#bbb'}}>→</span>
          </button>`;
        })}
        
    </div>`:null}

      ${view==='irrigation'&&irrView==='zones'?html`<${ZoneEditor} zones=${zones} onSave=${saveZones}/>`:null}

      ${view==='fert'?html`<${FertBrain}/>`:null}
      ${view==='orders'?html`<${OrderBrain}/>`:null}
      ${view==='tasks'?html`<${TaskBrain}/>`:null}
      ${view==='settings'?html`
      <${SettingsView} strat=${strat} defaultStage=${defaultStage} onSaveStrat=${saveStrat}
        onSaveStage=${saveDefStage} cropLabel=${crop.label} isStraw=${isStraw}
        syncSt=${syncSt} lastSync=${lastSync} onSyncNow=${syncNow}/>`:null}

      ${view==='spray'?html`<${SprayBrain}/>`:null}
    </div>
  </div>`;
}

prender(html`<${App}/>`,document.getElementById('app'));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
