  const[loginLoading,setLoginLoading]=useState(false);
  const[,forceUpdate]=useState(0);  // trigger re-render after login/logout

  async function doLogin(){
    if(!loginEmail||!loginPw){setLoginResult({ok:false,msg:'Enter email and password'});return;}
    setLoginLoading(true);setLoginResult(null);
    const r=await sbLogin(loginEmail,loginPw);
    setLoginResult(r);setLoginLoading(false);
    if(r.ok){setLoginPw('');forceUpdate(n=>n+1);}
  }
  const sg=GROWTH_STAGES[defaultStage];
  const kb=LS.kbUsed();
  const lastSyncStr=lastSync?lastSync.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):null;

  function saveSbConfig(){LS.set('hff:sb_url',sbUrl);LS.set('hff:sb_key',sbKey);LS.set('hff:sb_team',sbTeam);setSbSaved(true);setTimeout(()=>setSbSaved(false),2500);}
  async function doTest(){setTestResult({testing:true});const r=await sbTest();setTestResult(r);}

  return html`
  <div>
    <div class="sbox">
      <div class="sbox-title">☁ Cloud Sync — Supabase</div>
      <div class="sbox-hint">Connection config. The anon key is required for the connection; log in below to keep your data private.</div>
      <label class="fl" style=${{fontSize:11,marginTop:2}}>Supabase Project URL</label>
      <input class="apikey-in" type="url" value=${sbUrl} onInput=${e=>setSbUrl(e.target.value)} placeholder="https://xxxxxxxxxxxx.supabase.co"/>
      <label class="fl" style=${{fontSize:11}}>Anon / Public Key</label>
      <input class="apikey-in" type="password" value=${sbKey} onInput=${e=>setSbKey(e.target.value)} placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9…"/>
      <label class="fl" style=${{fontSize:11}}>Farm ID (same on all devices)</label>
      <input class="apikey-in" type="text" value=${sbTeam} onInput=${e=>setSbTeam(e.target.value)} placeholder="howe-farms-2026"/>
      <div style=${{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
        <button class="btn btn-sm" onClick=${saveSbConfig}>${sbSaved?'✓ Saved':'Save sync config'}</button>
        <button class="btn btn-sm btn-out" onClick=${doTest}>Test connection</button>
        ${onSyncNow?html`<button class="btn btn-sm btn-out" onClick=${onSyncNow} disabled=${syncSt==='syncing'}>↓ Pull latest now</button>`:null}
      </div>
      ${testResult&&!testResult.testing?html`<div class=${'test-result '+(testResult.ok?'test-ok':'test-err')}>${testResult.ok?'✓ '+testResult.msg:'✗ '+testResult.msg}</div>`:null}
      ${testResult?.testing?html`<div class="test-result" style=${{background:'#f5f5f5',color:'#888'}}>Testing…</div>`:null}
      ${lastSyncStr?html`<p style=${{fontSize:11,color:'#aaa',marginTop:6}}>Last sync: ${lastSyncStr}</p>`:null}
      <hr class="divider"/>
      <p style=${{fontSize:12,color:'#999',fontWeight:600,marginBottom:4}}>How it works</p>
      <p style=${{fontSize:12,color:'#bbb',lineHeight:1.6}}>
        Readings, notes and attachment metadata sync. Image files stay on each device (too large to sync).<br/>
        Last-write-wins: if two people edit the same day, the most recently saved version is kept.<br/>
        Works offline — saves locally and syncs when back online.
      </p>
    </div>
    <div class="sbox">
      <div class="sbox-title">🔒 Account Login</div>
      <div class="sbox-hint">Log in with your Supabase account to make your data private. Without login, anyone with your anon key can read your records.</div>
      ${sbIsLoggedIn()?html`
        <div style=${{background:'#e8f5e9',border:'1.5px solid #a5d6a7',borderRadius:8,padding:'10px 12px',marginBottom:10}}>
          <p style=${{fontSize:13,fontWeight:600,color:'#2e7d32',marginBottom:2}}>✓ Logged in</p>
          <p style=${{fontSize:12,color:'#555'}}>${LS.get('hff:sb_session',{}).email||'authenticated'}</p>
        </div>
        <button class="btn btn-sm btn-danger" onClick=${()=>{sbLogout();forceUpdate();}}>Log out</button>
      `:html`
        <label class="fl" style=${{fontSize:11}}>Email</label>
        <input class="apikey-in" type="email" value=${loginEmail} onInput=${e=>setLoginEmail(e.target.value)} placeholder="you@example.com"/>
        <label class="fl" style=${{fontSize:11}}>Password</label>
        <input class="apikey-in" type="password" value=${loginPw} onInput=${e=>setLoginPw(e.target.value)} placeholder="••••••••"
          onKeyDown=${e=>{if(e.key==='Enter')doLogin();}}/>
        <div style=${{display:'flex',gap:8,alignItems:'center'}}>
          <button class=${'btn btn-sm'+(loginLoading?' loading':'')} onClick=${doLogin} disabled=${loginLoading}>
            ${loginLoading?'Logging in…':'Log in'}
          </button>
          ${loginResult?html`<span class=${'test-result '+(loginResult.ok?'test-ok':'test-err')} style=${{marginTop:0}}>${loginResult.ok?'✓ Logged in':'✗ '+loginResult.msg}</span>`:null}
        </div>
        <p style=${{fontSize:11,color:'#bbb',marginTop:8,lineHeight:1.5}}>
          Use the email and password from your Supabase account (supabase.com → Account settings),
          or create a user in Supabase Authentication → Users.
        </p>
      `}
    </div>
    <div class="sbox">
      <div class="sbox-title">Anthropic API Key</div>
      <div class="sbox-hint">Required for AI briefings and chart analysis. Get one free at console.anthropic.com — costs under $1/month at daily use.</div>
      <input class="apikey-in" type="password" value=${apiDraft} onInput=${e=>setApiDraft(e.target.value)} placeholder="sk-ant-…"/>
      <div style=${{display:'flex',alignItems:'center',gap:10}}>
        <button class="btn btn-sm" onClick=${()=>{LS.set('hff:apikey',apiDraft);setApiSaved(true);setTimeout(()=>setApiSaved(false),2500);}}>Save key</button>
        ${apiSaved?html`<span style=${{fontSize:12,color:'#2e7d32',fontWeight:600}}>✓ Saved</span>`:null}
      </div>
    </div>
    ${isStraw?html`
    <div class="sbox">
      <div class="sbox-title">Default stage for new zones</div>
      <div class="sbox-hint">Each zone has its own stage — edit them in Season Overview on the Today screen or via the Zones tab. This only applies to newly added zones.</div>
      <select style=${{width:'100%',padding:'9px 12px',border:'1.5px solid #ddd',borderRadius:8,fontSize:14,background:'#fafaf8',fontFamily:'inherit',outline:'none',cursor:'pointer'}}
        value=${defaultStage} onChange=${e=>onSaveStage(e.target.value)}>
        ${STAGE_ORDER.map(k=>html`<option key=${k} value=${k}>${GROWTH_STAGES[k].label}</option>`)}
      </select>
      ${sg?html`
      <div class="stage-ref">
        <p style=${{fontSize:12,fontWeight:600,color:'#2e7d32',marginBottom:6}}>Targets: ${sg.label}</p>
        <div class="stage-ref-grid">
          ${[['Drip EC',sg.drip[0]+'–'+sg.drip[1]+' mS'],['Drain EC',sg.drain[0]+'–'+sg.drain[1]+' mS'],['Run-off',sg.pct[0]+'–'+sg.pct[1]+'%'],['Reduce if','drain >'+sg.reduceIf+' mS'],...(sg.raiseIf?[['Raise if','drain <'+sg.raiseIf+' mS']]:[])].map(([l,v])=>html`
          <div class="stage-ref-cell" key=${l}>
            <div class="stage-ref-lbl">${l}</div>
            <div class="stage-ref-val">${v}</div>
          </div>`)}
        </div>
      </div>`:null}
    </div>`:null}
    <div class="sbox">
      <div class="sbox-title">AI Briefing Strategy — ${cropLabel}</div>
      <div class="sbox-hint">Sent to the AI with every briefing. The <code style=${{background:'#f0f0f0',padding:'1px 4px',borderRadius:3,fontSize:12}}>{STAGE_BLOCK}</code> placeholder is automatically filled with current per-zone stage targets. Edit everything else freely.</div>
      <textarea class="strat-area" value=${stratDraft} onInput=${e=>{setStratDraft(e.target.value);setStratSaved(false);}}></textarea>
      <div class="sbtns">
        <button class="btn btn-sm" onClick=${()=>{onSaveStrat(stratDraft);setStratSaved(true);setTimeout(()=>setStratSaved(false),2500);}}>
          ${stratSaved?'✓ Saved':'Save strategy'}
        </button>
        <button class="btn btn-sm btn-muted" onClick=${()=>{const def=CROPS[cropLabel==='Strawberry'?'str':'ras'].strat;setStratDraft(def);onSaveStrat(def);}}>Reset to default</button>
      </div>
      <hr class="divider"/>
      <p style=${{fontSize:12,color:'#999',marginBottom:6,fontWeight:600}}>Ideas to add:</p>
      ${['Flag if any zone drain EC > stage upper bound for 3+ consecutive days → lab sample','Compare today vs yesterday and flag EC increases > 0.3 mS','Z2S is the chronic problem zone — always report it first','Note if high temp or dry conditions may explain EC climb (Na/Cl accumulation)'].map(ex=>html`<p key=${ex} style=${{fontSize:12,color:'#bbb',margin:'3px 0'}}>• "${ex}"</p>`)}
    </div>
    <div class="sbox">
      <div class="sbox-title">Storage Usage</div>
      <p style=${{fontSize:13,color:'#888'}}>Approximately <strong>${kb} KB</strong> used in this browser's local storage. Images are the main driver. If storage fills up, export your data and delete old entries.</p>
      <p class="storage-note">All data is stored locally on this device — nothing is sent to any server except the Anthropic API during AI briefings.</p>
    </div>
  </div>`;
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[cropId,setCropId]=useState('str');
  const[view,setView]=useState('entry');
  const[date,setDate]=useState(todayStr);
  const[zones,setZones]=useState(()=>LS.get('hff:str:zones',STR_ZONES));
  const[entries,setEntries]=useState(()=>{const map={};LS.keys('hff:str:d:').forEach(k=>{const e=LS.get(k,null);if(e&&e.date)map[e.date]=e;});return map;});
  const[strat,setStrat]=useState(()=>LS.get('hff:str:strat',STR_STRAT));
  const[defaultStage,setDefaultStage]=useState(()=>LS.get('hff:str:defstage','first_crop'));
  const[aiOut,setAiOut]=useState('');
  const[aiLoading,setAiLoading]=useState(false);
  const[saved,setSaved]=useState(false);
  const[syncSt,setSyncSt]=useState('idle'); // idle|syncing|ok|err
  const[lastSync,setLastSync]=useState(null);
  const sbOn=()=>!!(LS.get('hff:sb_url','')&&LS.get('hff:sb_key',''));

  const crop=CROPS[cropId];
  const isStraw=cropId==='str';

  // Reload state when crop changes
  useEffect(()=>{
    setView('entry');setDate(todayStr());setAiOut('');setSaved(false);
    const z=LS.get('hff:'+cropId+':zones',crop.zones);setZones(z);
    const map={};LS.keys('hff:'+cropId+':d:').forEach(k=>{const e=LS.get(k,null);if(e&&e.date)map[e.date]=e;});setEntries(map);
    setStrat(LS.get('hff:'+cropId+':strat',crop.strat));
    setDefaultStage(LS.get('hff:'+cropId+':defstage','first_crop'));
    // Pull from Supabase and merge with local (async, non-blocking)
    if(sbOn()){
      setSyncSt('syncing');
      sbPull(cropId).then(rows=>{
        if(rows){
          const mapRef={};LS.keys('hff:'+cropId+':d:').forEach(k=>{const e=LS.get(k,null);if(e?.date)mapRef[e.date]=e;});
          setEntries(prev=>{
            const base={...mapRef,...prev};
            const merged=mergeRemote(base,rows);
            Object.values(merged).forEach(e=>{LS.set('hff:'+cropId+':d:'+e.date,e);});
            return {...merged};
          });
          setSyncSt('ok');setLastSync(new Date());
        }else{setSyncSt('err');}
      });
    }
  },[cropId]);

  const entry=entries[date]||emptyDay(zones,date);
  const history=Object.values(entries).sort((a,b)=>b.date.localeCompare(a.date));

  const updateField=useCallback((zoneId,field,val)=>{
    setEntries(es=>{const cur=es[date]||emptyDay(zones,date);const upd={...cur,[zoneId]:{...(cur[zoneId]||emptyZone()),[field]:val}};return{...es,[date]:upd};});
    setSaved(false);
  },[date,zones]);

  const updateAttachments=useCallback(atts=>{
    setEntries(es=>{const cur=es[date]||emptyDay(zones,date);const upd={...cur,attachments:atts};LS.set('hff:'+cropId+':d:'+date,upd);return{...es,[date]:upd};});
  },[date,zones,cropId]);

  function saveEntry(){
    const ts=new Date().toISOString();
    const stamped={...entry,_savedAt:ts};
    LS.set('hff:'+cropId+':d:'+date,stamped);
    setEntries(es=>({...es,[date]:stamped}));setSaved(true);
    if(sbOn()){
      setSyncSt('syncing');
      sbPush(stamped,cropId).then(r=>{
        if(r.ok){setSyncSt('ok');setLastSync(new Date());}
        else setSyncSt('err');
      });
    }
  }

  async function syncNow(){
    setSyncSt('syncing');
    const rows=await sbPull(cropId);
    if(rows){
      setEntries(prev=>{
        const merged=mergeRemote({...prev},rows);
        Object.values(merged).forEach(e=>{LS.set('hff:'+cropId+':d:'+e.date,e);});
        return {...merged};
      });
      setSyncSt('ok');setLastSync(new Date());
    }else setSyncSt('err');
  }

  // Switch view and auto-pull on History/Today if sync is configured
  function switchView(v){
    setView(v);
    if(sbOn()&&(v==='history'||v==='entry')){
      syncNow();
    }
  }

  // Poll Supabase every 5 minutes while the app is open
  useEffect(()=>{
    if(!sbOn())return;
    const id=setInterval(()=>{
      sbPull(cropId).then(rows=>{
        if(!rows)return;
        setEntries(prev=>{
          const merged=mergeRemote({...prev},rows);
          Object.values(merged).forEach(e=>LS.set('hff:'+cropId+':d:'+e.date,e));
          return merged;
        });
        setSyncSt('ok');setLastSync(new Date());
      });
    }, 5*60*1000); // every 5 minutes
    return ()=>clearInterval(id);
  },[cropId]);

  function saveZones(nz){setZones(nz);LS.set('hff:'+cropId+':zones',nz);}

  function updateZoneStage(zoneId,newStage){
    const updated=zones.map(z=>z.id===zoneId?{...z,stage:newStage}:z);
    setZones(updated);LS.set('hff:'+cropId+':zones',updated);
  }

  function saveStrat(s){setStrat(s);LS.set('hff:'+cropId+':strat',s);}
  function saveDefStage(s){setDefaultStage(s);LS.set('hff:'+cropId+':defstage',s);}

  async function runAI(){
    const apiKey=LS.get('hff:apikey','');
    if(!apiKey){setAiOut('⚠ No API key set — go to Settings to add your Anthropic API key.');return;}
    const prompt=buildPrompt(entry,zones,strat,crop.label,defaultStage);
    if(!prompt){setAiOut('⚠ No zone data entered yet — fill in at least one zone\'s drip EC to generate a briefing.');return;}
    setAiLoading(true);setAiOut('');
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1024,messages:[{role:'user',content:prompt}]})});
      const d=await r.json();
      if(!r.ok)setAiOut('API error ('+r.status+'): '+(d?.error?.message||JSON.stringify(d)));
      else setAiOut(d.content?.[0]?.text||'No response received.');
    }catch(e){setAiOut('Network error: '+e.message);}
    setAiLoading(false);
  }

  // Alert summary
  const allD=zones.map(z=>{const d=entry[z.id]||emptyZone();const{overall,flags}=zoneStatus(d,isStraw?(z.stage||null):null,z.drainDrippers,z.privaDrippers);return{zone:z,overall,flags};});
  const alerts=allD.filter(x=>x.overall==='danger');
  const warns=allD.filter(x=>x.overall==='warn');

  const histLvl=h=>zones.reduce((w,z)=>{const{overall}=zoneStatus(h[z.id]||emptyZone(),isStraw?(z.stage||null):null,z.drainDrippers,z.privaDrippers);return overall==='danger'?'danger':w==='danger'?'danger':overall==='warn'?'warn':w;},'ok');

  const{bg,acc,act,actTxt}=crop;
  const TABS=[{id:'entry',lbl:'Today'},{id:'history',lbl:'History'},{id:'zones',lbl:'Zones'},{id:'spray',lbl:'Spray'},{id:'fert',lbl:'Fert 🌱'},{id:'settings',lbl:'Settings'}];

  const FlagBox=({level,items})=>items.length===0?null:html`
  <div class=${'flag-box '+level}>
    <div class=${'flag-ttl '+level}>${level==='danger'?'⚠ Action Required':'Caution'} — ${items.length} zone${items.length>1?'s':''}</div>
    ${items.map(({zone,flags})=>html`
    <div key=${zone.id} class=${'flag-item '+level}>
      <strong>${zone.label}:</strong> ${flags.filter(f=>f.lvl===level).map(f=>f.msg).join(' · ')||flags[0]?.msg||'Check readings'}
    </div>`)}
  </div>`;

  return html`
  <div style=${{fontFamily:'-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif',maxWidth:680,margin:'0 auto',paddingBottom:40}}>

    <div class="hdr" style=${{background:bg}}>
      <div class="hdr-row">
        <div>
          <div class="hdr-sub" style=${{color:acc}}>Howe Family Farms</div>
          <div class="hdr-title">Irrigation Monitor</div>
        </div>
        <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
          <div class="crop-tabs">
            ${Object.values(CROPS).map(c=>html`
            <button key=${c.id} class=${'ctab'+(cropId===c.id?' active':'')} style=${{borderColor:cropId===c.id?acc:'#444'}} onClick=${()=>setCropId(c.id)}>
              ${c.emoji} ${c.label}
            </button>`)}
          </div>
          ${sbOn()?html`<span class=${'sync-pill '+(syncSt==='syncing'?'sync-ing':syncSt==='ok'?'sync-ok':syncSt==='err'?'sync-err':'sync-idle')}>
            ${syncSt==='syncing'?'⟳':syncSt==='ok'?'☁ synced':syncSt==='err'?'⚠ sync error':'☁'}
          </span>`:null}
        </div>
      </div>
      <div class="vtabs">
        ${TABS.map(t=>html`
        <button key=${t.id} class="vtab" style=${{borderColor:view===t.id?acc:'#444',background:view===t.id?act:'transparent',color:view===t.id?actTxt:'#777'}} onClick=${()=>switchView(t.id)}>
          ${t.lbl}
        </button>`)}
      </div>
    </div>

    <div class="main">
      ${view==='entry'?html`
      <div>
        <div class="drow">
          <input type="date" value=${date} onChange=${e=>{setDate(e.target.value);setSaved(false);setAiOut('');}}/>
          ${sbOn()?html`<button title="Pull latest from cloud" onClick=${syncNow} disabled=${syncSt==='syncing'}
            style=${{padding:'9px 12px',borderRadius:8,border:'1.5px solid #ddd',background:'#fff',fontSize:15,cursor:syncSt==='syncing'?'default':'pointer',color:syncSt==='err'?'#c62828':syncSt==='ok'?'#2e7d32':'#666',flexShrink:0}}>
            ${syncSt==='syncing'?'⟳':syncSt==='err'?'⚠':'☁'}
          </button>`:null}
          <button class=${'btn'+(saved?' saved':'')} onClick=${saveEntry}>${saved?'✓ Saved':'Save'}</button>
        </div>
        ${isStraw?html`<${SeasonOverview} zones=${zones} onChangeStage=${updateZoneStage}/>`:null}
        <${FlagBox} level="danger" items=${alerts}/>
        <${FlagBox} level="warn" items=${warns}/>
        ${zones.map(z=>html`<${ZoneRow} key=${z.id} zone=${z} data=${entry[z.id]} onChange=${updateField}/>`)}
        <textarea class="notes-area" placeholder="Tech notes: hot day, bucket issues, maintenance, recipe change…"
          value=${entry.notes} onInput=${e=>setEntries(es=>({...es,[date]:{...(es[date]||emptyDay(zones,date)),notes:e.target.value}}))}></textarea>
        <${ImageSection} cropId=${cropId} date=${date} attachments=${entry.attachments||[]} onUpdate=${updateAttachments}
          entry=${entry} zones=${zones} stageKey=${isStraw?(entry[zones[0]?.id]?.drip_ec?zones[0]?.stage||defaultStage:defaultStage):null} cropLabel=${crop.label}/>
        <div class="ai-box">
          <div class="sec-lbl">AI Advisor</div>
          <p class="ai-hint">Evaluates each zone against its stage targets (Delphy protocol). Save first, then generate. Customise focus areas in Settings.</p>
          <button class=${'btn'+(aiLoading?' loading':'')} onClick=${runAI} disabled=${aiLoading}>${aiLoading?'Generating…':'Generate briefing ↗'}</button>
          ${aiOut?html`<div class=${'ai-out'+(aiOut.startsWith('⚠')||aiOut.startsWith('API')||aiOut.startsWith('Network')?' err':'')}>${aiOut}</div>`:null}
        </div>
      </div>`:null}

      ${view==='history'?html`
      <div>
        <${TrendChart} entries=${entries} zones=${zones}/>
        <div class="exp-row">
          <button class="btn btn-sm btn-out" onClick=${()=>exportCSV([entry],zones,cropId+'_irrigation_'+date+'.csv')}>↓ Export today</button>
          <button class="btn btn-sm" disabled=${history.length===0} style=${{opacity:history.length===0?0.4:1}} onClick=${()=>exportCSV(history,zones,cropId+'_irrigation_season_'+todayStr()+'.csv')}>↓ Export all history</button>
        </div>
        <p style=${{fontSize:13,color:'#aaa',marginBottom:10}}>${history.length} day${history.length!==1?'s':''} saved — ${crop.label}</p>
        ${history.length===0?html`<div class="empty">
          ${sbOn()?'No entries yet — if Binod has saved data, tap ☁ on the Today tab to pull from cloud.':'No saved entries yet for this crop.'}
        </div>`:null}
        ${history.map(h=>{
          const lvl=histLvl(h);
          return html`
          <button key=${h.date} class=${'hr-btn '+lvl} onClick=${()=>{setDate(h.date);setSaved(true);setAiOut('');setView('entry');}}>
            <div style=${{display:'flex',alignItems:'center',gap:8}}>
              <span class=${'dot'+(lvl==='danger'?' danger':lvl==='warn'?' warn':'')}></span>
              <span style=${{fontWeight:600,fontSize:14,color:'#222'}}>${fmtDate(h.date)}</span>
              ${h.date===todayStr()?html`<span style=${{fontSize:11,background:'#e8f5e9',color:'#2e7d32',borderRadius:5,padding:'2px 7px',fontWeight:600}}>today</span>`:null}
              ${(h.attachments||[]).length>0?html`<span style=${{fontSize:11,color:'#aaa'}}>📸 ${(h.attachments||[]).length}</span>`:null}
            </div>
            <span style=${{fontSize:12,color:'#bbb'}}>→</span>
          </button>`;
        })}
      </div>`:null}

      ${view==='zones'?html`<${ZoneEditor} zones=${zones} onSave=${saveZones}/>`:null}

      ${view==='fert'?html`<${FertBrain}/>`:null}
      ${view==='settings'?html`
      <${SettingsView} strat=${strat} defaultStage=${defaultStage} onSaveStrat=${saveStrat}
        onSaveStage=${saveDefStage} cropLabel=${crop.label} isStraw=${isStraw}
        syncSt=${syncSt} lastSync=${lastSync} onSyncNow=${syncNow}/>`:null}

      ${view==='spray'?html`<${SprayBrain}/>`:null}
    </div>
  </div>`;
}

prender(html`<${App}/>`,document.getElementById('app'));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
