<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Irrigation">

<title>Irrigation Monitor – Howe Family Farms</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#f0f2ee}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;color:#1a1a1a;padding-bottom:env(safe-area-inset-bottom);padding-top:env(safe-area-inset-top)}
input,textarea,button,select{font-family:inherit;font-size:inherit}
button{cursor:pointer}
.hdr{padding:14px 16px 12px;border-radius:0 0 16px 16px;margin-bottom:14px;position:sticky;top:0;z-index:20}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.hdr-sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:2px}
.hdr-title{font-size:16px;color:#fff;font-weight:600}
.crop-tabs{display:flex;gap:6px}
.ctab{padding:6px 12px;border-radius:8px;border:1.5px solid #444;font-size:12px;font-weight:600;background:transparent;color:#888}
.ctab.active{background:rgba(255,255,255,.13);color:#fff}
.vtabs{display:flex;gap:5px}
.vtab{flex:1;padding:5px 0;border-radius:7px;border:1.5px solid #444;font-size:12px;font-weight:600;background:transparent;color:#777;text-align:center}
.main{padding:12px 12px 80px}
.card{background:#fff;border:1.5px solid #e8e8e8;border-radius:12px;margin-bottom:10px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:#fafaf8;border:none;width:100%;text-align:left;gap:8px}
.card-head.danger{background:#fff5f5}
.card-head.warn{background:#fffde7}
.chl{display:flex;align-items:center;gap:7px;min-width:0}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#43a047}
.dot.warn{background:#f9a825}
.dot.danger{background:#e53935}
.zname{font-weight:600;font-size:14px;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vname{font-size:11px;color:#aaa;flex-shrink:0}
.sbadge{font-size:10px;background:#f0f4ef;color:#2e7d32;border-radius:5px;padding:1px 5px;font-weight:600;flex-shrink:0;white-space:nowrap}
.chips{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}
.chip{font-size:10px;font-weight:600;padding:2px 6px;border-radius:5px;border:1px solid;white-space:nowrap;max-width:180px;overflow:hidden;text-overflow:ellipsis}
.chip-ok{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7}
.chip-warn{background:#fff8e1;color:#e65100;border-color:#ffe082}
.chip-danger{background:#ffebee;color:#c62828;border-color:#ef9a9a}
.chip-neutral{background:#f5f5f5;color:#888;border-color:#e0e0e0}
.chev{font-size:13px;color:#bbb;margin-left:2px;flex-shrink:0}
.cbody{padding:11px 13px;border-top:1px solid #f2f2f2;display:none}
.cbody.open{display:block}
.zloc{font-size:10px;color:#ccc;letter-spacing:.04em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.flbl{font-size:12px;font-weight:600;color:#666;margin-bottom:6px}
.fg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
.fl{font-size:10px;color:#aaa;margin-bottom:3px;display:block}
input[type=number]{width:100%;padding:9px 8px;border:1.5px solid #ddd;border-radius:7px;font-size:15px;background:#fafaf8;outline:none;-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number].ph-alert{border-color:#ef9a9a;background:#fff5f5}
input[type=number]:focus,input[type=text]:focus,textarea:focus,select:focus{border-color:#1a2b1a!important}
.priva-box{background:#f3f4f6;border-radius:8px;padding:8px 10px;margin-top:10px}
.priva-lbl{font-size:10px;font-weight:600;color:#777;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.flag-box{border-radius:10px;padding:10px 12px;margin-bottom:10px;border:1.5px solid}
.flag-box.danger{background:#ffebee;border-color:#ef9a9a}
.flag-box.warn{background:#fff8e1;border-color:#ffe082}
.flag-ttl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.flag-ttl.danger{color:#c62828}
.flag-ttl.warn{color:#e65100}
.flag-item{font-size:13px;margin:2px 0}
.flag-item.danger{color:#c62828}
.flag-item.warn{color:#e65100}
.drow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
input[type=date]{flex:1;padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#fafaf8;outline:none}
.btn{padding:9px 20px;border-radius:8px;font-weight:600;font-size:13px;border:none;background:#1a2b1a;color:#fff}
.btn.saved{background:#e8f5e9;color:#2e7d32}
.btn.loading{background:#e0e0e0;color:#888;cursor:default}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:7px}
.btn-out{background:transparent!important;border:1.5px solid #1a2b1a!important;color:#1a2b1a!important}
.btn-danger{background:transparent!important;border:1.5px solid #ef9a9a!important;color:#c62828!important}
.btn-muted{background:transparent;border:1.5px solid #ddd;color:#666}
textarea{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:10px;font-size:14px;resize:vertical;background:#fafaf8;outline:none;box-sizing:border-box}
.notes-area{min-height:65px;margin-bottom:14px}
.ai-box{background:#f8faf6;border:1.5px solid #c8e6c9;border-radius:12px;padding:14px}
.sec-lbl{font-size:11px;font-weight:600;color:#2e7d32;letter-spacing:.06em;text-transform:uppercase;margin-bottom:5px}
.ai-hint{font-size:13px;color:#666;margin-bottom:10px}
.ai-out{margin-top:12px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px;font-size:14px;line-height:1.7;white-space:pre-wrap}
.ai-out.err{color:#c62828}
.hr-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:#fff;border:1.5px solid;border-radius:10px;margin-bottom:8px;text-align:left}
.hr-btn.ok{border-color:#e8e8e8}
.hr-btn.warn{border-color:#ffe082}
.hr-btn.danger{border-color:#ef9a9a}
.exp-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.sbox{background:#fff;border:1.5px solid #e8e8e8;border-radius:12px;padding:14px;margin-bottom:14px}
.sbox-title{font-weight:600;font-size:14px;color:#222;margin-bottom:4px}
.sbox-hint{font-size:13px;color:#888;margin-bottom:10px;line-height:1.55}
.strat-area{min-height:230px;font-size:13px;line-height:1.6;margin-bottom:0}
.ti{width:100%;padding:8px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#fafaf8;outline:none}
.apikey-in{width:100%;padding:9px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:14px;background:#fafaf8;outline:none;margin-bottom:8px}
.ze-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;gap:8px}
.ze-form{padding:12px 13px;background:#fafaf8;border-top:1px solid #f0f0f0}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.reorder-btn{padding:4px 9px;border:1.5px solid #e0e0e0;border-radius:6px;background:transparent;font-size:13px;color:#666}
.reorder-btn:disabled{color:#ddd;cursor:default}
.badge-priva{font-size:10px;background:#e8eaf6;color:#3949ab;border-radius:5px;padding:2px 6px;font-weight:600;margin-left:5px}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.img-card{background:#fff;border:1.5px solid #e8e8e8;border-radius:10px;overflow:hidden}
.img-thumb{width:100%;height:110px;object-fit:cover;display:block;cursor:zoom-in}
.img-ph{height:80px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;font-size:12px;color:#ccc}
.img-inner{padding:7px 8px}
.img-cap{width:100%;border:none;border-bottom:1px solid #f0f0f0;background:transparent;font-size:11px;color:#555;outline:none;padding:0 0 4px;box-sizing:border-box}
.img-analyse{margin-top:6px;width:100%;padding:6px 0;border-radius:6px;border:none;font-size:11px;font-weight:600}
.img-analysis{margin-top:7px;font-size:11px;line-height:1.6;color:#333;background:#f8faf6;border-radius:6px;padding:7px 8px;white-space:pre-wrap;max-height:220px;overflow-y:auto}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:92vh;border-radius:8px;object-fit:contain}
.lightbox-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);border:none;color:#fff;font-size:20px;border-radius:50%;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.season-bar{background:#f0f4ef;border:1px solid #c8dcc5;border-radius:10px;padding:9px 13px;margin-bottom:12px}
.season-bar-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.season-groups{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.sgbadge{font-size:11px;border-radius:5px;padding:2px 7px;font-weight:600}
.stage-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #e0ece0;flex-wrap:wrap}
.stage-row:last-child{border-bottom:none}
.stage-sel{padding:5px 8px;border:1.5px solid #c8dcc5;border-radius:6px;font-size:12px;background:#fff;color:#1a2b1a;outline:none;cursor:pointer}
.stage-targets{font-size:11px;color:#888;white-space:nowrap}
.empty{text-align:center;padding:40px 20px;color:#ccc;font-size:14px}
.sbtns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.stage-ref{margin-top:10px;background:#f0f4ef;border:1px solid #c8dcc5;border-radius:8px;padding:10px 12px}
.stage-ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:6px}
.stage-ref-cell{background:#fff;border:1px solid #c8dcc5;border-radius:6px;padding:6px 8px}
.stage-ref-lbl{font-size:10px;color:#888;font-weight:600;margin-bottom:2px}
.stage-ref-val{font-size:12px;font-weight:600;color:#1a2b1a}
.storage-note{font-size:11px;color:#bbb;margin-top:6px}
hr.divider{border:none;border-top:1px solid #f0f0f0;margin:12px 0}
@media print{
  .hdr,.vtabs,.exp-row,.sbtns,.fert-sub-tabs,.hv-sub-tabs,.ai-box,
  button:not(.audit-chk-lbl),.drow,.crop-tabs{display:none!important}
  body{font-size:8pt;background:#fff}
  .card{border:1px solid #ccc;border-radius:0;page-break-inside:avoid}
  .audit-tbl th,.audit-tbl td{font-size:7.5pt!important;padding:3px 5px!important}
  .audit-tbl{width:100%;border-collapse:collapse}
  @page{size:landscape;margin:1cm}
}
.audit-tbl,.sp-gap-table{width:100%;border-collapse:collapse;font-size:11px}
.audit-tbl th,.sp-gap-table th{background:#f5f5f0;font-size:10px;font-weight:700;padding:6px 8px;
  text-align:left;white-space:nowrap;border-bottom:2px solid #ddd;color:#555;
  letter-spacing:.02em}
.audit-tbl td,.sp-gap-table td{padding:6px 8px;border-bottom:1px solid #f0f0f0;vertical-align:top;
  font-size:11px;white-space:nowrap}
.audit-tbl tr:hover td,.sp-gap-table tr:hover td{background:#fafaf8}
.audit-chk-cell{text-align:center}
.audit-date-input{border:none;background:transparent;font-size:10px;color:#555;
  cursor:pointer;width:90px;font-family:inherit;outline:none}

.fert-sub-tabs{display:flex;gap:4px;margin-bottom:12px}
.fert-sub-tab{flex:1;padding:7px 2px;border-radius:8px;border:1.5px solid #ddd;background:transparent;font-size:11px;font-weight:600;color:#888;text-align:center;cursor:pointer;font-family:inherit}
.fert-ingredient{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid #f2f2f2;cursor:pointer}
.fert-ingredient:last-child{border-bottom:none}
.fert-ing-qty{font-size:14px;font-weight:700;color:#2e7d32;min-width:70px;flex-shrink:0;margin-top:1px}
.fert-ing-name{font-size:14px;font-weight:500}
.fert-ing-note{font-size:11px;color:#bbb;margin-top:2px}
.fert-zone-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f5f5f5;cursor:pointer}
.fert-zone-row:last-child{border-bottom:none}
.fert-zone-name{flex:1;font-size:14px;font-weight:600}
.fert-litres{font-size:15px;font-weight:700;min-width:68px;text-align:right}
.fert-check{width:20px;height:20px;cursor:pointer;accent-color:#2e7d32;flex-shrink:0}
.fert-confirm-btn{width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;margin-top:10px;cursor:pointer;font-family:inherit;transition:background .2s}
.fert-log-item{border-radius:8px;padding:9px 12px;margin-bottom:6px;border:1px solid}
.fert-schedule-row{display:flex;align-items:center;gap:10px;background:#f7faf7;border-radius:8px;padding:9px 12px;margin-bottom:6px}

.sync-pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;white-space:nowrap}
.sync-idle{background:rgba(255,255,255,.08);color:rgba(255,255,255,.4)}
.sync-ing{background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);animation:spin .8s linear infinite}
.sync-ok{background:rgba(100,220,130,.18);color:#9de09d}
.sync-err{background:rgba(255,120,100,.18);color:#ffb3a7}
.sync-off{background:rgba(255,255,255,.06);color:rgba(255,255,255,.25)}
@keyframes spin{to{transform:rotate(360deg)}}
.test-result{font-size:12px;margin-top:6px;padding:5px 9px;border-radius:6px;font-weight:600}
.test-ok{background:#e8f5e9;color:#2e7d32}
.test-err{background:#ffebee;color:#c62828}
/* ── SPRAY BRAIN ─────────────────────────────────────────────────────────── */
.sp-screen{display:none}.sp-screen.sp-on{display:block}
.sp-nav{display:flex;border-bottom:1px solid #e8e8e8;margin-bottom:14px;background:#fff;position:sticky;top:64px;z-index:10}
.sp-nb{flex:1;padding:9px 4px 7px;border:none;background:none;font-size:11px;color:#888;cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600}
.sp-nb span{font-size:16px}.sp-nb.sp-on{color:#1a2b1a;border-bottom:2px solid #1a2b1a}
.sp-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sp-stat{background:#f5f5f3;border-radius:10px;padding:10px 12px}
.sp-stat .n{font-size:20px;font-weight:700;line-height:1}.sp-stat .l{font-size:10px;color:#888;margin-top:2px;text-transform:uppercase;letter-spacing:.04em}
.sp-flag{border-radius:8px;padding:9px 11px;margin-bottom:6px;font-size:12px;line-height:1.5;display:flex;gap:8px}
.sp-flag strong{font-weight:600}
.sp-fr{background:#ffebee;color:#c62828;border:1px solid #ef9a9a}
.sp-fa{background:#fff8e1;color:#b36200;border:1px solid #ffe082}
.sp-fg{background:#e8f5e9;color:#2e7d32;border:1px solid #a5d6a7}
.sp-ev{border:1.5px solid #e8e8e8;border-radius:10px;padding:10px 12px;margin-bottom:7px;background:#fff}
.sp-ev-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.sp-ev-date{font-size:12px;font-weight:700}
.sp-ev-meta{display:flex;gap:5px;align-items:center}
.sp-loc-t{font-size:10px;background:#e8f5e9;color:#2e7d32;border-radius:5px;padding:2px 7px;font-weight:600}
.sp-loc-f{font-size:10px;background:#e3f2fd;color:#0277bd;border-radius:5px;padding:2px 7px;font-weight:600}
.sp-pills{display:flex;flex-wrap:wrap;gap:4px}
.sp-pill{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:600}
.sp-pf{background:#e8f5e9;color:#2e7d32}.sp-pi{background:#fff8e1;color:#b36200}.sp-pn{background:#f5f5f5;color:#888}
.sp-ev-foot{font-size:10px;color:#aaa;margin-top:5px}
.sp-frac-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:4px}
.sp-fc{border-radius:8px;padding:6px 5px;text-align:center;border:1px solid #e8e8e8}
.sp-fc .g{font-size:11px;font-weight:700}.sp-fc .n2{font-size:9px;color:#666;margin-top:2px;line-height:1.3}.sp-fc .u{font-size:9px;margin-top:2px;font-weight:600}
.sp-chi{background:#ffebee;border-color:#ef9a9a;color:#c62828}.sp-cmd{background:#fff8e1;border-color:#ffe082;color:#b36200}.sp-clo{background:#e8f5e9;border-color:#a5d6a7;color:#2e7d32}.sp-cno{background:#f5f5f5;color:#aaa}
.sp-form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.sp-lbl{font-size:11px;color:#666;margin-bottom:3px;display:block;font-weight:600}
.sp-sel{width:100%;padding:8px 10px;border:1.5px solid #ddd;border-radius:8px;font-size:13px;background:#fafaf8;outline:none}
.sp-sel:focus{border-color:#1a2b1a}
.sp-pe{border:1.5px solid #e8e8e8;border-radius:8px;padding:8px 10px;margin-bottom:6px;background:#fafaf8}
.sp-pr{display:grid;grid-template-columns:1fr 68px 56px 22px;gap:6px;align-items:center}
.sp-prate{font-size:11px;color:#888;margin-top:3px}
.sp-pflag{font-size:10px;color:#c62828;margin-top:2px}
.sp-addp{width:100%;background:none;border:1.5px dashed #ccc;border-radius:7px;padding:8px;font-size:12px;color:#888;cursor:pointer;margin-bottom:9px}
.sp-addp:hover{background:#f5f5f3}
.sp-rmb{background:none;border:none;cursor:pointer;color:#bbb;font-size:14px;padding:0;line-height:1}
.sp-rmb:hover{color:#c62828}
.sp-iwarn{background:#ffebee;border-radius:6px;padding:7px 10px;font-size:11px;color:#c62828;margin-top:6px;border:1px solid #ef9a9a}
.sp-mono{background:#f5f5f3;border:1.5px solid #e8e8e8;border-radius:8px;padding:11px;font-size:12px;line-height:1.75;white-space:pre-wrap;font-family:'SF Mono','Fira Code',monospace;overflow-x:auto;margin-top:8px}
.sp-cpb{background:none;border:1.5px solid #ddd;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;color:#666;float:right}
.sp-cpb:hover{background:#f5f5f3}
.sp-tinfo{font-size:11px;color:#888;margin-bottom:10px}
.sp-frow3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:9px}
.sp-filter-row{display:flex;gap:6px;margin-bottom:10px}
.sp-fb{background:none;border:1.5px solid #ddd;border-radius:6px;padding:4px 12px;font-size:11px;cursor:pointer;color:#666;font-weight:600}
.sp-fb.sp-on{background:#1a2b1a;color:#fff;border-color:#1a2b1a}
.sp-sec{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#888;margin-bottom:8px;margin-top:14px}
.sp-sec:first-child{margin-top:0}
.sp-divider{border-top:1px solid #f0f0f0;margin:12px 0}
.sp-gap-table{width:100%;border-collapse:collapse;font-size:11px;min-width:580px}
.sp-gap-table th{padding:4px 8px;border-bottom:1.5px solid #e8e8e4;text-align:left;font-size:10px;font-weight:700;color:#888;white-space:nowrap;background:#fafaf8}
.sp-gap-table td{padding:5px 8px;border-bottom:0.5px solid #f0f0ee;white-space:nowrap}
.sp-ai-box{background:#f8faf6;border:1.5px solid #c8e6c9;border-radius:12px;padding:14px;margin-top:10px}
.sp-sync-badge{margin-left:auto;font-size:10px;font-weight:600;color:#888}
.sp-sync-ok{color:#2e7d32}
.sp-sync-err{color:#c62828}
.sp-ai-out{margin-top:10px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px;font-size:13px;line-height:1.7;white-space:pre-wrap}

// ── DOMAIN LOGIC ──────────────────────────────────────────────────────────────
const emptyZone=()=>({drip_ec:'',drip_ph:'',drip_ml:'',drain_ec:'',drain_ph:'',drain_ml:'',priva_ec:'',priva_ph:'',priva_ml:''});
const emptyDay=(zones,dt)=>{const d={date:dt||todayStr(),notes:'',attachments:[]};zones.forEach(z=>{d[z.id]=emptyZone();});return d;};

// CORRECTED: drain% = drain_ml / (drip_ml * N) * 100
// drip from 1 emitter, drain from N emitters
function calcDer(z={},drainDrippers,privaDrippers){
  const dm=parseFloat(z.drip_ml)||0,rm=parseFloat(z.drain_ml)||0;
  const pct=(dm>0&&rm>=0&&drainDrippers>0)?rm/(dm*drainDrippers)*100:null;
  const a=parseFloat(z.drip_ec),b=parseFloat(z.drain_ec);
  const ecSum=(!isNaN(a)&&!isNaN(b)&&a>0&&b>0)?a+b:null;
  const prm=parseFloat(z.priva_ml)||0;
  const privaPct=(dm>0&&prm>0&&privaDrippers>0)?prm/(dm*privaDrippers)*100:null;
  return{pct,ecSum,privaPct};
}

function zoneStatus(data={},stageKey,drainDrippers,privaDrippers){
  const sg=GROWTH_STAGES[stageKey];
  if(!sg){
    const der=calcDer(data,drainDrippers,privaDrippers),ph=parseFloat(data.drip_ph);
    if(der.ecSum>3.5||(der.pct!==null&&der.pct<8))return{overall:'danger',flags:[]};
    if(der.ecSum>3.0||(der.pct!==null&&der.pct<15))return{overall:'warn',flags:[]};
    if(!isNaN(ph)&&(ph<5.0||ph>7.0))return{overall:'danger',flags:[]};
    if(!isNaN(ph)&&(ph<5.3||ph>6.5))return{overall:'warn',flags:[]};
    return{overall:'ok',flags:[]};
  }
  const dec=parseFloat(data.drip_ec),drc=parseFloat(data.drain_ec),ph=parseFloat(data.drip_ph);
  const der=calcDer(data,drainDrippers,privaDrippers);
  const flags=[];let overall='ok';
  if(!isNaN(drc)&&drc>0&&drc>sg.reduceIf){flags.push({lvl:'danger',msg:`Drain EC ${drc.toFixed(2)} > ${sg.reduceIf} → Reduce drip EC`});overall='danger';}
  else if(!isNaN(drc)&&drc>0&&drc>sg.drain[1]){flags.push({lvl:'warn',msg:`Drain EC ${drc.toFixed(2)} above target (${sg.drain[0]}–${sg.drain[1]})`});if(overall!=='danger')overall='warn';}
  else if(sg.raiseIf!==null&&!isNaN(drc)&&drc>0&&drc<sg.raiseIf){flags.push({lvl:'warn',msg:`Drain EC ${drc.toFixed(2)} < ${sg.raiseIf} → Raise drip EC`});if(overall!=='danger')overall='warn';}
  if(!isNaN(dec)&&dec>0&&(dec<sg.drip[0]||dec>sg.drip[1])){flags.push({lvl:'warn',msg:`Drip EC ${dec.toFixed(2)} outside ${sg.drip[0]}–${sg.drip[1]}`});if(overall!=='danger')overall='warn';}
  if(der.pct!==null){
    if(der.pct<sg.pct[0]-5){flags.push({lvl:'warn',msg:`Drain ${der.pct.toFixed(0)}% below ${sg.pct[0]}–${sg.pct[1]}% target`});if(overall!=='danger')overall='warn';}
    else if(der.pct>sg.pct[1]+15){flags.push({lvl:'warn',msg:`Drain ${der.pct.toFixed(0)}% above target`});if(overall!=='danger')overall='warn';}
  }
  if(!isNaN(ph)&&ph>0){
    if(ph<4.5||ph>7.5){flags.push({lvl:'danger',msg:`Drip pH ${ph.toFixed(2)} — critical`});overall='danger';}
    else if(ph<5.3||ph>5.5){flags.push({lvl:'warn',msg:`Drip pH ${ph.toFixed(2)} outside 5.3–5.5`});if(overall!=='danger')overall='warn';}
  }
  return{overall,flags};
}

async function compressImg(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();reader.onerror=rej;
    reader.onload=e=>{
      const img=new Image();img.onerror=rej;
      img.onload=()=>{
        const MAX=700,scale=img.width>MAX?MAX/img.width:1;
        const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72));
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}

async function analyzeChart(b64,entry,zones,cropLabel,stageKey){
  const apiKey=LS.get('hff:apikey','');
  if(!apiKey)return'⚠ No API key set. Add it in Settings.';
  const sg=GROWTH_STAGES[stageKey];
  const stageCtx=sg?`Current stage: ${sg.label}. Drip ${sg.drip[0]}–${sg.drip[1]} mS | Drain ${sg.drain[0]}–${sg.drain[1]} mS | R/O ${sg.pct[0]}–${sg.pct[1]}% | Reduce if drain>${sg.reduceIf}${sg.raiseIf?` | Raise if drain<${sg.raiseIf}`:''}`:stageKey?'':null;
  const zLines=zones.map(z=>{const d=entry[z.id]||emptyZone();const dec=parseFloat(d.drip_ec);if(isNaN(dec)||dec<=0)return null;const der=calcDer(d,z.drainDrippers,z.privaDrippers);const drc=parseFloat(d.drain_ec);return`${z.label}: drip EC=${dec.toFixed(2)} | drain EC=${isNaN(drc)?'—':drc.toFixed(2)} | drain%=${der.pct!==null?der.pct.toFixed(0)+'%':'—'}`;}).filter(Boolean).join('\n');
  const prompt=`You are analysing a substrate or irrigation sensor chart for Kevin Howe, Howe Family Farms, Elgin County Ontario. Florida Beauty day-neutral strawberries, coir tabletop tunnels, Priva controller. Well water EC 0.53 mS; Na/Cl accumulate in drain water over season.${stageCtx?'\n'+stageCtx:''}${zLines?'\n\nToday\'s manual readings:\n'+zLines:''}\n\nAnalyse the chart:\n1. Substrate moisture trend — stable, trending dry, over-irrigated?\n2. Run-off pattern — adequate flushing?\n3. Notable events: moisture crashes, EC spikes, irrigation gaps\n4. Priva adjustments this chart suggests\n5. Does this chart explain or contradict today's manual readings?\n\nMax 5 bullets. Farmer-direct.`;
  const parts=b64.split(',');
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:500,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:parts[0].split(';')[0].split(':')[1]||'image/jpeg',data:parts[1]}},{type:'text',text:prompt}]}]})});
    const d=await r.json();
    if(!r.ok)return'API error ('+r.status+'): '+(d?.error?.message||'unknown');
    return d.content?.[0]?.text||'No response.';
  }catch(e){return'Network error: '+e.message;}
}

function buildPrompt(entry,zones,stratTpl,cropLabel,defaultStage){
  const stagesByZone=zones.map(z=>{const sk=z.stage||defaultStage;const sg=GROWTH_STAGES[sk];if(!sg)return null;return`  ${z.label}: ${sg.label} (drip ${sg.drip[0]}–${sg.drip[1]} mS, drain ${sg.drain[0]}–${sg.drain[1]} mS, R/O ${sg.pct[0]}–${sg.pct[1]}%, reduce>${sg.reduceIf}${sg.raiseIf?`, raise<${sg.raiseIf}`:''})`;}).filter(Boolean).join('\n');
  const stageBlock=stagesByZone?`Per-zone stages and targets:\n${stagesByZone}`:'Stage targets not configured.';
  const strat=stratTpl.replace('{STAGE_BLOCK}',stageBlock);
  const lines=zones.map(z=>{const d=entry[z.id]||emptyZone();const dec=parseFloat(d.drip_ec);if(isNaN(dec)||dec<=0)return null;const sk=z.stage||defaultStage;const sg=GROWTH_STAGES[sk];const der=calcDer(d,z.drainDrippers,z.privaDrippers);const st=zoneStatus(d,sk,z.drainDrippers,z.privaDrippers);const dph=parseFloat(d.drip_ph),drc=parseFloat(d.drain_ec),drph=parseFloat(d.drain_ph);const flagStr=st.flags.length>0?` ⚑ ${st.flags.map(f=>f.msg).join('; ')}`:' ✓';const stgLbl=sg?` [${sg.label}]`:'';return`${z.label}${stgLbl}: drip EC=${dec.toFixed(2)} pH=${isNaN(dph)?'—':dph.toFixed(2)} | drain EC=${isNaN(drc)?'—':drc.toFixed(2)} pH=${isNaN(drph)?'—':drph.toFixed(2)} | drain%=${der.pct!==null?der.pct.toFixed(0)+'%':'—'}${flagStr}`;}).filter(Boolean).join('\n');
  if(!lines)return null;
  return`${strat}\n\nDate: ${entry.date} | Crop: ${cropLabel}\n${lines}${entry.notes?'\nTech notes: '+entry.notes:''}`;
}

function exportCSV(entries,zones,filename){
  const hdr=['Date','Zone','Valve','Stage','Drip_EC','Drip_pH','Drip_mL','Drain_EC','Drain_pH','Drain_mL','Drain_%','EC_Sum','Priva_EC','Priva_pH','Priva_mL','Notes'];
  const esc=v=>`"${String(v||'').replace(/"/g,'""')}"`;
  const rows=[hdr.join(',')];
  for(const e of entries){for(const z of zones){const d=e[z.id]||emptyZone();const der=calcDer(d,z.drainDrippers,z.privaDrippers);const sg=GROWTH_STAGES[z.stage]?.label||'';rows.push([e.date,esc(z.label),esc(z.valve),esc(sg),d.drip_ec||'',d.drip_ph||'',d.drip_ml||'',d.drain_ec||'',d.drain_ph||'',d.drain_ml||'',der.pct!==null?der.pct.toFixed(1):'',der.ecSum!==null?der.ecSum.toFixed(2):'',d.priva_ec||'',d.priva_ph||'',d.priva_ml||'',esc(e.notes||'')].join(','));}}
  const blob=new Blob([rows.join('\n')],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
}

// ── CLOUD SYNC (SUPABASE REST) ───────────────────────────────────────────────
// No SDK needed — Supabase exposes a standard REST + PostgREST API
// ── AUTH HELPERS ─────────────────────────────────────────────────────────────
// Returns the best available auth token: user session > anon key
function sbAuthToken(){
  const sess=LS.get('hff:sb_session',null);
  if(sess&&sess.access_token&&sess.expires_at&&Date.now()<sess.expires_at*1000)
    return{token:sess.access_token,isUser:true};
  return{token:LS.get('hff:sb_key',''),isUser:false};
}

async function sbLogin(email,password){
  const url=LS.get('hff:sb_url','');
  if(!url)return{ok:false,msg:'No Supabase URL configured'};
  try{
    const r=await fetch(url.replace(/\/+$/,'')+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':LS.get('hff:sb_key','')},
      body:JSON.stringify({email,password})
    });
    const d=await r.json();
    if(!r.ok)return{ok:false,msg:d?.error_description||d?.msg||'Login failed'};
    LS.set('hff:sb_session',{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at,email:d.user?.email});
    return{ok:true,email:d.user?.email};
  }catch(e){return{ok:false,msg:e.message};}
}

async function sbRefreshSession(){
  const sess=LS.get('hff:sb_session',null);
  if(!sess?.refresh_token)return false;
  const url=LS.get('hff:sb_url','');
  try{
    const r=await fetch(url.replace(/\/+$/,'')+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':LS.get('hff:sb_key','')},
      body:JSON.stringify({refresh_token:sess.refresh_token})
    });
    if(!r.ok)return false;
    const d=await r.json();
    LS.set('hff:sb_session',{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at,email:sess.email});
    return true;
  }catch(e){return false;}
}

function sbLogout(){LS.del('hff:sb_session');}

function sbIsLoggedIn(){
  const sess=LS.get('hff:sb_session',null);
  return !!(sess&&sess.access_token&&sess.expires_at&&Date.now()<sess.expires_at*1000);
}

async function sbReq(method,path,body,url,key){
  const base=url.replace(/\/+$/,'');
  const{token}=sbAuthToken();
  const h={'apikey':key,'Authorization':'Bearer '+token,'Content-Type':'application/json'};
  if(method==='POST')h['Prefer']='resolution=merge-duplicates';
  let r=await fetch(base+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  // If 401, try refreshing session once
  if(r.status===401&&sbIsLoggedIn()){
    const refreshed=await sbRefreshSession();
    if(refreshed){
      const{token:t2}=sbAuthToken();
      h['Authorization']='Bearer '+t2;
      r=await fetch(base+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
    }
  }
  return r;
}

async function sbPush(entry,cropId){
  const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key',''),team=LS.get('hff:sb_team','howe-farms-2026');
  if(!url||!key)return{ok:false,reason:'not-configured'};
  // Image binaries stay local; only sync metadata so payload stays small
  const safe={...entry,attachments:(entry.attachments||[]).map(({id,caption,timestamp,name})=>({id,caption,timestamp,name}))};
  const row={id:team+':'+cropId+':'+entry.date,team_id:team,crop:cropId,date:entry.date,entry_data:safe,updated_at:new Date().toISOString()};
  try{const r=await sbReq('POST','irrigation_entries',row,url,key);
    if(!r.ok){const e=await r.json().catch(()=>({}));return{ok:false,status:r.status,msg:e?.message||'HTTP '+r.status};}
    return{ok:true};}
  catch(e){return{ok:false,reason:e.message};}
}

    if(r.status===404||r.status===400){const e=await r.json().catch(()=>({}));return{ok:false,msg:'Table not found — run setup SQL first. '+(e?.message||'')};}
    if(!r.ok)return{ok:false,msg:'HTTP '+r.status};

    return{ok:true,msg:'Connected ✓'+authInfo};}
  catch(e){return{ok:false,msg:e.message};}
}

// Merge a remote rows array into a local entries map (last-write-wins by updated_at vs _savedAt)
function mergeRemote(localMap,rows){
  const updated={...localMap};
  (rows||[]).forEach(row=>{
    const remote=row.entry_data;
    if(!remote?.date)return;
    const local=updated[remote.date];
    const remoteTs=row.updated_at||'1970-01-01T00:00:00Z';
    const localTs=local?._savedAt||'1970-01-01T00:00:00Z';
    if(!local||remoteTs>localTs)updated[remote.date]=remote;
  });
  return updated;
}

function prodPHI(prod,evtCrop){

function prodEAHD(ev,prod){

function dtAddHrs(date,time,hrs){if(hrs<=0)return date;const dt=new Date((date||'2026-01-01')+'T'+(time||'06:00')+':00');dt.setTime(dt.getTime()+hrs*3600000);return dt.toISOString().slice(0,10)+(time?' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0'):'');}
function laterOf(d1,d2){return(d1||'')>(d2||'')?d1:d2;}
function parseRateN(v,u){if(!v)return null;const n=parseFloat(v);const uu=(u||'').toLowerCase();if(uu==='l')return{v:n*1000,u:'mL'};if(uu==='kg')return{v:n*1000,u:'g'};return{v:n,u:uu};}
function parseRateLbl(lbl){if(!lbl||lbl==='—')return null;const m=String(lbl).match(/([0-9.]+)\s*(kg|g|L|mL)/i);if(!m)return null;const v=parseFloat(m[1]),uu=m[2].toLowerCase();if(uu==='l')return{v:v*1000,u:'mL'};if(uu==='kg')return{v:v*1000,u:'g'};return{v,u:uu};}

// ── XLSX AUDIT EXPORT (SheetJS) ───────────────────────────────────────────────
function exportAuditXLSX(spEvents){
  if(typeof XLSX==='undefined'){alert('Spreadsheet library loading — wait a moment and try again.');return;}
  const wb=XLSX.utils.book_new();
  const HDRS=['Event ID','Date','Location','Crop / Area','Block/Bay/Zone','Start Time',
    'Target Pest','Bloom Status','Product','Type','PCP #',
    'Actual Rate','Total Product','Label Max Rate','Rate Compliance',
    'PHI (days)','PHI Release Date',
    'General REI','General REI Release',
    'Hand Harvest REI','Hand Harvest Earliest',
    'Hand-set Irrigation REI',
    'Final Earliest Harvest Date',
    'Harvest Delayed Verified','PHI Verified Date',
    'Field & Pkg Inspected','Inspection Date',
    'Applicator','Sprayer','GPA','Acres Treated'];

  function buildRows(evs){
    return evs.sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id))
      .flatMap(ev=>(ev.products||[]).filter(p=>p.type!=='N').map(prod=>{
        const info=sprayInfo(prod.name);
        const phi=prodPHI(prod,ev.crop||ev.loc);
        const phiDate=phi!=null?calcEAHD(ev.date,phi):'—';
        const reiG=info.rei||'—';
        const reiH=info.reiHarvest||reiG;
        const reiI=info.reiIrrigation||'—';
        const gRel=reiToHrs(reiG)>0?dtAddHrs(ev.date,ev.time,reiToHrs(reiG)):'—';
        const hRel=reiToHrs(reiH)>0?dtAddHrs(ev.date,ev.time,reiToHrs(reiH)):'—';
        const finalH=laterOf(phiDate,hRel==='—'?phiDate:hRel.slice(0,10));
        const audit=ev.audit||{};
        const cn=appCertNote(ev.applicator||'');
        return[
          ev.id,ev.date,ev.loc,inferCrop(ev),ev.note||'',ev.time||'',
          ev.targetPest||'',ev.bloomStatus||'',
          prod.name,
          info.type==='F'?'Fungicide':info.type==='I'?'Insecticide':info.type==='H'?'Herbicide':'Adjuvant',
          prodPCP(prod),
          prod.rate?(prod.rate+' '+prod.unit+'/ac'):'—',
          prod.rate&&ev.acres?((prod.rate*parseFloat(ev.acres)).toFixed(1))+' '+prod.unit:'—',
          info.rateLabel||'—',
          rateChk(prod,info),
          phi!=null?phi:'—',phiDate,
          reiG,gRel,reiH,hRel,reiI,finalH,
          audit.phiVerified?'YES':'NO',audit.phiVerifiedDate||'',
          audit.preHarvestInspection?'YES':'NO',audit.preHarvestInspectionDate||'',
          (ev.applicator||'')+(cn?' ('+cn+')':''),
          sprayerForApplicator(ev.applicator),
          ev.gpa,parseFloat(ev.acres)||0
        ];
      }));
  }

  function ws(rows,hdrs){
    if(!rows.length)return null;
    const s=XLSX.utils.aoa_to_sheet([hdrs||HDRS,...rows]);
    const cw=[12,12,10,20,22,10,22,12,28,12,10,14,14,18,6,14,10,18,14,20,14,22,8,14,8,16,28,14,6,12];
    s['!cols']=cw.map(w=>({wch:w}));
    return s;
  }

  const all=buildRows([...spEvents]);
  const wAll=ws(all);if(wAll)XLSX.utils.book_append_sheet(wb,wAll,'All Applications');

  const crops=[
    ['Strawberry – Field',    e=>e.loc==='Field'&&(inferCrop(e).includes('Straw')||inferCrop(e).includes('Row')||inferCrop(e).includes('Berr'))],
    ['Strawberry – Tunnels',  e=>e.loc==='Tunnels'],
    ['Watermelon',            e=>inferCrop(e)==='Watermelon'],
    ['Pumpkin',               e=>inferCrop(e).includes('Pumpkin')],
    ['Sweet Corn',            e=>inferCrop(e)==='Sweetcorn'],
  ];
  for(const[name,fn] of crops){const r=buildRows(spEvents.filter(fn));const w=ws(r);if(w)XLSX.utils.book_append_sheet(wb,w,name);}

  // Product Label Reference
  const pH=['Product','Type','PCP #','FRAC/HRAC','IRAC','Label Rate','PHI','General REI','Hand Harvest REI','Hand-set Irrigation REI','Notes'];
  const pR=Object.entries(SPRAY_PROD_DB).filter(([,i])=>i.type!=='N').map(([nm,i])=>[nm,
    i.type==='F'?'Fungicide':i.type==='I'?'Insecticide':'Herbicide',
    i.pcp||'—',i.frac||i.hrac||'—',i.irac||'—',i.rateLabel||'—',
    i.phi!=null?i.phi+'d':'—',i.rei||'—',i.reiHarvest||i.rei||'—',i.reiIrrigation||'—',i.notes||'']);
  const wP=ws(pR,pH);if(wP)XLSX.utils.book_append_sheet(wb,wP,'Product Label Reference');

  // Compliance Exceptions
  const eH=['Event ID','Date','Crop','Product','Issue','Actual','Label Max','Overage'];
  const eR=buildRows([...spEvents]).filter(r=>r[13]&&r[13].toString().startsWith('⚠'));
  const wE=ws(eR.length?eR:[['No rate exceedances found']],eH);
  if(wE)XLSX.utils.book_append_sheet(wb,wE,'Compliance Exceptions');

  XLSX.writeFile(wb,'Howe_Farms_spray_records_'+todayStr()+'.xlsx');
}

// Week start (Monday) for application tally
function fertWeekStart(){
  const d=new Date();const dy=d.getDay();const diff=dy===0?-6:1-dy;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function fertWeekCount(log,crop,type){
  const ws=fertWeekStart();
  return log.filter(l=>l.crop===crop&&l.type===type&&l.date>=ws).length;
}
function weekTallyUI(done,target,color){
  const squares=Array.from({length:Math.max(target,done)},(_,i)=>html`
    <span key=${i} style=${{display:'inline-block',width:14,height:14,borderRadius:3,margin:'0 2px',
      background:i<done?color:'transparent',border:'2px solid '+(i<done?color:'#ddd')}}></span>`);
  const over=done>target;
  return html`<span style=${{display:'inline-flex',alignItems:'center',gap:2}}>
    ${squares}
    <span style=${{marginLeft:5,fontSize:11,fontWeight:700,color:done>=target?color:'#aaa'}}>
      ${done}/${target}${done>=target?' ✓':''}${over?' (extra)':''}
    </span>
  </span>`;
}

// ── FERT HISTORY HELPERS ──────────────────────────────────────────────────────
function calcFertNutrients(entry, phases){
  // Returns lbs of N, P, K, Mg, Ca for one application log entry
  const phase = (phases||[]).find(p=>p.id===entry.phaseId);
  const recipe = phase?.recipe;
  const totalL = (entry.zones||[]).reduce((s,z)=>s+(z.litres||0), 0);
  if(!totalL) return {N:0,P:0,K:0,Mg:0,Ca:0};

  if(entry.type==='calcium'){
    // 4L = 1 lb N; Ca:N ratio in Ca(NO3)2 = 40:28
    const N = totalL * 0.25;
    return {N, P:0, K:0, Mg:0, Ca: N * (40/28)};
  }

  // Blue batch — compute per-batch totals then scale by litres applied
  let bN=0, bP=0, bK=0, bMg=0;
  (recipe?.ingredients||[]).forEach(ing=>{
    const q=ing.qty||0;
    if(ing.name==='Potassium Nitrate'){ bN+=q*55*0.13; bK+=q*55*(0.46/1.205); }
    if(ing.name==='15-30-15 Blue'){     bN+=q*25*0.15; bP+=q*25*(0.30/2.291);
                                        bK+=q*25*(0.15/1.205); bMg+=q*25*0.01; }
    if(ing.name==='Epsom Salt'){         bMg+=q*50*0.0986; }
    if(ing.name==='MKP'){                bP+=q*55*0.227; bK+=q*55*0.287; }
    if(ing.name==='28% UAN'){            bN+=q*1.3*0.28*2.205; } // kg→lbs
  });
  const bL = recipe?.batchL||1900;
  return { N:(bN/bL)*totalL, P:(bP/bL)*totalL, K:(bK/bL)*totalL, Mg:(bMg/bL)*totalL, Ca:0 };
}

function fertWeekKey(dateStr){
  // Returns Monday date of the week as 'YYYY-MM-DD' for grouping
  const d=new Date(dateStr+'T12:00:00');
  const dy=d.getDay();const diff=dy===0?-6:1-dy;
  d.setDate(d.getDate()+diff);
  return d.toISOString().slice(0,10);
}
function fertWeekLabel(wk){
  const d=new Date(wk+'T12:00:00');
  return d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
}

function FertHistory({applyLog,crop,phases}){
  const canvasRef=useRef(null);
  const chartRef=useRef(null);

  // Compute per-entry nutrients and aggregate
  const cropLog=[...applyLog].filter(l=>l.crop===crop).sort((a,b)=>a.date.localeCompare(b.date));
  let totN=0,totP=0,totK=0,totMg=0,totCa=0;
  const byWeek={};
  cropLog.forEach(entry=>{
    const n=calcFertNutrients(entry,phases);
    totN+=n.N; totP+=n.P; totK+=n.K; totMg+=n.Mg; totCa+=n.Ca;
    const wk=fertWeekKey(entry.date);
    if(!byWeek[wk])byWeek[wk]={wk,N:0,K:0,Ca:0,Mg:0,P:0};
    byWeek[wk].N+=n.N; byWeek[wk].K+=n.K; byWeek[wk].Ca+=n.Ca;
    byWeek[wk].Mg+=n.Mg; byWeek[wk].P+=n.P;
  });
  const weeks=Object.values(byWeek).sort((a,b)=>a.wk.localeCompare(b.wk));

  useEffect(()=>{
    if(!canvasRef.current||typeof Chart==='undefined'||!weeks.length) return;
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}
    chartRef.current=new Chart(canvasRef.current,{
      type:'bar',
      data:{
        labels:weeks.map(w=>fertWeekLabel(w.wk)),
        datasets:[
          {label:'N',data:weeks.map(w=>+w.N.toFixed(1)),backgroundColor:'#66bb6a',borderRadius:3},
          {label:'K',data:weeks.map(w=>+w.K.toFixed(1)),backgroundColor:'#42a5f5',borderRadius:3},
          {label:'Ca',data:weeks.map(w=>+w.Ca.toFixed(1)),backgroundColor:'#ff8a65',borderRadius:3},
          {label:'Mg',data:weeks.map(w=>+w.Mg.toFixed(1)),backgroundColor:'#ce93d8',borderRadius:3},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,
        interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}},
        scales:{
          x:{ticks:{font:{size:10}},grid:{color:'rgba(0,0,0,.03)'}},
          y:{title:{display:true,text:'lbs applied',font:{size:10}},grid:{color:'rgba(0,0,0,.05)'},
             ticks:{font:{size:10}}},
        }
      }
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[weeks.length,crop]);

  const hasData=cropLog.length>0;
  const STATS=[
    {lbl:'N',val:totN,color:'#2e7d32',note:'Nitrogen'},
    {lbl:'P',val:totP,color:'#6a1599',note:'Phosphorus'},
    {lbl:'K',val:totK,color:'#1565c0',note:'Potassium'},
    {lbl:'Mg',val:totMg,color:'#e65100',note:'Magnesium'},
    {lbl:'Ca',val:totCa,color:'#c62828',note:'Calcium'},
  ];

  return html`<div>
    <!-- Season totals -->
    <div style=${{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:6,marginBottom:12}}>
      ${STATS.map(s=>html`
      <div key=${s.lbl} style=${{background:'#fff',border:'1.5px solid #e8e8e8',borderRadius:10,padding:'9px 6px',textAlign:'center'}}>
        <div style=${{fontSize:10,fontWeight:700,color:'#bbb',letterSpacing:'.06em',textTransform:'uppercase'}}>${s.lbl}</div>
        <div style=${{fontSize:18,fontWeight:700,color:s.color,marginTop:1,lineHeight:1}}>${hasData?s.val.toFixed(0):'-'}</div>
        <div style=${{fontSize:9,color:'#ccc',marginTop:1}}>lbs</div>
      </div>`)}
    </div>

    <!-- N:K:Ca ratio card -->
    ${hasData&&totN>0?html`
    <div style=${{background:'#f8faf6',border:'1px solid #c8e6c9',borderRadius:9,padding:'9px 13px',marginBottom:12}}>
      <span style=${{fontSize:11,fontWeight:700,color:'#555'}}>Season N : K : Ca ratio</span>
      <span style=${{marginLeft:8,fontSize:13,fontWeight:700,color:'#2e7d32'}}>
        1 : ${(totK/totN).toFixed(2)} : ${(totCa/totN).toFixed(2)}
      </span>
      <div style=${{fontSize:10,color:'#aaa',marginTop:3}}>
        Reference — fruit sizing target: 1 : 3.2 : 1.4 · bearing strawberry: 1 : 1.0 : 1.4
      </div>
    </div>`:null}

    <!-- Weekly chart -->
    <div style=${{background:'#fff',border:'1.5px solid #e8e8e8',borderRadius:12,padding:'12px 14px',marginBottom:12}}>
      <p style=${{fontSize:11,fontWeight:700,color:'#555',letterSpacing:'.05em',textTransform:'uppercase',margin:'0 0 8px'}}>Weekly Nutrient Application (lbs)</p>
      ${hasData?html`
      <div style=${{position:'relative',height:220}}><canvas ref=${canvasRef}></canvas></div>
      <p style=${{fontSize:9,color:'#ccc',textAlign:'center',marginTop:4}}>Tap legend labels to show/hide nutrients</p>
      `:html`<p style=${{textAlign:'center',color:'#ccc',padding:'40px 0',fontSize:13}}>No applications logged yet</p>`}
    </div>

    <!-- Field observation notes prompt -->
    <div style=${{background:'#fffde7',border:'1px solid #ffe082',borderRadius:9,padding:'10px 13px',marginBottom:12}}>
      <div style=${{fontSize:11,fontWeight:700,color:'#f57f17',marginBottom:4}}>🔍 Field Scouting Reference</div>
      <div style=${{fontSize:11,color:'#795548',lineHeight:1.6}}>
        <b>Excess N (canopy jungle):</b> Compare total N to K — if N:K ratio >1:1 during sizing, reduce Blue apps.<br/>
        <b>Low Brix / thin skin:</b> Check cumulative K — should be ≥ 3× N by harvest for watermelon.<br/>
        <b>Fruit abortion / poor set:</b> Ca during bloom phase — check Ca total for that period.<br/>
        <b>Yellowing (interveinal):</b> Mg or Fe — check Mg total and note if Ca tote had Iron DTPA added.<br/>
        <b>Stunted growth:</b> Compare N/week to phase plan — gaps show missed applications.
      </div>
    </div>

    <!-- Recent application nutrient breakdown -->
    <div style=${{fontSize:11,fontWeight:700,color:'#aaa',letterSpacing:'.05em',textTransform:'uppercase',marginBottom:7}}>Recent Applications</div>
    ${cropLog.slice().reverse().slice(0,8).map(entry=>{
      const n=calcFertNutrients(entry,phases);
      const totalL=(entry.zones||[]).reduce((s,z)=>s+(z.litres||0),0);
      return html`
      <div key=${entry.id} style=${{background:'#fff',border:'1px solid #e8e8e8',borderRadius:8,padding:'9px 12px',marginBottom:5}}>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:3}}>
          <span style=${{fontWeight:600,fontSize:13,color:entry.type==='blue'?'#2e7d32':'#1565c0'}}>
            ${entry.type==='blue'?'🚿 Blue':'💧 Calcium'} · ${entry.applicator}
          </span>
          <span style=${{fontSize:10,color:'#bbb'}}>${entry.date} · ${totalL} L</span>
        </div>
        <div style=${{display:'flex',gap:10,fontSize:11,color:'#888',flexWrap:'wrap'}}>
          ${n.N>0?html`<span><b style=${{color:'#2e7d32'}}>N</b> ${n.N.toFixed(1)} lbs</span>`:null}
          ${n.P>0?html`<span><b style=${{color:'#6a1599'}}>P</b> ${n.P.toFixed(1)} lbs</span>`:null}
          ${n.K>0?html`<span><b style=${{color:'#1565c0'}}>K</b> ${n.K.toFixed(1)} lbs</span>`:null}
          ${n.Mg>0?html`<span><b style=${{color:'#e65100'}}>Mg</b> ${n.Mg.toFixed(1)} lbs</span>`:null}
          ${n.Ca>0?html`<span><b style=${{color:'#c62828'}}>Ca</b> ${n.Ca.toFixed(1)} lbs</span>`:null}
        </div>
      </div>`;
    })}
  </div>`;
}

function SprayProdRow({p, apt, acres, isTunnels, bZones, onUpdate, onRemove}){
  const info = sprayInfo(p.name)||{type:'N'};
  const nm = (v,u) => u==='kg'?v*1000:u==='L'?v*1000:v;
  const du = u => u==='kg'?'g':u==='L'?'mL':u;
  const n = nm(parseFloat(p.amt)||0, p.unit);
  const d = du(p.unit);
  const ratePerAc = n&&apt ? (n/apt).toFixed(1) : null;
  const totalAmt = n&&apt&&acres ? (n/apt)*acres : null;
  const totalStr = totalAmt ? (
    d==='g'&&totalAmt>=1000 ? (totalAmt/1000).toFixed(2)+'kg total' :
    d==='mL'&&totalAmt>=1000 ? (totalAmt/1000).toFixed(2)+'L total' :
    totalAmt.toFixed(0)+d+' total'
  ) : '';
  
  // Per-zone breakdown for partial tunnel selection
  let zoneBreak = '';
  if(isTunnels && bZones && bZones.length > 0 && bZones.length < TUNNEL_ZONES.length && n && apt) {
    const sel = TUNNEL_ZONES.filter(z=>bZones.includes(z.id));
    zoneBreak = sel.map(z=>{
      const tot = ((n/apt)*z.acres).toFixed(0);
      return z.label+': '+tot+d;
    }).join(' · ');
  }

  const flags = [];
  const prodOpts2 = [];  // not needed here
  if(info.needsOil) flags.push('⚠ Requires PureSpray Green Oil');
  if(info.prefOil) flags.push('⚠ Add PureSpray Green Oil for best results');
  if(info.bioSafe) flags.push('✓ Bio-safe (Orius)');
  if(info.needsPH) flags.push('⚠ Spray water pH must be >5');
  if(info.noMix) flags.push('⛔ Never tank mix with anything');
  if(info.noBloom) flags.push('⛔ Do not use at bloom — petal retention');
  if(info.noFrost) flags.push('⚠ Do not apply within 24–48h of frost');
  const flagStr = flags.join(' · ');

  const prodNames = Object.keys(SPRAY_PROD_DB);
  return html`<div class="sp-pe">
    <div class="sp-pr">
      <select class="sp-sel" value=${p.name} onChange=${e=>onUpdate(p.id,'name',e.target.value)}>
        <option value="">— select product —</option>
        ${prodNames.map(n=>html`<option key=${n} value=${n}>${n}</option>`)}
        <option value="Other">Other</option>
      </select>

// ── SPRAY BRAIN — PREACT COMPONENT ───────────────────────────────────────────
function SprayBrain(){
  const[spView,setSV]=useState('season');
  const[spFilter,setSF]=useState('all');
  const[spEvents,setSE]=useState(()=>{const s=LS.get('hff:spray:events',null);return(s&&s.length>0)?s:SPRAY_SEED;});
  const[spSync,setSync]=useState('idle');
  const[bZones,setBZ]=useState(()=>TUNNEL_ZONES.map(z=>z.id));
  const[bFieldZone,setBFZ]=useState('melon');
  const[bLoc,setBL]=useState('Tunnels — Hagie 400 gal (Julio)');
  const[bGpa,setBG]=useState('100');
  const[bAcres,setBA]=useState('19.5');
  const[bDate,setBD]=useState(todayStr());
  const[bTime,setBT]=useState('');
  const[bApplicator,setBAp]=useState(()=>LS.get('hff:spray:applicator','Julio'));
  const[editId,setEditId]=useState(null);
  const[bProds,setBP]=useState([{id:1,name:'',amt:'',unit:'g'}]);
  const[bCtr,setBC]=useState(1);
  const[bJulio,setBJ]=useState(null);
  const[bRec,setBR]=useState(null);
  const[bGap,setBGap]=useState([]);
  const[bWarn,setBW]=useState('');
  const[bCrop,setBCrop]=useState('');
  const[auditSaved,setAuditSaved]=useState(null); // null | 'saving' | 'saved' | 'err'
  const[bTargetPest,setBTargetPest]=useState('');
  const[bBloomStatus,setBBloomStatus]=useState('No');
  const[aLoc,setAL]=useState('Tunnels');
  const[aStg,setAS]=useState('Green fruit');
  const[aTgt,setAT]=useState('Powdery mildew');
  const[aPres,setAP]=useState('Preventative');
  const[aNotes,setAN]=useState('');
  const[aOut,setAO]=useState('');
  const[aLoad,setALoad]=useState(false);

  useEffect(()=>{LS.set('hff:spray:events',spEvents);},[spEvents]);

  useEffect(()=>{
    const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
    if(!url||!key)return;
    setSync('syncing');
    sbSprayPull().then(rows=>{
      if(!rows){setSync('err');return;}
      if(rows.length===0){setSync('ok');return;}
      setSE(prev=>{
        const map={};prev.forEach(e=>{map[e.id]=e;});
        rows.forEach(r=>{if(r.event_data?.id)map[r.event_data.id]=r.event_data;});
        const m=Object.values(map).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
        LS.set('hff:spray:events',m);return m;
      });
      setSync('ok');
    });
  },[]);

  const isTunnels=bLoc.includes('Hagie');
  const tvol=tvolForLoc(bLoc);
  const gpa=parseFloat(bGpa)||100;
  const apt=tvol/gpa;
  const fieldZoneObj=FIELD_ZONES.find(z=>z.id===bFieldZone)||FIELD_ZONES[0];
  const fieldAcres=fieldZoneObj.acres!==null?fieldZoneObj.acres:parseFloat(bAcres)||19.5;
  const tunnelAcres=bZones.length===TUNNEL_ZONES.length?TUNNEL_TOTAL:TUNNEL_ZONES.filter(z=>bZones.includes(z.id)).reduce((s,z)=>s+z.acres,0);
  const acres=isTunnels?(tunnelAcres||TUNNEL_TOTAL):fieldAcres;

  function chkWarn(prods){
    const sel=prods.map(p=>p.name).filter(Boolean);
    const w=[];
    if(sel.includes('Sanidate')&&sel.length>1)w.push('⛔ Sanidate cannot be tank mixed with anything');
    if(sel.some(n=>sprayInfo(n).isOil)&&sel.some(n=>sprayInfo(n).isSulf))w.push('⛔ Oil + Sulfur in same tank — crop injury risk');
    setBW(w.join('\n'));
  }

  function addP(){const id=bCtr+1;setBC(id);setBP(p=>[...p,{id,name:'',amt:'',unit:'g'}]);}
  function updP(id,f,v){
    setBP(p=>{
      const u=p.map(r=>{
        if(r.id!==id)return r;
        let nr={...r,[f]:v};
        // When a product is selected, auto-fill the per-tank amount from the label rate table.
        // Example: Delegate 0.105 kg/ac at 1.6 ac/tank -> 0.17 kg per tank.
        if(f==='name'){
          const fill=tankAmountFromRateLabel(v);
          if(fill){nr={...nr,amt:fill.amt,unit:fill.unit};}
        }
        return nr;
      });
      // Auto-suggest Glenn when herbicide added in field, Jose for fungicide/insecticide
      if(!isTunnels){
        const hasHerb=u.some(r=>r.name&&sprayInfo(r.name).type==='H');
        if(hasHerb)setBAp('Glenn Howe');
      }
      chkWarn(u);return u;
    });
  }
  function remP(id){setBP(p=>{const u=p.filter(r=>r.id!==id);chkWarn(u);return u;});}
  const nm=(v,u)=>u==='kg'?v*1000:u==='L'?v*1000:v;
  const du=u=>u==='kg'?'g':u==='L'?'mL':u;
  function rateDisplay(prod){
    const info=sprayInfo(prod.name)||{};
    if(prod.rate&&prod.unit)return prod.rate+prod.unit+'/ac';
    return info.rateLabel||'—';
  }
  function parseRateLabel(label){
    if(!label||label==='—'||label.includes('%'))return null;
    const m=String(label).match(/([0-9.]+)\s*(kg|g|L|mL)\s*\/?\s*ac/i);
    if(!m)return null;
    return {rate:parseFloat(m[1]),unit:m[2]};
  }
  function tankAmountFromRateLabelForApt(name, aptVal){
    const info=sprayInfo(name)||{};
    const parsed=parseRateLabel(info.rateLabel);
    if(!parsed||!aptVal)return null;
    const amount=parsed.rate*aptVal;
    const rounded=amount>=10?Math.round(amount):Math.round(amount*100)/100;
    return {amt:String(rounded),unit:parsed.unit};
  }
  function tankAmountFromRateLabel(name){
    return tankAmountFromRateLabelForApt(name, apt);
  }
  function recalcProductsForApt(aptVal){
    setBP(prev=>{
      const u=prev.map(r=>{
        if(!r.name)return r;
        const fill=tankAmountFromRateLabelForApt(r.name, aptVal);
        return fill?{...r,amt:fill.amt,unit:fill.unit}:r;
      });
      chkWarn(u);
      return u;
    });
    setBJ(null);setBR(null);setBGap([]);
  }
  function handleGpaChange(v){
    setBG(v);
    const newGpa=parseFloat(v)||100;
    recalcProductsForApt(tvolForLoc(bLoc)/newGpa);
  }
  function handleLocChange(v){
    setBL(v);
    if(v.includes('Hagie'))setBCrop('Strawberry (Tunnels)');
    else setBCrop('');
    // Auto-assign applicator to the sprayer's usual operator
    setBAp(prev=>{
      const known=['Julio','Jose','Glenn Howe','Glenn','Kevin','Kevin Howe'];
      if(!known.includes(prev))return prev;
      if(v.includes('Hagie')) return 'Julio';
      if(v.includes('Hardi')) return 'Jose';
      if(v.includes('Patriot')) return 'Glenn Howe';
      return prev;
    });
    const newGpa=parseFloat(bGpa)||100;
    recalcProductsForApt(tvolForLoc(v)/newGpa);
  }

  function genJulio(){
    try{
    const vp=bProds.filter(p=>p.name&&parseFloat(p.amt)>0);
    if(!vp.length){alert('Add at least one product with a quantity');return;}
    const certNote=appCertNote(bApplicator);
    const lines=['Julio,'];
    const rF=[],rI=[],rN=[],ff=new Set(),fi=new Set();
    if(isTunnels&&bZones.length<TUNNEL_ZONES.length){
      lines.push('Zones: '+TUNNEL_ZONES.filter(z=>bZones.includes(z.id)).map(z=>z.label).join(', ')+' ('+acres.toFixed(2)+' ac)');
    }
    vp.forEach(p=>{
      // Use the label-rate calculation at the current GPA/tank size for Julio text,
      // even if React has not finished updating the visible input value yet.
      // Example: 160 gal ÷ 50 GPA = 3.2 ac/tank, then rate/ac × 3.2 = product/tank.
      const fill=tankAmountFromRateLabelForApt(p.name, apt);
      const tankAmt=fill?fill.amt:p.amt;
      const tankUnit=fill?fill.unit:p.unit;
      lines.push(p.name+' — '+tankAmt+tankUnit+' per tank');
      const n=nm(parseFloat(tankAmt),tankUnit);const d=du(tankUnit);    // Snap to label rate if within 5% (avoids 300.3 vs 300 compliance artefacts)
    const _cr=n/apt;
    const _rls=sprayInfo(p.name).rateLabel;
    const _rlm=_rls?String(_rls).match(/([0-9.]+)\s*(kg|g|L|mL)/i):null;
    const _rlv=_rlm?parseFloat(_rlm[1]):null;
    const _rlu=_rlm?(_rlm[2]||'').toLowerCase():null;
    const rt=(_rlv&&_rlu&&_rlu===(p.unit||'g').toLowerCase()&&Math.abs(_cr-_rlv)/_rlv<0.05)?String(_rlv):_cr.toFixed(1);
    const info=sprayInfo(p.name)||{type:'N'};
      const entry=p.name+' '+rt+d+'/ac';
      if(info.type==='F'){rF.push(entry);if(info.frac)ff.add(info.frac);}
      else if(info.type==='I'){rI.push(entry);if(info.irac)fi.add(info.irac);}
      else rN.push(entry);
    });
    if(certNote)lines.push('Applicator: '+bApplicator+' — '+certNote);
    else lines.push('Applicator: '+bApplicator);
    const totalTanks=(acres/apt);
    const fullT=Math.floor(totalTanks);
    const partT=totalTanks-fullT;
    const tanksStr=partT>0.05?totalTanks.toFixed(1)+' tanks ('+fullT+' full + '+Math.round(partT*100)+'% of a tank)':fullT+' full tanks';
    lines.push('Tanks needed: '+tanksStr+' for '+acres.toFixed(2)+' ac at '+gpa+' GPA');
    setBJ(lines.join('\n'));
    setBR(bDate+'\t'+(rF.join(', ')||'—')+'\t'+([...ff].join(', ')||'—')+'\t'+([...rI,...rN].join(', ')||'—')+'\t'+([...fi].join(', ')||'—')+'\t'+gpa+' GPA · '+tvol+'gal · '+apt.toFixed(2)+'ac/tank · '+totalTanks.toFixed(1)+' tanks · '+acres.toFixed(2)+'ac');
    const locLabel=isTunnels?(bZones.length<TUNNEL_ZONES.length?'Tunnels — '+TUNNEL_ZONES.filter(z=>bZones.includes(z.id)).map(z=>z.label).join(', '):'Tunnels — All'):fieldZoneObj.label;
    const gapRows=vp.filter(p=>sprayInfo(p.name).type!=='N').map(p=>{
      const info=sprayInfo(p.name)||{};
      const fill=tankAmountFromRateLabelForApt(p.name, apt);
      const tankAmt=fill?fill.amt:p.amt;
      const tankUnit=fill?fill.unit:p.unit;
      const n=nm(parseFloat(tankAmt),tankUnit);const d=du(tankUnit);
      const rate=(n/apt).toFixed(1)+' '+d+'/ac';
      const eahd=calcEAHD(bDate,info.phi);
      const cn=appCertNote(bApplicator);const appl=bApplicator+(cn?' ('+cn+')':'');return[p.name,info.pcp||'—',info.phi!==undefined?info.phi+'d':'—',eahd,rate,locLabel,bDate+' '+bTime,appl].join('\t');
    });
    setBGap(gapRows);
    }catch(err){alert('Generate error: '+err.message+'\n\nStack: '+err.stack.split('\n').slice(0,4).join(' | '));}
  }

  function saveEv(){
    const vp=bProds.filter(p=>p.name&&parseFloat(p.amt)>0);if(!vp.length)return;
    const id=editId||('ev-'+Date.now());
    const zoneNote=isTunnels
      ?(bZones.length<TUNNEL_ZONES.length?'Zones: '+TUNNEL_ZONES.filter(z=>bZones.includes(z.id)).map(z=>z.label).join(', '):'')
      :(fieldZoneObj.label!=='All field'?fieldZoneObj.label:'');
    LS.set('hff:spray:applicator',bApplicator);
    const event={id,date:bDate,time:bTime,loc:isTunnels?'Tunnels':'Field',crop:bCrop||undefined,targetPest:bTargetPest||undefined,bloomStatus:bBloomStatus||undefined,gpa,acres,note:zoneNote,applicator:bApplicator,
      products:vp.map(p=>{const fill=tankAmountFromRateLabelForApt(p.name, apt);const tankAmt=fill?fill.amt:p.amt;const tankUnit=fill?fill.unit:p.unit;const n=nm(parseFloat(tankAmt),tankUnit);const d=du(tankUnit);const info=sprayInfo(p.name)||{type:'N',frac:null,irac:null,pcp:null,phi:0};
        return{name:p.name,rate:(()=>{const _cr=n/apt;const _rs=sprayInfo(p.name).rateLabel;const _rm=_rs?String(_rs).match(/([0-9.]+)\s*(kg|g|L|mL)/i):null;const _rv=_rm?parseFloat(_rm[1]):null;const _ru=_rm?_rm[2].toLowerCase():null;return(_rv&&_ru&&_ru===(p.unit||'g').toLowerCase()&&Math.abs(_cr-_rv)/_rv<0.05)?_rv:+_cr.toFixed(1);})(),unit:d,type:info.type,frac:info.frac||null,irac:info.irac||null,pcp:info.pcp||null,phi:info.phi??0,rei:info.rei||null,eahd:calcEAHD(bDate,info.phi)};})};
    const upd=[event,...spEvents.filter(e=>e.id!==id)].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
    setSE(upd);
    const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
    if(url&&key){setSync('syncing');sbSprayPush(event).then(r=>setSync(r.ok?'ok':'err'));}
    setBJ(null);setBR(null);setBGap([]);setBP([{id:1,name:'',amt:'',unit:'g'}]);setBC(1);setBW('');setEditId(null);setBCrop('');setBTargetPest('');setBBloomStatus('No');
    setSV('season');
  }

  function editSprayEvent(ev){
    const locIsTunnels=ev.loc==='Tunnels';
    const tankVol=locIsTunnels?SPRAY_TANK_VOL.tunnels:SPRAY_TANK_VOL.field;
    const eventGpa=parseFloat(ev.gpa)||100;
    const eventApt=tankVol/eventGpa;
    setEditId(ev.id);
    setSV('build');
    // Re-map stored loc to current sprayer options
    setBL(ev.loc==='Tunnels'?'Tunnels — Hagie 400 gal (Julio)':
          (ev.applicator&&ev.applicator.includes('Glenn'))?'Field — Patriot 680 gal (Glenn)':
          'Field — Hardi 750 gal (Jose)');
    setBG(String(ev.gpa||100));
    setBD(ev.date||todayStr());
    setBT(ev.time||'');
    setBA(String(ev.acres||''));
    setBAp(ev.applicator||LS.get('hff:spray:applicator','Julio'));
    setBJ(null);setBR(null);setBGap([]);setBW('');
    setBP((ev.products||[]).map((p,i)=>({id:i+1,name:p.name||'',amt:p.rate?String(+(p.rate*eventApt).toFixed(2)):'',unit:p.unit||'g'})));
    setBC((ev.products||[]).length||1);
  }

  function deleteSprayEvent(ev){
    if(!confirm('Delete this spray event?\n\n'+ev.date+(ev.note?' — '+ev.note:'')+'\n'+ev.products.map(p=>p.name).join(', ')))return;
    const upd=spEvents.filter(e=>e.id!==ev.id);
    setSE(upd);LS.set('hff:spray:events',upd);
    const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
    if(url&&key){setSync('syncing');sbSprayDelete(ev.id).then(r=>setSync(r.ok?'ok':'err'));}
  }


  // Explicit save: persist all audit-marked events to localStorage + Supabase
  async function saveAllAudit(){
    setAuditSaved('saving');
    LS.set('hff:spray:events',spEvents);
    const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
    if(url&&key){
      // Push every event that has audit data to Supabase
      const auditedEvents=spEvents.filter(e=>e.audit&&Object.keys(e.audit).some(k=>e.audit[k]));
      const results=await Promise.all(auditedEvents.map(ev=>sbSprayPush(ev)));
      const allOk=results.every(r=>r.ok);
      setAuditSaved(allOk?'saved':'err');
    } else {
      setAuditSaved('saved'); // local-only save
    }
    setTimeout(()=>setAuditSaved(null),3000);
  }

  function updateSprayAudit(eventId, patch){
    const upd=spEvents.map(ev=>{
      if(ev.id!==eventId)return ev;
      const audit={...(ev.audit||{}),...patch};
      const updated={...ev,audit,updated_at:new Date().toISOString()};
      const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
      if(url&&key){setSync('syncing');sbSprayPush(updated).then(r=>setSync(r.ok?'ok':'err'));}
      return updated;
    }).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
    setSE(upd);LS.set('hff:spray:events',upd);
    // Visual confirmation that the click was saved locally
    setAuditSaved('saved');setTimeout(()=>setAuditSaved(null),2000);
  }

  function maxEventEAHD(ev){
    const dates=(ev.products||[])
      .filter(p=>p.type!=='N')
      .map(p=>p.eahd||calcEAHD(ev.date,p.phi||0))
      .filter(Boolean)
      .sort();
    return dates.length?dates[dates.length-1]:ev.date;
  }

  function exportAuditCSV(){

    [...spEvents].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).forEach(ev=>{
      (ev.products||[]).filter(p=>p.type!=='N').forEach(prod=>{
        const audit=ev.audit||{};
        const cn=appCertNote(ev.applicator||'');const appl=(ev.applicator||'')+(cn?' ('+cn+')':'');const pT3=sprayInfo(prod.name).type;const tL3=pT3==='F'?'Fungicide':pT3==='I'?'Insecticide':pT3==='H'?'Herbicide':'Adjuvant';const cells=[ev.date,inferCrop(ev),ev.note||'All',prod.name,tL3,prodPCP(prod),prod.rate?prod.rate+' '+prod.unit+'/ac':'—',prod.rate&&ev.acres?((prod.rate*parseFloat(ev.acres)).toFixed(1))+' '+prod.unit:'—',String(prodPHI(prod,ev.crop||ev.loc)??'—'),prodEAHD(ev,prod),audit.phiVerifiedDate||'',audit.preHarvestInspection?'YES':'NO',appl,sprayerForApplicator(ev.applicator),ev.gpa,ev.acres];
        rows.push(cells.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));

    const url=URL.createObjectURL(blob);const a=document.createElement('a');

function NInput({value,onChange,placeholder,flagged}){
  return html`<input type="number" step="0.01" value=${value} onInput=${e=>onChange(e.target.value)} placeholder=${placeholder} class=${flagged?'ph-alert':''}/>`;
}
function TInput({value,onChange,placeholder,style}){
  return html`<input type="text" class="ti" value=${value} onInput=${e=>onChange(e.target.value)} placeholder=${placeholder} style=${style||{}}/>`;
}

function ZoneRow({zone,data,onChange}){

  const{overall,flags}=zoneStatus(d,sk,dd,pd);
  const[open,setOpen]=useState(true);
  const upd=(f,v)=>onChange(zone.id,f,v);
  const dot=overall==='danger'?'danger':overall==='warn'?'warn':'';
  const bd=overall==='danger'?'#ef9a9a':overall==='warn'?'#ffe082':'#e8e8e8';
  const sg=GROWTH_STAGES[sk];
  const der=calcDer(d,dd,pd);
  return html`
  <div class="card" style=${{borderColor:bd}}>
    <button class=${'card-head '+overall} onClick=${()=>setOpen(o=>!o)}>
      <div class="chl">

        <span class="vname">${zone.valve}</span>

      </div>
      <div class="chips">

          const otherFlags=flags.filter(f=>!f.msg.includes('Drain')&&!f.msg.includes('drain'));
          return html`
            ${der.pct!==null?html`<span class=${'chip chip-'+(drS==='danger'?'danger':drS==='warn'?'warn':'neutral')}>Dr ${der.pct.toFixed(0)}%</span>`:null}
            ${otherFlags.slice(0,1).map((f,i)=>html`<span key=${i} class=${'chip chip-'+f.lvl}>${f.msg}</span>`)}

        <div key=${pfx}>
          <div class="flbl">${lbl}</div>
          <div class="fg">

            <div key=${fk}>
              <span class="fl">${fl}</span>
              <${NInput} value=${d[fk]} onChange=${v=>upd(fk,v)} placeholder=${ph}

        <div class="priva-lbl">Drain – Priva sensor</div>
        <div class="fg">
          ${[['EC','priva_ec'],['pH','priva_ph'],['mL','priva_ml']].map(([fl,fk])=>html`
          <div key=${fk}><span class="fl">${fl}</span><${NInput} value=${d[fk]} onChange=${v=>upd(fk,v)} placeholder="—"/></div>`)}

function ImageSection({cropId,date,attachments,onUpdate,entry,zones,stageKey,cropLabel}){
  const[imgs,setImgs]=useState({});
  const[missingImgs,setMissingImgs]=useState({});
  const[lb,setLb]=useState(null);
  const[analyzing,setAnalyzing]=useState(null);
  const[analyses,setAnalyses]=useState({});
  const[uploading,setUploading]=useState(false);
  const atts=attachments||[];

  useEffect(()=>{
    const loaded={};const missing={};
    atts.forEach(att=>{
      const b=LS.get('hff:'+cropId+':imgdata:'+att.id,null);
      if(b)loaded[att.id]=b;else missing[att.id]=true;
    });
    setImgs(loaded);
    setMissingImgs(missing);
    setAnalyses({});
  },[date,cropId]);

  async function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    setUploading(true);
    try{
      const comp=await compressImg(file);
      const id='img_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      LS.set('hff:'+cropId+':imgdata:'+id,comp);
      const att={id,caption:'',timestamp:Date.now(),name:file.name};
      const updated=[...atts,att];
      onUpdate(updated);
      setImgs(p=>({...p,[id]:comp}));
    }catch(err){alert('Attach failed: '+err.message);}
    setUploading(false);e.target.value='';
  }

  function delAtt(id){
    if(!confirm('Remove this attachment?'))return;
    LS.del('hff:'+cropId+':imgdata:'+id);
    onUpdate(atts.filter(a=>a.id!==id));
    setImgs(p=>{const n={...p};delete n[id];return n;});
    setAnalyses(p=>{const n={...p};delete n[id];return n;});
    if(lb===id)setLb(null);
  }

  async function doAnalyze(att){
    const b64=imgs[att.id];if(!b64){alert('Image not loaded.');return;}
    setAnalyzing(att.id);
    const result=await analyzeChart(b64,entry,zones,cropLabel,stageKey);
    setAnalyses(p=>({...p,[att.id]:result}));
    setAnalyzing(null);
  }

  return html`
  <div style=${{marginBottom:14}}>
    <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
      <span style=${{fontSize:11,fontWeight:600,color:'#666',letterSpacing:'.06em',textTransform:'uppercase'}}>📸 Screenshots & Charts</span>
      <label style=${{padding:'6px 14px',borderRadius:8,border:'1.5px solid #1a2b1a',color:'#1a2b1a',fontWeight:600,fontSize:12,cursor:'pointer',opacity:uploading?0.5:1}}>
        ${uploading?'Compressing…':'+ Attach'}
        <input type="file" accept="image/*" onInput=${handleFile} style=${{display:'none'}} disabled=${uploading}/>
      </label>
    </div>
    ${atts.length===0?html`<p style=${{fontSize:12,color:'#ccc',lineHeight:1.5}}>Attach Soilsense moisture charts, Priva graphs, or any screenshot worth flagging. Tap "Analyse" for AI interpretation alongside today's readings.</p>`:null}
    <div class="img-grid">
      ${atts.map(att=>html`
      <div class="img-card" key=${att.id}>
        ${imgs[att.id]?html`
        <div style=${{position:'relative'}}>
          <img class="img-thumb" src=${imgs[att.id]} onClick=${()=>setLb(att.id)} alt=${att.caption||att.name||''}/>
          <button onClick=${()=>delAtt(att.id)} style=${{position:'absolute',top:5,right:5,width:22,height:22,borderRadius:'50%',background:'rgba(0,0,0,.6)',color:'#fff',border:'none',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>✕</button>
        </div>`:missingImgs[att.id]?html`
        <div class="img-ph" style=${{flexDirection:'column',gap:3,padding:'8px'}}>
          <span>📸</span>
          <span style=${{fontSize:10,textAlign:'center',color:'#bbb'}}>Saved on another device</span>
          <button onClick=${()=>delAtt(att.id)} style=${{fontSize:10,color:'#e65100',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Remove</button>
        </div>`:html`<div class="img-ph">Loading…</div>`}
        <div class="img-inner">
          <input class="img-cap" type="text" value=${att.caption} onInput=${e=>onUpdate(atts.map(a=>a.id===att.id?{...a,caption:e.target.value}:a))} placeholder="Zone, issue, date…"/>
          <button class="img-analyse" disabled=${analyzing===att.id||!imgs[att.id]}
            style=${{background:analyzing===att.id?'#e0e0e0':'#1a2b1a',color:analyzing===att.id?'#888':'#fff',cursor:analyzing===att.id?'default':'pointer'}}
            onClick=${()=>doAnalyze(att)}>
            ${analyzing===att.id?'Analysing…':'Analyse with AI ↗'}
          </button>
          ${analyses[att.id]?html`<div class="img-analysis">${analyses[att.id]}</div>`:null}
        </div>
      </div>`)}
    </div>
    ${lb&&imgs[lb]?html`
    <div class="lightbox" onClick=${()=>setLb(null)}>
      <img src=${imgs[lb]} onClick=${e=>e.stopPropagation()} alt=""/>
      <button class="lightbox-close" onClick=${()=>setLb(null)}>✕</button>
    </div>`:null}
  </div>`;
}


// ── TREND CHART ───────────────────────────────────────────────────────────────
function TrendChart({entries,zones}){
  const d14=()=>{const d=new Date();d.setDate(d.getDate()-14);return d.toISOString().slice(0,10);};
  const[from,setFrom]=useState(d14);
  const[to,setTo]=useState(todayStr);
  const[variable,setVariable]=useState('drain_pct');
  const canvasRef=useRef(null);
  const chartRef=useRef(null);
  const VARS=[
    {id:'drain_pct',label:'Drain %',   fn:(d,z)=>{const r=calcDer(d,z.drainDrippers,z.privaDrippers);return r.pct;}},
    {id:'drip_ec',  label:'Drip EC',   fn:(d)=>{const v=parseFloat(d.drip_ec);return isNaN(v)||v<=0?null:v;}},
    {id:'drain_ec', label:'Drain EC',  fn:(d)=>{const v=parseFloat(d.drain_ec);return isNaN(v)||v<=0?null:v;}},
    {id:'drip_ph',  label:'Drip pH',   fn:(d)=>{const v=parseFloat(d.drip_ph);return isNaN(v)||v<=0?null:v;}},
    {id:'drain_ph', label:'Drain pH',  fn:(d)=>{const v=parseFloat(d.drain_ph);return isNaN(v)||v<=0?null:v;}},
    {id:'ec_sum',   label:'EC Sum',    fn:(d,z)=>{const r=calcDer(d,z.drainDrippers,z.privaDrippers);return r.ecSum;}},
  ];
  const COLORS=['#1976d2','#388e3c','#d32f2f','#f57c00','#7b1fa2','#0097a7','#689f38','#ffa000','#c2185b','#5d4037'];

  useEffect(()=>{
    if(!canvasRef.current||typeof Chart==='undefined')return;
    const sorted=Object.values(entries)
      .filter(e=>e&&e.date&&e.date>=from&&e.date<=to)
      .sort((a,b)=>a.date.localeCompare(b.date));
    if(sorted.length===0){if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}return;}
    const labels=sorted.map(e=>fmtDate(e.date));
    const varDef=VARS.find(v=>v.id===variable)||VARS[0];
    const datasets=zones.map((zone,i)=>{
      const data=sorted.map(entry=>{
        const d=entry[zone.id];if(!d)return null;
        const val=varDef.fn(d,zone);
        return(val===null||val===undefined||isNaN(val))?null:parseFloat(parseFloat(val).toFixed(2));
      });
      const lbl=zone.label.replace('Zone ','Z').replace(' North','N').replace(' South','S').replace('1.','');
      return{label:lbl,data,borderColor:COLORS[i%COLORS.length],backgroundColor:COLORS[i%COLORS.length]+'20',borderWidth:1.5,pointRadius:3,spanGaps:false,tension:0.15};
    });
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}
    chartRef.current=new Chart(canvasRef.current,{type:'line',data:{labels,datasets},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}},
        scales:{
          y:{title:{display:true,text:varDef.label,font:{size:11}},grid:{color:'rgba(0,0,0,.05)'}},
          x:{ticks:{maxRotation:40,font:{size:10}},grid:{color:'rgba(0,0,0,.03)'}}
        }
      }
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[from,to,variable,entries,zones]);

  const cnt=Object.values(entries).filter(e=>e&&e.date&&e.date>=from&&e.date<=to).length;
  return html`
  <div style=${{background:'#fff',border:'1.5px solid #e8e8e8',borderRadius:12,padding:'12px 14px',marginBottom:14}}>
    <p style=${{fontSize:11,fontWeight:700,color:'#555',letterSpacing:'.06em',textTransform:'uppercase',margin:'0 0 10px'}}>Trend Chart</p>
    <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      <input type="date" value=${from} onChange=${e=>setFrom(e.target.value)}
        style=${{flex:1,minWidth:110,padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafaf8'}}/>
      <span style=${{fontSize:12,color:'#aaa',alignSelf:'center'}}>→</span>
      <input type="date" value=${to} onChange=${e=>setTo(e.target.value)}
        style=${{flex:1,minWidth:110,padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafal8'}}/>
      <select value=${variable} onChange=${e=>setVariable(e.target.value)}
        style=${{width:'100%',padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafaf8',cursor:'pointer'}}>
        ${VARS.map(v=>html`<option key=${v.id} value=${v.id}>${v.label}</option>`)}
      </select>
    </div>
    ${cnt===0
      ?html`<p style=${{textAlign:'center',color:'#ccc',padding:'30px 0',fontSize:13}}>No entries in this date range</p>`
      :html`<div style=${{position:'relative',height:260}}><canvas ref=${canvasRef}></canvas></div>
            <p style=${{fontSize:10,color:'#ccc',marginTop:5,textAlign:'center'}}>${cnt} day${cnt!==1?'s':''} · tap legend labels to show/hide zones</p>`
    }
  </div>`;
}

function ZoneEditor({zones,onSave}){

  const[draft,setDraft]=useState(null);
  const[dirty,setDirty]=useState(false);
  const startEdit=z=>{setEditId(z.id);setDraft({...z});};
  const cancelEdit=()=>{setEditId(null);setDraft(null);};
  const saveEdit=()=>{setLocal(l=>l.map(z=>z.id===editId?{...draft}:z));setEditId(null);setDraft(null);setDirty(true);};
  const addZone=()=>{const nz={id:genId(),label:'New Zone',valve:'Valve —',location:'',variety:'',hasPriva:false,stage:'first_crop'};setLocal(l=>[...l,nz]);setEditId(nz.id);setDraft({...nz});setDirty(true);};
  const delZone=id=>{if(!confirm('Remove zone? Saved readings are not deleted.'))return;setLocal(l=>l.filter(z=>z.id!==id));setDirty(true);};
  const move=(id,dir)=>{setLocal(l=>{const i=l.findIndex(z=>z.id===id);if(i<0)return l;const n=[...l];const s=i+dir;if(s<0||s>=n.length)return l;[n[i],n[s]]=[n[s],n[i]];return n;});setDirty(true);};

      <span style=${{fontSize:13,color:'#888'}}>${local.length} zones</span>
      <div style=${{display:'flex',gap:7}}>
        ${dirty?html`<button class="btn btn-sm" onClick=${()=>{onSave(local);setDirty(false);}}>Save changes</button>`:null}
        <button class="btn btn-sm btn-out" onClick=${addZone}>+ Add zone</button>

    ${local.map((z,i)=>html`

          <div><label class="fl" style=${{fontSize:11}}>Valve / Block</label><${TInput} value=${draft.valve} onChange=${v=>setDraft(d=>({...d,valve:v}))} placeholder="Valve 1"/></div>
        </div>
        <div style=${{marginBottom:8}}><label class="fl" style=${{fontSize:11}}>Location / description</label><${TInput} value=${draft.location} onChange=${v=>setDraft(d=>({...d,location:v}))} placeholder="e.g. 2nd Tunnel, 14 drippers"/></div>
        <div style=${{marginBottom:8}}><label class="fl" style=${{fontSize:11}}>Variety</label><${TInput} value=${draft.variety} onChange=${v=>setDraft(d=>({...d,variety:v}))} placeholder="e.g. Florida Beauty – 250cc"/></div>
        <div style=${{marginBottom:10}}>
          <label class="fl" style=${{fontSize:11}}>Current Growth Stage</label>
          <select style=${{width:'100%',padding:'8px 10px',border:'1.5px solid #ddd',borderRadius:8,fontSize:14,background:'#fafaf8',fontFamily:'inherit',outline:'none',cursor:'pointer'}}
            value=${draft.stage||'first_crop'} onChange=${e=>setDraft(d=>({...d,stage:e.target.value}))}>
            <option value="">— None (Raspberry / non-staged) —</option>
            ${STAGE_ORDER.map(k=>html`<option key=${k} value=${k}>${GROWTH_STAGES[k].label}</option>`)}
          </select>
          ${sg?html`<p style=${{fontSize:11,color:'#888',marginTop:4}}>Drip ${sg.drip[0]}–${sg.drip[1]} mS | Drain ${sg.drain[0]}–${sg.drain[1]} mS | R/O ${sg.pct[0]}–${sg.pct[1]}%</p>`:null}
