<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/preact@10.23.0/dist/preact.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/preact@10.23.0/hooks/dist/hooks.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
'use strict';
const{h,render:prender}=preact;
const{useState,useEffect,useCallback,useRef}=preactHooks;
const html=htm.bind(h);

// ── LOCAL DATE ────────────────────────────────────────────────────────────────
const todayStr=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'}):'';
const calcEAHD=(sprayDate,phiDays=0)=>{const d=new Date((sprayDate||todayStr())+'T12:00:00');d.setDate(d.getDate()+(parseInt(phiDays)||0));return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const genId=()=>'Z_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

// ── LOCALSTORAGE ──────────────────────────────────────────────────────────────
const LS={
  get:(k,def)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):def;}catch{return def;}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn('LS write fail',k,e);}},
  del:(k)=>{try{localStorage.removeItem(k);}catch{}},
  keys:(pre)=>{const r=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(pre))r.push(k);}return r;},
  kbUsed:()=>{let n=0;for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=(k.length+(localStorage.getItem(k)||'').length)*2;}return Math.round(n/1024);},
};

// ── GROWTH STAGES ─────────────────────────────────────────────────────────────
const GROWTH_STAGES={
  wet_up:      {label:'Initial Wet-up',            drip:[1.2,1.4],drain:[0.8,1.3],pct:[15,25],raiseIf:0.8, reduceIf:1.4,note:'Raise drip EC if drain <0.8 | Reduce if drain >1.4'},

// ── DOMAIN LOGIC ──────────────────────────────────────────────────────────────
const emptyZone=()=>({drip_ec:'',drip_ph:'',drip_ml:'',drain_ec:'',drain_ph:'',drain_ml:'',priva_ec:'',priva_ph:'',priva_ml:''});
const emptyDay=(zones,dt)=>{const d={date:dt||todayStr(),notes:'',attachments:[]};zones.forEach(z=>{d[z.id]=emptyZone();});return d;};

// CORRECTED: drain% = drain_ml / (drip_ml * N) * 100
// drip from 1 emitter, drain from N emitters
function calcDer(z={},drainDrippers,privaDrippers){
  const dm=parseFloat(z.drip_ml)||0,rm=parseFloat(z.drain_ml)||0;
  const pct=(dm>0&&rm>=0&&drainDrippers>0)?rm/(dm*drainDrippers)*100:null;
  const a=parseFloat(z.drip_ec),b=parseFloat(z.drain_ec);
  const ecSum=(!isNaN(a)&&!isNaN(b)&&a>0&&b>0)?a+b:null;
  const prm=parseFloat(z.priva_ml)||0;
  const privaPct=(dm>0&&prm>0&&privaDrippers>0)?prm/(dm*privaDrippers)*100:null;
  return{pct,ecSum,privaPct};
}

function zoneStatus(data={},stageKey,drainDrippers,privaDrippers){
  const sg=GROWTH_STAGES[stageKey];
  if(!sg){
    const der=calcDer(data,drainDrippers,privaDrippers),ph=parseFloat(data.drip_ph);
    if(der.ecSum>3.5||(der.pct!==null&&der.pct<8))return{overall:'danger',flags:[]};
    if(der.ecSum>3.0||(der.pct!==null&&der.pct<15))return{overall:'warn',flags:[]};
    if(!isNaN(ph)&&(ph<5.0||ph>7.0))return{overall:'danger',flags:[]};
    if(!isNaN(ph)&&(ph<5.3||ph>6.5))return{overall:'warn',flags:[]};
    return{overall:'ok',flags:[]};
  }
  const dec=parseFloat(data.drip_ec),drc=parseFloat(data.drain_ec),ph=parseFloat(data.drip_ph);
  const der=calcDer(data,drainDrippers,privaDrippers);
  const flags=[];let overall='ok';
  if(!isNaN(drc)&&drc>0&&drc>sg.reduceIf){flags.push({lvl:'danger',msg:`Drain EC ${drc.toFixed(2)} > ${sg.reduceIf} → Reduce drip EC`});overall='danger';}
  else if(!isNaN(drc)&&drc>0&&drc>sg.drain[1]){flags.push({lvl:'warn',msg:`Drain EC ${drc.toFixed(2)} above target (${sg.drain[0]}–${sg.drain[1]})`});if(overall!=='danger')overall='warn';}
  else if(sg.raiseIf!==null&&!isNaN(drc)&&drc>0&&drc<sg.raiseIf){flags.push({lvl:'warn',msg:`Drain EC ${drc.toFixed(2)} < ${sg.raiseIf} → Raise drip EC`});if(overall!=='danger')overall='warn';}
  if(!isNaN(dec)&&dec>0&&(dec<sg.drip[0]||dec>sg.drip[1])){flags.push({lvl:'warn',msg:`Drip EC ${dec.toFixed(2)} outside ${sg.drip[0]}–${sg.drip[1]}`});if(overall!=='danger')overall='warn';}
  if(der.pct!==null){
    if(der.pct<sg.pct[0]-5){flags.push({lvl:'warn',msg:`Drain ${der.pct.toFixed(0)}% below ${sg.pct[0]}–${sg.pct[1]}% target`});if(overall!=='danger')overall='warn';}
    else if(der.pct>sg.pct[1]+15){flags.push({lvl:'warn',msg:`Drain ${der.pct.toFixed(0)}% above target`});if(overall!=='danger')overall='warn';}
  }
  if(!isNaN(ph)&&ph>0){
    if(ph<4.5||ph>7.5){flags.push({lvl:'danger',msg:`Drip pH ${ph.toFixed(2)} — critical`});overall='danger';}
    else if(ph<5.3||ph>5.5){flags.push({lvl:'warn',msg:`Drip pH ${ph.toFixed(2)} outside 5.3–5.5`});if(overall!=='danger')overall='warn';}
  }
  return{overall,flags};
}

async function compressImg(file){
  return new Promise((res,rej)=>{
    const reader=new FileReader();reader.onerror=rej;
    reader.onload=e=>{
      const img=new Image();img.onerror=rej;
      img.onload=()=>{
        const MAX=700,scale=img.width>MAX?MAX/img.width:1;
        const c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72));
      };img.src=e.target.result;
    };reader.readAsDataURL(file);
  });
}

// No SDK needed — Supabase exposes a standard REST + PostgREST API
// ── AUTH HELPERS ─────────────────────────────────────────────────────────────
// Returns the best available auth token: user session > anon key
function sbAuthToken(){
  const sess=LS.get('hff:sb_session',null);
  if(sess&&sess.access_token&&sess.expires_at&&Date.now()<sess.expires_at*1000)
    return{token:sess.access_token,isUser:true};
  return{token:LS.get('hff:sb_key',''),isUser:false};
}

async function sbLogin(email,password){
  const url=LS.get('hff:sb_url','');
  if(!url)return{ok:false,msg:'No Supabase URL configured'};
  try{
    const r=await fetch(url.replace(/\/+$/,'')+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':LS.get('hff:sb_key','')},
      body:JSON.stringify({email,password})
    });
    const d=await r.json();
    if(!r.ok)return{ok:false,msg:d?.error_description||d?.msg||'Login failed'};
    LS.set('hff:sb_session',{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at,email:d.user?.email});
    return{ok:true,email:d.user?.email};
  }catch(e){return{ok:false,msg:e.message};}
}

async function sbRefreshSession(){
  const sess=LS.get('hff:sb_session',null);
  if(!sess?.refresh_token)return false;
  const url=LS.get('hff:sb_url','');
  try{
    const r=await fetch(url.replace(/\/+$/,'')+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':LS.get('hff:sb_key','')},
      body:JSON.stringify({refresh_token:sess.refresh_token})
    });
    if(!r.ok)return false;
    const d=await r.json();
    LS.set('hff:sb_session',{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:d.expires_at,email:sess.email});
    return true;
  }catch(e){return false;}
}

function sbLogout(){LS.del('hff:sb_session');}

function sbIsLoggedIn(){
  const sess=LS.get('hff:sb_session',null);
  return !!(sess&&sess.access_token&&sess.expires_at&&Date.now()<sess.expires_at*1000);
}

async function sbReq(method,path,body,url,key){
  const base=url.replace(/\/+$/,'');
  const{token}=sbAuthToken();
  const h={'apikey':key,'Authorization':'Bearer '+token,'Content-Type':'application/json'};
  if(method==='POST')h['Prefer']='resolution=merge-duplicates';
  let r=await fetch(base+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
  // If 401, try refreshing session once
  if(r.status===401&&sbIsLoggedIn()){
    const refreshed=await sbRefreshSession();
    if(refreshed){
      const{token:t2}=sbAuthToken();
      h['Authorization']='Bearer '+t2;
      r=await fetch(base+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
    }
  }
  return r;
}

async function sbPush(entry,cropId){
  const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key',''),team=LS.get('hff:sb_team','howe-farms-2026');
  if(!url||!key)return{ok:false,reason:'not-configured'};
  // Image binaries stay local; only sync metadata so payload stays small
  const safe={...entry,attachments:(entry.attachments||[]).map(({id,caption,timestamp,name})=>({id,caption,timestamp,name}))};
  const row={id:team+':'+cropId+':'+entry.date,team_id:team,crop:cropId,date:entry.date,entry_data:safe,updated_at:new Date().toISOString()};
  try{const r=await sbReq('POST','irrigation_entries',row,url,key);
    if(!r.ok){const e=await r.json().catch(()=>({}));return{ok:false,status:r.status,msg:e?.message||'HTTP '+r.status};}

}

    if(!r.ok)return{ok:false,msg:'HTTP '+r.status};
    const authInfo=sbIsLoggedIn()?(' · Logged in as '+LS.get('hff:sb_session',{}).email):'· Using anon key (not secure)';
    return{ok:true,msg:'Connected ✓'+authInfo};}
  catch(e){return{ok:false,msg:e.message};}
}

// Merge a remote rows array into a local entries map (last-write-wins by updated_at vs _savedAt)
function mergeRemote(localMap,rows){
  const updated={...localMap};
  (rows||[]).forEach(row=>{
    const remote=row.entry_data;
    if(!remote?.date)return;
    const local=updated[remote.date];
    const remoteTs=row.updated_at||'1970-01-01T00:00:00Z';
    const localTs=local?._savedAt||'1970-01-01T00:00:00Z';
    if(!local||remoteTs>localTs)updated[remote.date]=remote;
  });
  return updated;
}

function SprayPill({name, frac, irac, rate, unit}){
  const cls = name ? (

    (SPRAY_PROD_DB[name]||{type:'N'}).type==='I' ? 'sp-pi' : 'sp-pn'
  ) : 'sp-pn';
  const grp = frac||irac||'';
  const tip = rate ? rate+unit+'/ac' : '';
  return html`<span class=${'sp-pill '+cls} title=${tip}>${name}${grp?' '+grp:''}</span>`;
}

function SprayEvCard({ev,onEdit,onDelete}){
  const locCls = ev.loc==='Tunnels' ? 'sp-loc-t' : 'sp-loc-f';
  const rates = ev.products.map(p=>p.rate?p.name+': '+p.rate+p.unit+'/ac':null).filter(Boolean).join(' · ');
  return html`<div class="sp-ev">
    <div class="sp-ev-head">
      <span class="sp-ev-date">${ev.date}${ev.note?' — '+ev.note:''}</span>
      <div class="sp-ev-meta">

        <span style=${{fontSize:10,color:'#aaa'}}>${ev.gpa} GPA · ${ev.acres}ac</span>

  const nm = (v,u) => u==='kg'?v*1000:u==='L'?v*1000:v;
  const du = u => u==='kg'?'g':u==='L'?'mL':u;
  const n = nm(parseFloat(p.amt)||0, p.unit);
  const d = du(p.unit);
  const ratePerAc = n&&apt ? (n/apt).toFixed(1) : null;
  const totalAmt = n&&apt&&acres ? (n/apt)*acres : null;
  const totalStr = totalAmt ? (
    d==='g'&&totalAmt>=1000 ? (totalAmt/1000).toFixed(2)+'kg total' :
    d==='mL'&&totalAmt>=1000 ? (totalAmt/1000).toFixed(2)+'L total' :
    totalAmt.toFixed(0)+d+' total'
  ) : '';
  
  // Per-zone breakdown for partial tunnel selection
  let zoneBreak = '';
  if(isTunnels && bZones && bZones.length > 0 && bZones.length < TUNNEL_ZONES.length && n && apt) {
    const sel = TUNNEL_ZONES.filter(z=>bZones.includes(z.id));
    zoneBreak = sel.map(z=>{
      const tot = ((n/apt)*z.acres).toFixed(0);
      return z.label+': '+tot+d;
    }).join(' · ');
  }

  const flags = [];
  const prodOpts2 = [];  // not needed here
  if(info.needsOil) flags.push('⚠ Requires PureSpray Green Oil');
  if(info.prefOil) flags.push('⚠ Add PureSpray Green Oil for best results');
  if(info.bioSafe) flags.push('✓ Bio-safe (Orius)');
  if(info.needsPH) flags.push('⚠ Spray water pH must be >5');
  if(info.noMix) flags.push('⛔ Never tank mix with anything');
  if(info.noBloom) flags.push('⛔ Do not use at bloom — petal retention');
  if(info.noFrost) flags.push('⚠ Do not apply within 24–48h of frost');
  const flagStr = flags.join(' · ');

  const prodNames = Object.keys(SPRAY_PROD_DB);
  return html`<div class="sp-pe">
    <div class="sp-pr">
      <select class="sp-sel" value=${p.name} onChange=${e=>onUpdate(p.id,'name',e.target.value)}>
        <option value="">— select product —</option>
        ${prodNames.map(n=>html`<option key=${n} value=${n}>${n}</option>`)}
        <option value="Other">Other</option>
      </select>
      <input type="number" class="sp-sel" value=${p.amt} onInput=${e=>onUpdate(p.id,'amt',e.target.value)} placeholder="0" min="0" step="any"/>
      <select class="sp-sel" value=${p.unit} onChange=${e=>onUpdate(p.id,'unit',e.target.value)}>
        <option>g</option><option>mL</option><option>L</option><option>kg</option>
      </select>
      <button class="sp-rmb" onClick=${()=>onRemove(p.id)}>✕</button>
    </div>
    <div class="sp-prate" style=${{display:ratePerAc?'flex':'none',gap:12,flexWrap:'wrap'}}>
      <span>${ratePerAc?'→ '+ratePerAc+' '+d+'/ac':''}</span>
      <span style=${{color:'#1a2b1a',fontWeight:600}}>${totalStr}</span>
      <div style=${{display:zoneBreak?'block':'none',color:'#666',fontSize:10}}>${zoneBreak}</div>
    </div>
    <div class="sp-pflag">${flagStr}</div>
  </div>`;
}

// ── SPRAY BRAIN — PREACT COMPONENT ───────────────────────────────────────────
function SprayBrain(){
  const[spView,setSV]=useState('season');
  const[spFilter,setSF]=useState('all');
  const[spEvents,setSE]=useState(()=>{const s=LS.get('hff:spray:events',null);return(s&&s.length>0)?s:SPRAY_SEED;});
  const[spSync,setSync]=useState('idle');
  const[bZones,setBZ]=useState(()=>TUNNEL_ZONES.map(z=>z.id));
  const[bFieldZone,setBFZ]=useState('fall');
  const[bLoc,setBL]=useState('Tunnels — Hagie 160 gal');
  const[bGpa,setBG]=useState('100');
  const[bAcres,setBA]=useState('19.5');
  const[bDate,setBD]=useState(todayStr());
  const[bTime,setBT]=useState('');
  const[bApplicator,setBAp]=useState(()=>LS.get('hff:spray:applicator','Julio'));
  const[editId,setEditId]=useState(null);
  const[bProds,setBP]=useState([{id:1,name:'',amt:'',unit:'g'}]);
  const[bCtr,setBC]=useState(1);
  const[bJulio,setBJ]=useState(null);
  const[bRec,setBR]=useState(null);
  const[bGap,setBGap]=useState([]);
  const[bWarn,setBW]=useState('');
  const[aLoc,setAL]=useState('Tunnels');
  const[aStg,setAS]=useState('Green fruit');
  const[aTgt,setAT]=useState('Powdery mildew');
  const[aPres,setAP]=useState('Preventative');
  const[aNotes,setAN]=useState('');
  const[aOut,setAO]=useState('');
  const[aLoad,setALoad]=useState(false);

  useEffect(()=>{LS.set('hff:spray:events',spEvents);},[spEvents]);

  useEffect(()=>{
    const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
    if(!url||!key)return;
    setSync('syncing');
    sbSprayPull().then(rows=>{
      if(!rows){setSync('err');return;}
      if(rows.length===0){setSync('ok');return;}
      setSE(prev=>{
        const map={};prev.forEach(e=>{map[e.id]=e;});
        rows.forEach(r=>{if(r.event_data?.id)map[r.event_data.id]=r.event_data;});
        const m=Object.values(map).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
        LS.set('hff:spray:events',m);return m;
      });
      setSync('ok');
    });
  },[]);

  const isTunnels=!bLoc.includes('Field');
  const tvol=isTunnels?SPRAY_TANK_VOL.tunnels:SPRAY_TANK_VOL.field;
  const gpa=parseFloat(bGpa)||100;
  const apt=tvol/gpa;
  const fieldZoneObj=FIELD_ZONES.find(z=>z.id===bFieldZone)||FIELD_ZONES[0];
  const fieldAcres=fieldZoneObj.acres!==null?fieldZoneObj.acres:parseFloat(bAcres)||19.5;
  const tunnelAcres=bZones.length===TUNNEL_ZONES.length?TUNNEL_TOTAL:TUNNEL_ZONES.filter(z=>bZones.includes(z.id)).reduce((s,z)=>s+z.acres,0);
  const acres=isTunnels?(tunnelAcres||TUNNEL_TOTAL):fieldAcres;

  function chkWarn(prods){
    const sel=prods.map(p=>p.name).filter(Boolean);
    const w=[];
    if(sel.includes('Sanidate')&&sel.length>1)w.push('⛔ Sanidate cannot be tank mixed with anything');
    if(sel.some(n=>SPRAY_PROD_DB[n]?.isOil)&&sel.some(n=>SPRAY_PROD_DB[n]?.isSulf))w.push('⛔ Oil + Sulfur in same tank — crop injury risk');
    setBW(w.join('\n'));
  }

  function addP(){const id=bCtr+1;setBC(id);setBP(p=>[...p,{id,name:'',amt:'',unit:'g'}]);}
  function updP(id,f,v){
    setBP(p=>{
      const u=p.map(r=>{
        if(r.id!==id)return r;
        let nr={...r,[f]:v};
        // When a product is selected, auto-fill the per-tank amount from the label rate table.
        // Example: Delegate 0.105 kg/ac at 1.6 ac/tank -> 0.17 kg per tank.
        if(f==='name'){
          const fill=tankAmountFromRateLabel(v);
          if(fill){nr={...nr,amt:fill.amt,unit:fill.unit};}
        }
        return nr;
      });
      chkWarn(u);return u;
    });
  }
  function remP(id){setBP(p=>{const u=p.filter(r=>r.id!==id);chkWarn(u);return u;});}
  const nm=(v,u)=>u==='kg'?v*1000:u==='L'?v*1000:v;
  const du=u=>u==='kg'?'g':u==='L'?'mL':u;
  function rateDisplay(prod){
    const info=SPRAY_PROD_DB[prod.name]||{};
    if(prod.rate&&prod.unit)return prod.rate+prod.unit+'/ac';
    return info.rateLabel||'—';
  }
  function parseRateLabel(label){
    if(!label||label==='—'||label.includes('%'))return null;
    const m=String(label).match(/([0-9.]+)\s*(kg|g|L|mL)\s*\/?\s*ac/i);
    if(!m)return null;
    return {rate:parseFloat(m[1]),unit:m[2]};
  }
  function tankAmountFromRateLabelForApt(name, aptVal){
    const info=SPRAY_PROD_DB[name]||{};
    const parsed=parseRateLabel(info.rateLabel);
    if(!parsed||!aptVal)return null;
    const amount=parsed.rate*aptVal;
    const rounded=amount>=10?Math.round(amount):Math.round(amount*100)/100;
    return {amt:String(rounded),unit:parsed.unit};
  }
  function tankAmountFromRateLabel(name){
    return tankAmountFromRateLabelForApt(name, apt);
  }
  function recalcProductsForApt(aptVal){
    setBP(prev=>{
      const u=prev.map(r=>{
        if(!r.name)return r;
        const fill=tankAmountFromRateLabelForApt(r.name, aptVal);
        return fill?{...r,amt:fill.amt,unit:fill.unit}:r;
      });
      chkWarn(u);
      return u;
    });
    setBJ(null);setBR(null);setBGap([]);
  }
  function handleGpaChange(v){
    setBG(v);
    const newGpa=parseFloat(v)||100;
    const newTankVol=(!bLoc.includes('Field'))?SPRAY_TANK_VOL.tunnels:SPRAY_TANK_VOL.field;
    recalcProductsForApt(newTankVol/newGpa);
  }
  function handleLocChange(v){
    setBL(v);
    const newGpa=parseFloat(bGpa)||100;
    const newTankVol=(!v.includes('Field'))?SPRAY_TANK_VOL.tunnels:SPRAY_TANK_VOL.field;
    recalcProductsForApt(newTankVol/newGpa);
  }

  function genJulio(){
    const vp=bProds.filter(p=>p.name&&parseFloat(p.amt)>0);
    if(!vp.length){alert('Add at least one product with a quantity');return;}
    const lines=['Julio,'];
    const rF=[],rI=[],rN=[],ff=new Set(),fi=new Set();
    if(isTunnels&&bZones.length<TUNNEL_ZONES.length){
      lines.push('Zones: '+TUNNEL_ZONES.filter(z=>bZones.includes(z.id)).map(z=>z.label).join(', ')+' ('+acres.toFixed(2)+' ac)');
    }
    vp.forEach(p=>{
      // Use the label-rate calculation at the current GPA/tank size for Julio text,
      // even if React has not finished updating the visible input value yet.
      // Example: 160 gal ÷ 50 GPA = 3.2 ac/tank, then rate/ac × 3.2 = product/tank.
      const fill=tankAmountFromRateLabelForApt(p.name, apt);
      const tankAmt=fill?fill.amt:p.amt;
      const tankUnit=fill?fill.unit:p.unit;
      lines.push(p.name+' — '+tankAmt+tankUnit+' per tank');
      const n=nm(parseFloat(tankAmt),tankUnit);const d=du(tankUnit);const rt=(n/apt).toFixed(1);
      const info=SPRAY_PROD_DB[p.name]||{type:'N'};
      const entry=p.name+' '+rt+d+'/ac';
      if(info.type==='F'){rF.push(entry);if(info.frac)ff.add(info.frac);}
      else if(info.type==='I'){rI.push(entry);if(info.irac)fi.add(info.irac);}
      else rN.push(entry);
    });
    lines.push(gpa+' GPA');
    setBJ(lines.join('\n'));
    setBR(bDate+'\t'+(rF.join(', ')||'—')+'\t'+([...ff].join(', ')||'—')+'\t'+([...rI,...rN].join(', ')||'—')+'\t'+([...fi].join(', ')||'—')+'\t'+gpa+' GPA · '+tvol+'gal · '+apt.toFixed(2)+'ac/tank · '+acres.toFixed(2)+'ac');
    const locLabel=isTunnels?(bZones.length<TUNNEL_ZONES.length?'Tunnels — '+TUNNEL_ZONES.filter(z=>bZones.includes(z.id)).map(z=>z.label).join(', '):'Tunnels — All'):fieldZoneObj.label;
    const gapRows=vp.filter(p=>SPRAY_PROD_DB[p.name]?.type!=='N').map(p=>{
      const info=SPRAY_PROD_DB[p.name]||{};
      const fill=tankAmountFromRateLabelForApt(p.name, apt);
      const tankAmt=fill?fill.amt:p.amt;
      const tankUnit=fill?fill.unit:p.unit;
      const n=nm(parseFloat(tankAmt),tankUnit);const d=du(tankUnit);
      const rate=(n/apt).toFixed(1)+' '+d+'/ac';
      const eahd=calcEAHD(bDate,info.phi);
      return[p.name,info.pcp||'—',info.phi!==undefined?info.phi+'d':'—',eahd,rate,locLabel,bDate+' '+bTime,bApplicator].join('\t');
    });
    setBGap(gapRows);
  }

  function saveEv(){
    const vp=bProds.filter(p=>p.name&&parseFloat(p.amt)>0);if(!vp.length)return;
    const id=editId||('ev-'+Date.now());
    const zoneNote=isTunnels
      ?(bZones.length<TUNNEL_ZONES.length?'Zones: '+TUNNEL_ZONES.filter(z=>bZones.includes(z.id)).map(z=>z.label).join(', '):'')
      :(fieldZoneObj.label!=='All field'?fieldZoneObj.label:'');
    LS.set('hff:spray:applicator',bApplicator);
    const event={id,date:bDate,time:bTime,loc:isTunnels?'Tunnels':'Field',gpa,acres,note:zoneNote,applicator:bApplicator,
      products:vp.map(p=>{const fill=tankAmountFromRateLabelForApt(p.name, apt);const tankAmt=fill?fill.amt:p.amt;const tankUnit=fill?fill.unit:p.unit;const n=nm(parseFloat(tankAmt),tankUnit);const d=du(tankUnit);const info=SPRAY_PROD_DB[p.name]||{type:'N',frac:null,irac:null,pcp:null,phi:0};
        return{name:p.name,rate:+(n/apt).toFixed(1),unit:d,type:info.type,frac:info.frac||null,irac:info.irac||null,pcp:info.pcp||null,phi:info.phi??0,rei:info.rei||null,eahd:calcEAHD(bDate,info.phi)};})};
    const upd=[event,...spEvents.filter(e=>e.id!==id)].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
    setSE(upd);
    const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
    if(url&&key){setSync('syncing');sbSprayPush(event).then(r=>setSync(r.ok?'ok':'err'));}
    setBJ(null);setBR(null);setBGap([]);setBP([{id:1,name:'',amt:'',unit:'g'}]);setBC(1);setBW('');setEditId(null);
    setSV('season');
  }

  function editSprayEvent(ev){
    const locIsTunnels=ev.loc==='Tunnels';
    const tankVol=locIsTunnels?SPRAY_TANK_VOL.tunnels:SPRAY_TANK_VOL.field;
    const eventGpa=parseFloat(ev.gpa)||100;
    const eventApt=tankVol/eventGpa;
    setEditId(ev.id);
    setSV('build');
    setBL(locIsTunnels?'Tunnels — Hagie 160 gal':'Field — 720 gal');
    setBG(String(ev.gpa||100));
    setBD(ev.date||todayStr());
    setBT(ev.time||'');
    setBA(String(ev.acres||''));
    setBAp(ev.applicator||LS.get('hff:spray:applicator','Julio'));
    setBJ(null);setBR(null);setBGap([]);setBW('');
    setBP((ev.products||[]).map((p,i)=>({id:i+1,name:p.name||'',amt:p.rate?String(+(p.rate*eventApt).toFixed(2)):'',unit:p.unit||'g'})));
    setBC((ev.products||[]).length||1);
  }

  function deleteSprayEvent(ev){
    if(!confirm('Delete this spray event?\n\n'+ev.date+(ev.note?' — '+ev.note:'')+'\n'+ev.products.map(p=>p.name).join(', ')))return;
    const upd=spEvents.filter(e=>e.id!==ev.id);
    setSE(upd);LS.set('hff:spray:events',upd);
    const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
    if(url&&key){setSync('syncing');sbSprayDelete(ev.id).then(r=>setSync(r.ok?'ok':'err'));}
  }


  function updateSprayAudit(eventId, patch){
    const upd=spEvents.map(ev=>{
      if(ev.id!==eventId)return ev;
      const audit={...(ev.audit||{}),...patch};
      const updated={...ev,audit,updated_at:new Date().toISOString()};
      const url=LS.get('hff:sb_url',''),key=LS.get('hff:sb_key','');
      if(url&&key){setSync('syncing');sbSprayPush(updated).then(r=>setSync(r.ok?'ok':'err'));}
      return updated;
    }).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
    setSE(upd);LS.set('hff:spray:events',upd);
  }

  function maxEventEAHD(ev){
    const dates=(ev.products||[])
      .filter(p=>p.type!=='N')
      .map(p=>p.eahd||calcEAHD(ev.date,p.phi||0))
      .filter(Boolean)
      .sort();
    return dates.length?dates[dates.length-1]:ev.date;
  }

  function exportAuditCSV(){
    const rows=[['Date','Location','Acres','GPA','Product','PCP #','Rate/ac','PHI','EAHD','Harvest Delayed Until EAHD','Verified Date','Field and Packaging Inspected Before Harvest','Inspection Date','Applicator'].join(',')];
    [...spEvents].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).forEach(ev=>{
      (ev.products||[]).filter(p=>p.type!=='N').forEach(prod=>{
        const audit=ev.audit||{};
        const cells=[ev.date,ev.loc,ev.acres,ev.gpa,prod.name,prodPCP(prod),rateDisplay(prod),(prodPHI(prod)??'—')+'d',prodEAHD(ev,prod),audit.phiVerified?'YES':'NO',audit.phiVerifiedDate||'',audit.preHarvestInspection?'YES':'NO',audit.preHarvestInspectionDate||'',ev.applicator||''];
        rows.push(cells.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(','));
      });
    });
    const blob=new Blob([rows.join('\n')],{type:'text/csv'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='Howe_Farms_spray_audit_report_'+todayStr()+'.csv';a.click();URL.revokeObjectURL(url);
  }

  async function runAI(){
    const apiKey=LS.get('hff:apikey','');
    if(!apiKey){setAO('⚠ No API key set — add it in Settings.');return;}
    const hist=spEvents.slice(0,20).map(e=>e.date+' ('+e.loc+' '+e.acres+'ac '+e.gpa+'GPA): '+e.products.map(p=>p.name).join(', ')).join('\n');
    const fF={},fI={},fnF={},fnI={};
    spEvents.forEach(ev=>ev.products.forEach(p=>{
      if(p.frac&&p.type==='F'){fF[p.frac]=(fF[p.frac]||0)+1;fnF[p.frac]=fnF[p.frac]||new Set();fnF[p.frac].add(p.name);}
      if(p.irac&&p.type==='I'){fI[p.irac]=(fI[p.irac]||0)+1;fnI[p.irac]=fnI[p.irac]||new Set();fnI[p.irac].add(p.name);}
    }));
    const fLines=[...Object.entries(fF).map(([g,c])=>'FRAC '+g+' ('+[...fnF[g]].join(', ')+'): '+c+'×'),
      ...Object.entries(fI).map(([g,c])=>'IRAC '+g+' ('+[...fnI[g]].join(', ')+'): '+c+'×')].join('\n')||'No data';
    const prompt=SPRAY_IPM_KB+'\n\nFRAC/IRAC usage:\n'+fLines+'\n\nSpray history (newest first):\n'+hist+'\n\nSituation: '+aLoc+' · '+aStg+' · '+aTgt+' · '+aPres+'\nNotes: '+(aNotes||'none')+'\n\nRecommendation (180 words max):\n1. Top 1-2 products with FRAC/IRAC and rotation rationale\n2. Tank mix partners if justified\n3. Safety flags or timing constraints\n4. What to preserve for next window\nDirect and specific. No disclaimers.';
    setALoad(true);setAO('');
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,messages:[{role:'user',content:prompt}]})});
      const d=await r.json();
      if(!r.ok)setAO('API error ('+r.status+'): '+(d?.error?.message||JSON.stringify(d)));
      else setAO(d.content?.[0]?.text||'No response.');
    }catch(e){setAO('Network error: '+e.message);}
    setALoad(false);
  }

  // Pre-compute FRAC/IRAC counts for rotation view
  const fF={},fI={},fnF={},fnI={};
  spEvents.forEach(ev=>ev.products.forEach(p=>{
    if(p.frac&&p.type==='F'){fF[p.frac]=(fF[p.frac]||0)+1;fnF[p.frac]=fnF[p.frac]||new Set();fnF[p.frac].add(p.name);}
    if(p.irac&&p.type==='I'){fI[p.irac]=(fI[p.irac]||0)+1;fnI[p.irac]=fnI[p.irac]||new Set();fnI[p.irac].add(p.name);}
  }));
  const sdhi=(fF['7']||0)+(fF['7+9']||0)+(fF['7+11']||0)+(fF['7+12']||0);
  const activeFlags=[
    sdhi>=3?{cls:'sp-fr',msg:'SDHI Group 7 used '+sdhi+'× this season (Pristine, Luna Tranquility). Rotate to Switch (9+12), Gatten (U13), Captan, or Folpan.'}:null,
    (fI['5']||0)>=2?{cls:'sp-fr',msg:'IRAC Group 5 (Delegate) used '+(fI['5']||0)+'× in tunnels. Rotate to Exirel (IRAC 28, bio-safe) for next thrips app.'}:null,
    (fI['15,4']||0)>=2?{cls:'sp-fa',msg:'Cormoran (IRAC 15,4) used '+(fI['15,4']||0)+'× in field. Rotate insecticide mode of action.'}:null,
    {cls:'sp-fa',msg:'Bees arriving ~June 25. Group 4 foliar window closing — finish Assail/Cormoran now or shift to Sivanto drip.'},
    {cls:'sp-fa',msg:'Peak bloom — scout now for TPB and Thrips. June 27 was the missed window in 2025.'},
    {cls:'sp-fa',msg:'Fe/Mn deficiency risk at 2nd flush. Begin weekly foliar shots proactively.'},
    {cls:'sp-fg',msg:'Exirel (IRAC 28) unused this season — bio-safe, available for next thrips rotation.'},
  ].filter(Boolean);

  const FG=[['9+12'],['7+11'],['7+9'],['7'],['7+12'],['U13'],['M4'],['M5'],['M2'],['M1'],['NC'],['11+3'],['17'],['33'],['U6'],['BM1']];
  const IG=[['5'],['6'],['21'],['25'],['23'],['28'],['4A'],['4D'],['29'],['15'],['15,4'],['1B']];
  const filtered=spFilter==='all'?spEvents:spEvents.filter(e=>e.loc===spFilter);
  const sorted=[...filtered].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const sbOn=!!(LS.get('hff:sb_url','')&&LS.get('hff:sb_key',''));
  const syncLabel=spSync==='ok'?'☁ synced':spSync==='err'?'⚠ sync error':spSync==='syncing'?'⟳ syncing':'☁';
  const syncColor=spSync==='ok'?'#2e7d32':spSync==='err'?'#c62828':'#888';

  return html`<div>
    <div class="sp-nav">
      <button class=${'sp-nb'+(spView==='season'?' sp-on':'')} onClick=${()=>setSV('season')}>📅<br/>Season</button>
      <button class=${'sp-nb'+(spView==='rotation'?' sp-on':'')} onClick=${()=>setSV('rotation')}>🔄<br/>Rotation</button>
      <button class=${'sp-nb'+(spView==='audit'?' sp-on':'')} onClick=${()=>setSV('audit')}>✅<br/>Audit</button>
      <button class=${'sp-nb'+(spView==='build'?' sp-on':'')} onClick=${()=>setSV('build')}>✉️<br/>Build</button>
      <button class=${'sp-nb'+(spView==='ask'?' sp-on':'')} onClick=${()=>setSV('ask')}>💡<br/>Ask</button>
    </div>

    <div class=${'sp-screen'+(spView==='season'?' sp-on':'')}>
      <div class="sp-stat-grid">
        <div class="sp-stat"><div class="n">${spEvents.length}</div><div class="l">Spray events</div></div>
        <div class="sp-stat"><div class="n">${spEvents.filter(e=>e.loc==='Tunnels').length}</div><div class="l">Tunnel sprays</div></div>
        <div class="sp-stat"><div class="n">${spEvents.filter(e=>e.loc==='Field').length}</div><div class="l">Field sprays</div></div>
      </div>
      ${activeFlags.slice(0,3).map((f,i)=>html`<div key=${i} class=${'sp-flag '+f.cls}>${f.msg}</div>`)}
      <div class="sp-divider"></div>
      <div class="sp-filter-row">
        <button class=${'sp-fb'+(spFilter==='all'?' sp-on':'')} onClick=${()=>setSF('all')}>All</button>
        <button class=${'sp-fb'+(spFilter==='Tunnels'?' sp-on':'')} onClick=${()=>setSF('Tunnels')}>Tunnels</button>
        <button class=${'sp-fb'+(spFilter==='Field'?' sp-on':'')} onClick=${()=>setSF('Field')}>Field</button>
        <span style=${{marginLeft:'auto',fontSize:10,fontWeight:600,color:syncColor,display:sbOn?'inline':'none'}}>${syncLabel}</span>
      </div>
      <div class="sp-sec" style=${{marginTop:0}}>2026 spray history — newest first</div>
      ${sorted.map(ev=>html`<${SprayEvCard} key=${ev.id} ev=${ev} onEdit=${editSprayEvent} onDelete=${deleteSprayEvent}/>`)}
    </div>


    <div class=${'sp-screen'+(spView==='audit'?' sp-on':'')}>
      <div class="sbox">
        <div class="sbox-title">CanadaGAP Spray Audit Report</div>
        <div class="sbox-hint">Use this report to show PCP #, PHI, EAHD, and your two manual harvest-release checks. Check the boxes only after harvest was delayed until the EAHD and the field/packaging inspection was completed before harvest started.</div>
        <div style=${{display:'flex',gap:8,flexWrap:'wrap',marginBottom:10}}>
          <button class="btn btn-sm btn-out" onClick=${exportAuditCSV}>↓ Export audit CSV</button>
          <button class="btn btn-sm btn-out" onClick=${()=>window.print()}>Print page</button>
        </div>
        <div style=${{overflowX:'auto',border:'1.5px solid #e8e8e4',borderRadius:8}}>
          <table class="sp-gap-table">
            <thead><tr>
              ${['Date','Location','Product','PCP #','Rate/ac','PHI','EAHD','Harvest delayed until EAHD','Field & packaging inspected before harvest','Applicator'].map(h=>html`<th key=${h}>${h}</th>`)}
            </tr></thead>
            <tbody>
              ${[...spEvents].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id)).flatMap(ev=>
                (ev.products||[]).filter(p=>p.type!=='N').map((prod,i)=>{
                  const audit=ev.audit||{};
                  const eahd=prodEAHD(ev,prod);
                  return html`<tr key=${ev.id+'-'+i} style=${{background:audit.phiVerified&&audit.preHarvestInspection?'#f8fff8':'#fff'}}>
                    <td>${ev.date}</td>
                    <td>${ev.loc}${ev.note?' — '+ev.note:''}<br/><span style=${{color:'#aaa'}}>${ev.acres}ac · ${ev.gpa} GPA</span></td>
                    <td>${prod.name}</td>
                    <td>${prodPCP(prod)}</td>
                    <td>${prod.rate?prod.rate+prod.unit+'/ac':'—'}</td>
                    <td>${prodPHI(prod)!==null?prodPHI(prod)+'d':'—'}</td>
                    <td><strong>${eahd}</strong></td>
                    <td>
                      <label style=${{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
                        <input type="checkbox" checked=${!!audit.phiVerified} onChange=${e=>updateSprayAudit(ev.id,{phiVerified:e.target.checked,phiVerifiedDate:e.target.checked?todayStr():''})}/>
                        <span>${audit.phiVerified?'✓ '+(audit.phiVerifiedDate||'verified'):'Not verified'}</span>
                      </label>
                    </td>
                    <td>
                      <label style=${{display:'flex',alignItems:'center',gap:6,cursor:'pointer'}}>
                        <input type="checkbox" checked=${!!audit.preHarvestInspection} onChange=${e=>updateSprayAudit(ev.id,{preHarvestInspection:e.target.checked,preHarvestInspectionDate:e.target.checked?todayStr():''})}/>
                        <span>${audit.preHarvestInspection?'✓ '+(audit.preHarvestInspectionDate||'inspected'):'Not inspected'}</span>
                      </label>
                    </td>
                    <td>${ev.applicator||''}</td>
                  </tr>`;
                })
              )}
            </tbody>
          </table>
        </div>
        <p style=${{fontSize:11,color:'#aaa',lineHeight:1.6,marginTop:8}}>Note: The checkboxes are saved with the spray event and synced to Supabase when sync is configured. PCP numbers depend on the product database being filled in for each product.</p>
      </div>
    </div>

    <div class=${'sp-screen'+(spView==='rotation'?' sp-on':'')}>
      <div class="sp-sec">Fungicide FRAC groups</div>
      <p style=${{fontSize:10,color:'#aaa',marginBottom:6}}>Red ≥ 3× · Amber = 2× · Green = 1×</p>
      <div class="sp-frac-grid">
        ${FG.map(([g])=>html`<${SprayFracCell} key=${g} grp=${g} cnt=${fF[g]||0} names=${fnF[g]} prefix="F"/>`)}
      </div>
      <div class="sp-divider"></div>
      <div class="sp-sec">Insecticide IRAC groups</div>
      <div class="sp-frac-grid">
        ${IG.map(([g])=>html`<${SprayFracCell} key=${g} grp=${g} cnt=${fI[g]||0} names=${fnI[g]} prefix="I"/>`)}
      </div>
      <div class="sp-divider"></div>
      <div class="sp-sec">Incompatibility rules</div>
      <div class="sp-flag sp-fr">Sanidate / H₂O₂: Never tank mix with anything. Never use H₂O₂ in spray water.</div>
      <div class="sp-flag sp-fr">Oil + Sulfur: Same tank or within 7 days — crop injury risk (either order).</div>
      <div class="sp-flag sp-fr">Oberon around bloom: Petal retention. Do not use during any bloom period.</div>
      <div class="sp-flag sp-fr">K₂CO₃ in heat: Petal retention. Pawel max 3–6 g/L.</div>
      <div class="sp-flag sp-fa">Magister: Spray water pH must be above 5.</div>
      <div class="sp-flag sp-fa">Frost window: No Xiameter, Cueva, or Inca within 24–48 hrs of frost.</div>
      <div class="sp-flag sp-fg">Bio-safe: Exirel (IRAC 28) and Delegate (IRAC 5) compatible with Orius.</div>
    </div>

    <div class=${'sp-screen'+(spView==='build'?' sp-on':'')}>
      ${editId?html`<div class="sp-flag sp-fa"><strong>Editing saved spray event.</strong> Generate the record row again, then save to update the original event.</div>`:null}
      <div class="sp-form-row">
        <div><label class="sp-lbl">Location</label>
          <select class="sp-sel" value=${bLoc} onChange=${e=>handleLocChange(e.target.value)}>
            <option>Tunnels — Hagie 160 gal</option><option>Field — 720 gal</option>
          </select></div>
        <div><label class="sp-lbl">GPA</label>
          <input type="number" class="sp-sel" value=${bGpa} onInput=${e=>handleGpaChange(e.target.value)} min="10" max="200"/></div>
      </div>
      <${SprayZonePicker} isTunnels=${isTunnels}
        bZones=${bZones} setBZ=${setBZ}
        bFieldZone=${bFieldZone} setBFZ=${setBFZ}
        bAcres=${bAcres} setBA=${setBA}
        bDate=${bDate} setBD=${setBD}
        bTime=${bTime} setBT=${setBT}/>
      <p class="sp-tinfo">${tvol} gal tank · ${apt.toFixed(2)} ac/tank · ~${(acres/apt).toFixed(1)} tanks for ${acres.toFixed(2)} ac</p>
      <div class="sp-form-row" style=${{marginBottom:9}}>
        <div><label class="sp-lbl">Applicator</label>
          <input type="text" class="sp-sel" value=${bApplicator} onInput=${e=>setBAp(e.target.value)} placeholder="e.g. Julio"/></div>
        <div></div>
      </div>
      <div class="sp-sec" style=${{marginTop:0}}>Products (quantities per tank)</div>
      ${bProds.map(p=>html`<${SprayProdRow} key=${p.id} p=${p} apt=${apt} acres=${acres}
        isTunnels=${isTunnels} bZones=${bZones}
        onUpdate=${updP} onRemove=${remP}/>`)}
      <button class="sp-addp" onClick=${addP}>+ Add product</button>
      <div class="sp-iwarn" style=${{display:bWarn?'block':'none'}}>${bWarn}</div>
      <button class="btn" style=${{width:'100%',marginTop:4}} onClick=${genJulio}>${editId?'Regenerate edited record row':'Generate Julio text + record row'}</button>
      <${SprayJulioOut} bJulio=${bJulio} bRec=${bRec} bGap=${bGap} onSave=${saveEv}/>
    </div>

    <div class=${'sp-screen'+(spView==='ask'?' sp-on':'')}>
      <div class="sp-form-row">
        <div><label class="sp-lbl">Location</label>
          <select class="sp-sel" value=${aLoc} onChange=${e=>setAL(e.target.value)}>
            <option>Tunnels</option><option>Field</option></select></div>
        <div><label class="sp-lbl">Crop stage</label>
          <select class="sp-sel" value=${aStg} onChange=${e=>setAS(e.target.value)}>
            <option>Vegetative</option><option>Pre-bloom</option><option>Bloom</option>
            <option>Green fruit</option><option>Red fruit present</option><option>Post-harvest</option>
          </select></div>
      </div>
      <div class="sp-form-row">
        <div><label class="sp-lbl">Primary concern</label>
          <select class="sp-sel" value=${aTgt} onChange=${e=>setAT(e.target.value)}>
            <option>Powdery mildew</option><option>Botrytis</option><option>Cyclamen mites</option>
            <option>Two-spotted spider mites</option><option>Thrips</option>
            <option>Tarnished plant bug / leafhopper</option><option>Strawberry sap beetle</option>
            <option>Angular leaf spot (ALS)</option><option>Calcium / nutrition</option>
            <option>General / multiple</option>
          </select></div>
        <div><label class="sp-lbl">Pressure</label>
          <select class="sp-sel" value=${aPres} onChange=${e=>setAP(e.target.value)}>
            <option>Preventative</option><option>Moderate — visible</option><option>High — rescue</option>
          </select></div>
      </div>
      <div><label class="sp-lbl">Additional context</label>
        <textarea class="notes-area" value=${aNotes} onInput=${e=>setAN(e.target.value)}
          placeholder="e.g. bios released last week, hot forecast, leaf curl, bees moving in June 25..."></textarea></div>
      <button class=${'btn'+(aLoad?' loading':'')} style=${{width:'100%'}} onClick=${runAI} disabled=${aLoad}>
        ${aLoad?'Generating…':'Get recommendation ↗'}</button>
      <${SprayAIOut} aOut=${aOut} onBuild=${()=>setSV('build')}/>
    </div>
  </div>`;
}


// ── COMPONENTS ────────────────────────────────────────────────────────────────
function NInput({value,onChange,placeholder,flagged}){
  return html`<input type="number" step="0.01" value=${value} onInput=${e=>onChange(e.target.value)} placeholder=${placeholder} class=${flagged?'ph-alert':''}/>`;
}
function TInput({value,onChange,placeholder,style}){
  return html`<input type="text" class="ti" value=${value} onInput=${e=>onChange(e.target.value)} placeholder=${placeholder} style=${style||{}}/>`;
}

function SeasonOverview({zones,onChangeStage}){
  const[exp,setExp]=useState(false);
  const groups={};
  zones.forEach(z=>{const sk=z.stage||'first_crop';if(!groups[sk])groups[sk]=[];groups[sk].push(z);});
  return html`
  <div class="season-bar">
    <div class="season-bar-head">
      <div style=${{minWidth:0,flex:1}}>
        <span style=${{fontSize:11,fontWeight:700,color:'#2e7d32',letterSpacing:'.05em',textTransform:'uppercase'}}>Season Overview</span>
        ${!exp?html`
        <div class="season-groups">
          ${Object.entries(groups).map(([sk,zs])=>{const sc=STAGE_COLORS[sk]||{bg:'#f5f5f5',co:'#555'};return html`<span key=${sk} class="sgbadge" style=${{background:sc.bg,color:sc.co}}>${GROWTH_STAGES[sk]?.label||sk}: ${zs.map(z=>z.label.replace('Zone ','')).join(', ')}</span>`;})}
        </div>`:null}
      </div>
      <button class="btn-sm btn-out" style=${{flexShrink:0}} onClick=${()=>setExp(e=>!e)}>${exp?'Collapse':'Edit stages'}</button>
    </div>
    ${exp?html`
    <div style=${{marginTop:8}}>
      ${zones.map(z=>{const sg=GROWTH_STAGES[z.stage||'first_crop'];return html`
      <div class="stage-row" key=${z.id}>
        <span style=${{fontSize:13,fontWeight:600,color:'#1a2b1a',minWidth:120,flex:1}}>${z.label}</span>
        <select class="stage-sel" value=${z.stage||'first_crop'} onChange=${e=>onChangeStage(z.id,e.target.value)}>
          ${STAGE_ORDER.map(k=>html`<option key=${k} value=${k}>${GROWTH_STAGES[k].label}</option>`)}
        </select>
        ${sg?html`<span class="stage-targets">Drip ${sg.drip[0]}–${sg.drip[1]} | Drain ${sg.drain[0]}–${sg.drain[1]} | ${sg.pct[0]}–${sg.pct[1]}% R/O</span>`:null}
      </div>`;
      })}
      <p style=${{fontSize:11,color:'#aaa',marginTop:8,fontStyle:'italic'}}>Changes save immediately.</p>
    </div>`:null}
  </div>`;
}

function ZoneRow({zone,data,onChange}){
  const d=data||emptyZone();
  const sk=zone.stage||null;
  const dd=zone.drainDrippers||null,pd=zone.privaDrippers||null;
  const{overall,flags}=zoneStatus(d,sk,dd,pd);
  const[open,setOpen]=useState(true);
  const upd=(f,v)=>onChange(zone.id,f,v);
  const dot=overall==='danger'?'danger':overall==='warn'?'warn':'';
  const bd=overall==='danger'?'#ef9a9a':overall==='warn'?'#ffe082':'#e8e8e8';
  const sg=GROWTH_STAGES[sk];
  const der=calcDer(d,dd,pd);
  return html`
  <div class="card" style=${{borderColor:bd}}>
    <button class=${'card-head '+overall} onClick=${()=>setOpen(o=>!o)}>
      <div class="chl">
        <span class=${'dot '+dot}></span>
        <span class="zname">${zone.label}</span>
        <span class="vname">${zone.valve}</span>
        ${sg?html`<span class="sbadge">${sg.label.split(' (')[0].replace('Up to ','→').replace('During ','').replace('Between ','~').replace('Initial ','Init.')}</span>`:null}
      </div>
      <div class="chips">
        ${(()=>{
          const drainFlag=flags.find(f=>f.msg.includes('Drain')||f.msg.includes('drain'));
          const drS=drainFlag?drainFlag.lvl:(der.pct!==null?'ok':'neutral');
          const otherFlags=flags.filter(f=>!f.msg.includes('Drain')&&!f.msg.includes('drain'));
          return html`
            ${der.pct!==null?html`<span class=${'chip chip-'+(drS==='danger'?'danger':drS==='warn'?'warn':'neutral')}>Dr ${der.pct.toFixed(0)}%</span>`:null}
            ${otherFlags.slice(0,1).map((f,i)=>html`<span key=${i} class=${'chip chip-'+f.lvl}>${f.msg}</span>`)}
          `;
        })()}
        ${!dd&&flags.length===0?html`<span class="chip chip-warn">Dr ?%</span>`:null}
        <span class="chev">${open?'▲':'▼'}</span>
      </div>
    </button>
    <div class=${'cbody'+(open?' open':'')}>
      ${zone.location?html`<div class="zloc">${zone.location}</div>`:null}
      <div class="g2">
        ${[['Drip','drip'],['Drain','drain']].map(([lbl,pfx])=>html`
        <div key=${pfx}>
          <div class="flbl">${lbl}</div>
          <div class="fg">
            ${[['EC',pfx+'_ec','1.40'],['pH',pfx+'_ph','5.4'],['mL',pfx+'_ml','500']].map(([fl,fk,ph])=>html`
            <div key=${fk}>
              <span class="fl">${fl}</span>
              <${NInput} value=${d[fk]} onChange=${v=>upd(fk,v)} placeholder=${ph}
                flagged=${fk==='drip_ph'&&!isNaN(parseFloat(d[fk]))&&(parseFloat(d[fk])<4.5||parseFloat(d[fk])>7.5)}/>
            </div>`)}
          </div>
        </div>`)}
      </div>
      ${zone.hasPriva?html`
      <div class="priva-box">
        <div class="priva-lbl">Drain – Priva sensor</div>
        <div class="fg">
          ${[['EC','priva_ec'],['pH','priva_ph'],['mL','priva_ml']].map(([fl,fk])=>html`

function ImageSection({cropId,date,attachments,onUpdate,entry,zones,stageKey,cropLabel}){
  const[imgs,setImgs]=useState({});
  const[missingImgs,setMissingImgs]=useState({});
  const[lb,setLb]=useState(null);
  const[analyzing,setAnalyzing]=useState(null);
  const[analyses,setAnalyses]=useState({});
  const[uploading,setUploading]=useState(false);
  const atts=attachments||[];

  useEffect(()=>{
    const loaded={};const missing={};
    atts.forEach(att=>{
      const b=LS.get('hff:'+cropId+':imgdata:'+att.id,null);
      if(b)loaded[att.id]=b;else missing[att.id]=true;
    });
    setImgs(loaded);
    setMissingImgs(missing);
    setAnalyses({});
  },[date,cropId]);

  async function handleFile(e){
    const file=e.target.files[0];if(!file)return;
    setUploading(true);
    try{
      const comp=await compressImg(file);
      const id='img_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      LS.set('hff:'+cropId+':imgdata:'+id,comp);
      const att={id,caption:'',timestamp:Date.now(),name:file.name};
      const updated=[...atts,att];
      onUpdate(updated);
      setImgs(p=>({...p,[id]:comp}));
    }catch(err){alert('Attach failed: '+err.message);}
    setUploading(false);e.target.value='';
  }

  function delAtt(id){
    if(!confirm('Remove this attachment?'))return;
    LS.del('hff:'+cropId+':imgdata:'+id);
    onUpdate(atts.filter(a=>a.id!==id));
    setImgs(p=>{const n={...p};delete n[id];return n;});
    setAnalyses(p=>{const n={...p};delete n[id];return n;});
    if(lb===id)setLb(null);
  }

  async function doAnalyze(att){
    const b64=imgs[att.id];if(!b64){alert('Image not loaded.');return;}
    setAnalyzing(att.id);
    const result=await analyzeChart(b64,entry,zones,cropLabel,stageKey);
    setAnalyses(p=>({...p,[att.id]:result}));
    setAnalyzing(null);
  }

  return html`
  <div style=${{marginBottom:14}}>
    <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
      <span style=${{fontSize:11,fontWeight:600,color:'#666',letterSpacing:'.06em',textTransform:'uppercase'}}>📸 Screenshots & Charts</span>
      <label style=${{padding:'6px 14px',borderRadius:8,border:'1.5px solid #1a2b1a',color:'#1a2b1a',fontWeight:600,fontSize:12,cursor:'pointer',opacity:uploading?0.5:1}}>
        ${uploading?'Compressing…':'+ Attach'}
        <input type="file" accept="image/*" onInput=${handleFile} style=${{display:'none'}} disabled=${uploading}/>
      </label>
    </div>
    ${atts.length===0?html`<p style=${{fontSize:12,color:'#ccc',lineHeight:1.5}}>Attach Soilsense moisture charts, Priva graphs, or any screenshot worth flagging. Tap "Analyse" for AI interpretation alongside today's readings.</p>`:null}
    <div class="img-grid">
      ${atts.map(att=>html`
      <div class="img-card" key=${att.id}>
        ${imgs[att.id]?html`
        <div style=${{position:'relative'}}>
          <img class="img-thumb" src=${imgs[att.id]} onClick=${()=>setLb(att.id)} alt=${att.caption||att.name||''}/>
          <button onClick=${()=>delAtt(att.id)} style=${{position:'absolute',top:5,right:5,width:22,height:22,borderRadius:'50%',background:'rgba(0,0,0,.6)',color:'#fff',border:'none',fontSize:12,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',padding:0}}>✕</button>
        </div>`:missingImgs[att.id]?html`
        <div class="img-ph" style=${{flexDirection:'column',gap:3,padding:'8px'}}>
          <span>📸</span>
          <span style=${{fontSize:10,textAlign:'center',color:'#bbb'}}>Saved on another device</span>
          <button onClick=${()=>delAtt(att.id)} style=${{fontSize:10,color:'#e65100',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Remove</button>
        </div>`:html`<div class="img-ph">Loading…</div>`}
        <div class="img-inner">
          <input class="img-cap" type="text" value=${att.caption} onInput=${e=>onUpdate(atts.map(a=>a.id===att.id?{...a,caption:e.target.value}:a))} placeholder="Zone, issue, date…"/>
          <button class="img-analyse" disabled=${analyzing===att.id||!imgs[att.id]}
            style=${{background:analyzing===att.id?'#e0e0e0':'#1a2b1a',color:analyzing===att.id?'#888':'#fff',cursor:analyzing===att.id?'default':'pointer'}}
            onClick=${()=>doAnalyze(att)}>
            ${analyzing===att.id?'Analysing…':'Analyse with AI ↗'}
          </button>
          ${analyses[att.id]?html`<div class="img-analysis">${analyses[att.id]}</div>`:null}
        </div>
      </div>`)}
    </div>
    ${lb&&imgs[lb]?html`
    <div class="lightbox" onClick=${()=>setLb(null)}>
      <img src=${imgs[lb]} onClick=${e=>e.stopPropagation()} alt=""/>
      <button class="lightbox-close" onClick=${()=>setLb(null)}>✕</button>
    </div>`:null}
  </div>`;
}


// ── TREND CHART ───────────────────────────────────────────────────────────────
function TrendChart({entries,zones}){
  const d14=()=>{const d=new Date();d.setDate(d.getDate()-14);return d.toISOString().slice(0,10);};
  const[from,setFrom]=useState(d14);
  const[to,setTo]=useState(todayStr);
  const[variable,setVariable]=useState('drain_pct');
  const canvasRef=useRef(null);
  const chartRef=useRef(null);
  const VARS=[
    {id:'drain_pct',label:'Drain %',   fn:(d,z)=>{const r=calcDer(d,z.drainDrippers,z.privaDrippers);return r.pct;}},
    {id:'drip_ec',  label:'Drip EC',   fn:(d)=>{const v=parseFloat(d.drip_ec);return isNaN(v)||v<=0?null:v;}},
    {id:'drain_ec', label:'Drain EC',  fn:(d)=>{const v=parseFloat(d.drain_ec);return isNaN(v)||v<=0?null:v;}},
    {id:'drip_ph',  label:'Drip pH',   fn:(d)=>{const v=parseFloat(d.drip_ph);return isNaN(v)||v<=0?null:v;}},
    {id:'drain_ph', label:'Drain pH',  fn:(d)=>{const v=parseFloat(d.drain_ph);return isNaN(v)||v<=0?null:v;}},
    {id:'ec_sum',   label:'EC Sum',    fn:(d,z)=>{const r=calcDer(d,z.drainDrippers,z.privaDrippers);return r.ecSum;}},
  ];
  const COLORS=['#1976d2','#388e3c','#d32f2f','#f57c00','#7b1fa2','#0097a7','#689f38','#ffa000','#c2185b','#5d4037'];

  useEffect(()=>{
    if(!canvasRef.current||typeof Chart==='undefined')return;
    const sorted=Object.values(entries)
      .filter(e=>e&&e.date&&e.date>=from&&e.date<=to)
      .sort((a,b)=>a.date.localeCompare(b.date));
    if(sorted.length===0){if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}return;}
    const labels=sorted.map(e=>fmtDate(e.date));
    const varDef=VARS.find(v=>v.id===variable)||VARS[0];
    const datasets=zones.map((zone,i)=>{
      const data=sorted.map(entry=>{
        const d=entry[zone.id];if(!d)return null;
        const val=varDef.fn(d,zone);
        return(val===null||val===undefined||isNaN(val))?null:parseFloat(parseFloat(val).toFixed(2));
      });
      const lbl=zone.label.replace('Zone ','Z').replace(' North','N').replace(' South','S').replace('1.','');
      return{label:lbl,data,borderColor:COLORS[i%COLORS.length],backgroundColor:COLORS[i%COLORS.length]+'20',borderWidth:1.5,pointRadius:3,spanGaps:false,tension:0.15};
    });
    if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}
    chartRef.current=new Chart(canvasRef.current,{type:'line',data:{labels,datasets},
      options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},
        plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:10}}}},
        scales:{
          y:{title:{display:true,text:varDef.label,font:{size:11}},grid:{color:'rgba(0,0,0,.05)'}},
          x:{ticks:{maxRotation:40,font:{size:10}},grid:{color:'rgba(0,0,0,.03)'}}
        }
      }
    });
    return()=>{if(chartRef.current){chartRef.current.destroy();chartRef.current=null;}};
  },[from,to,variable,entries,zones]);

  const cnt=Object.values(entries).filter(e=>e&&e.date&&e.date>=from&&e.date<=to).length;
  return html`
  <div style=${{background:'#fff',border:'1.5px solid #e8e8e8',borderRadius:12,padding:'12px 14px',marginBottom:14}}>
    <p style=${{fontSize:11,fontWeight:700,color:'#555',letterSpacing:'.06em',textTransform:'uppercase',margin:'0 0 10px'}}>Trend Chart</p>
    <div style=${{display:'flex',gap:6,flexWrap:'wrap',marginBottom:10}}>
      <input type="date" value=${from} onChange=${e=>setFrom(e.target.value)}
        style=${{flex:1,minWidth:110,padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafaf8'}}/>
      <span style=${{fontSize:12,color:'#aaa',alignSelf:'center'}}>→</span>
      <input type="date" value=${to} onChange=${e=>setTo(e.target.value)}
        style=${{flex:1,minWidth:110,padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafal8'}}/>
      <select value=${variable} onChange=${e=>setVariable(e.target.value)}
        style=${{width:'100%',padding:'7px 9px',border:'1.5px solid #ddd',borderRadius:7,fontSize:13,fontFamily:'inherit',outline:'none',background:'#fafaf8',cursor:'pointer'}}>
        ${VARS.map(v=>html`<option key=${v.id} value=${v.id}>${v.label}</option>`)}
      </select>
    </div>
    ${cnt===0
      ?html`<p style=${{textAlign:'center',color:'#ccc',padding:'30px 0',fontSize:13}}>No entries in this date range</p>`
      :html`<div style=${{position:'relative',height:260}}><canvas ref=${canvasRef}></canvas></div>
            <p style=${{fontSize:10,color:'#ccc',marginTop:5,textAlign:'center'}}>${cnt} day${cnt!==1?'s':''} · tap legend labels to show/hide zones</p>`
    }
  </div>`;
}

function ZoneEditor({zones,onSave}){
  const[local,setLocal]=useState(zones.map(z=>({...z})));

  const[dirty,setDirty]=useState(false);
  const startEdit=z=>{setEditId(z.id);setDraft({...z});};
  const cancelEdit=()=>{setEditId(null);setDraft(null);};
  const saveEdit=()=>{setLocal(l=>l.map(z=>z.id===editId?{...draft}:z));setEditId(null);setDraft(null);setDirty(true);};
  const addZone=()=>{const nz={id:genId(),label:'New Zone',valve:'Valve —',location:'',variety:'',hasPriva:false,stage:'first_crop'};setLocal(l=>[...l,nz]);setEditId(nz.id);setDraft({...nz});setDirty(true);};
  const delZone=id=>{if(!confirm('Remove zone? Saved readings are not deleted.'))return;setLocal(l=>l.filter(z=>z.id!==id));setDirty(true);};
  const move=(id,dir)=>{setLocal(l=>{const i=l.findIndex(z=>z.id===id);if(i<0)return l;const n=[...l];const s=i+dir;if(s<0||s>=n.length)return l;[n[i],n[s]]=[n[s],n[i]];return n;});setDirty(true);};

      <div style=${{display:'flex',gap:7}}>
        ${dirty?html`<button class="btn btn-sm" onClick=${()=>{onSave(local);setDirty(false);}}>Save changes</button>`:null}
        <button class="btn btn-sm btn-out" onClick=${addZone}>+ Add zone</button>

          <div><label class="fl" style=${{fontSize:11}}>Valve / Block</label><${TInput} value=${draft.valve} onChange=${v=>setDraft(d=>({...d,valve:v}))} placeholder="Valve 1"/></div>
        </div>
        <div style=${{marginBottom:8}}><label class="fl" style=${{fontSize:11}}>Location / description</label><${TInput} value=${draft.location} onChange=${v=>setDraft(d=>({...d,location:v}))} placeholder="e.g. 2nd Tunnel, 14 drippers"/></div>
        <div style=${{marginBottom:8}}><label class="fl" style=${{fontSize:11}}>Variety</label><${TInput} value=${draft.variety} onChange=${v=>setDraft(d=>({...d,variety:v}))} placeholder="e.g. Florida Beauty – 250cc"/></div>
        <div style=${{marginBottom:10}}>
          <label class="fl" style=${{fontSize:11}}>Current Growth Stage</label>
          <select style=${{width:'100%',padding:'8px 10px',border:'1.5px solid #ddd',borderRadius:8,fontSize:14,background:'#fafaf8',fontFamily:'inherit',outline:'none',cursor:'pointer'}}
            value=${draft.stage||'first_crop'} onChange=${e=>setDraft(d=>({...d,stage:e.target.value}))}>
            <option value="">— None (Raspberry / non-staged) —</option>
            ${STAGE_ORDER.map(k=>html`<option key=${k} value=${k}>${GROWTH_STAGES[k].label}</option>`)}
          </select>
          ${sg?html`<p style=${{fontSize:11,color:'#888',marginTop:4}}>Drip ${sg.drip[0]}–${sg.drip[1]} mS | Drain ${sg.drain[0]}–${sg.drain[1]} mS | R/O ${sg.pct[0]}–${sg.pct[1]}%</p>`:null}

          <div class="fg2" style=${{marginBottom:0}}>

        <div style=${{display:'flex',gap:4,flexShrink:0}}>

          ${loginResult?html`<span class=${'test-result '+(loginResult.ok?'test-ok':'test-err')} style=${{marginTop:0}}>${loginResult.ok?'✓ Logged in':'✗ '+loginResult.msg}</span>`:null}
        </div>
        <p style=${{fontSize:11,color:'#bbb',marginTop:8,lineHeight:1.5}}>
          Use the email and password from your Supabase account (supabase.com → Account settings),
          or create a user in Supabase Authentication → Users.
        </p>
      `}
    </div>
    <div class="sbox">
      <div class="sbox-title">Anthropic API Key</div>
      <div class="sbox-hint">Required for AI briefings and chart analysis. Get one free at console.anthropic.com — costs under $1/month at daily use.</div>
      <input class="apikey-in" type="password" value=${apiDraft} onInput=${e=>setApiDraft(e.target.value)} placeholder="sk-ant-…"/>
      <div style=${{display:'flex',alignItems:'center',gap:10}}>
        <button class="btn btn-sm" onClick=${()=>{LS.set('hff:apikey',apiDraft);setApiSaved(true);setTimeout(()=>setApiSaved(false),2500);}}>Save key</button>
        ${apiSaved?html`<span style=${{fontSize:12,color:'#2e7d32',fontWeight:600}}>✓ Saved</span>`:null}
      </div>
    </div>
    ${isStraw?html`
    <div class="sbox">
      <div class="sbox-title">Default stage for new zones</div>
      <div class="sbox-hint">Each zone has its own stage — edit them in Season Overview on the Today screen or via the Zones tab. This only applies to newly added zones.</div>
      <select style=${{width:'100%',padding:'9px 12px',border:'1.5px solid #ddd',borderRadius:8,fontSize:14,background:'#fafaf8',fontFamily:'inherit',outline:'none',cursor:'pointer'}}
        value=${defaultStage} onChange=${e=>onSaveStage(e.target.value)}>
        ${STAGE_ORDER.map(k=>html`<option key=${k} value=${k}>${GROWTH_STAGES[k].label}</option>`)}
      </select>
      ${sg?html`
      <div class="stage-ref">
        <p style=${{fontSize:12,fontWeight:600,color:'#2e7d32',marginBottom:6}}>Targets: ${sg.label}</p>
        <div class="stage-ref-grid">
          ${[['Drip EC',sg.drip[0]+'–'+sg.drip[1]+' mS'],['Drain EC',sg.drain[0]+'–'+sg.drain[1]+' mS'],['Run-off',sg.pct[0]+'–'+sg.pct[1]+'%'],['Reduce if','drain >'+sg.reduceIf+' mS'],...(sg.raiseIf?[['Raise if','drain <'+sg.raiseIf+' mS']]:[])].map(([l,v])=>html`
          <div class="stage-ref-cell" key=${l}>
            <div class="stage-ref-lbl">${l}</div>
            <div class="stage-ref-val">${v}</div>
          </div>`)}
        </div>
      </div>`:null}
    </div>`:null}
    <div class="sbox">
      <div class="sbox-title">AI Briefing Strategy — ${cropLabel}</div>
      <div class="sbox-hint">Sent to the AI with every briefing. The <code style=${{background:'#f0f0f0',padding:'1px 4px',borderRadius:3,fontSize:12}}>{STAGE_BLOCK}</code> placeholder is automatically filled with current per-zone stage targets. Edit everything else freely.</div>
      <textarea class="strat-area" value=${stratDraft} onInput=${e=>{setStratDraft(e.target.value);setStratSaved(false);}}></textarea>
      <div class="sbtns">
        <button class="btn btn-sm" onClick=${()=>{onSaveStrat(stratDraft);setStratSaved(true);setTimeout(()=>setStratSaved(false),2500);}}>
          ${stratSaved?'✓ Saved':'Save strategy'}
        </button>
        <button class="btn btn-sm btn-muted" onClick=${()=>{const def=CROPS[cropLabel==='Strawberry'?'str':'ras'].strat;setStratDraft(def);onSaveStrat(def);}}>Reset to default</button>
      </div>
      <hr class="divider"/>
      <p style=${{fontSize:12,color:'#999',marginBottom:6,fontWeight:600}}>Ideas to add:</p>
      ${['Flag if any zone drain EC > stage upper bound for 3+ consecutive days → lab sample','Compare today vs yesterday and flag EC increases > 0.3 mS','Z2S is the chronic problem zone — always report it first','Note if high temp or dry conditions may explain EC climb (Na/Cl accumulation)'].map(ex=>html`<p key=${ex} style=${{fontSize:12,color:'#bbb',margin:'3px 0'}}>• "${ex}"</p>`)}
    </div>
    <div class="sbox">
      <div class="sbox-title">Storage Usage</div>
      <p style=${{fontSize:13,color:'#888'}}>Approximately <strong>${kb} KB</strong> used in this browser's local storage. Images are the main driver. If storage fills up, export your data and delete old entries.</p>
      <p class="storage-note">All data is stored locally on this device — nothing is sent to any server except the Anthropic API during AI briefings.</p>
    </div>
  </div>`;
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const[cropId,setCropId]=useState('str');
  const[view,setView]=useState('entry');
  const[date,setDate]=useState(todayStr);
  const[zones,setZones]=useState(()=>LS.get('hff:str:zones',STR_ZONES));
  const[entries,setEntries]=useState(()=>{const map={};LS.keys('hff:str:d:').forEach(k=>{const e=LS.get(k,null);if(e&&e.date)map[e.date]=e;});return map;});
  const[strat,setStrat]=useState(()=>LS.get('hff:str:strat',STR_STRAT));
  const[defaultStage,setDefaultStage]=useState(()=>LS.get('hff:str:defstage','first_crop'));
  const[aiOut,setAiOut]=useState('');
  const[aiLoading,setAiLoading]=useState(false);
  const[saved,setSaved]=useState(false);
  const[syncSt,setSyncSt]=useState('idle'); // idle|syncing|ok|err
  const[lastSync,setLastSync]=useState(null);
  const sbOn=()=>!!(LS.get('hff:sb_url','')&&LS.get('hff:sb_key',''));

  const crop=CROPS[cropId];
  const isStraw=cropId==='str';

  // Reload state when crop changes
  useEffect(()=>{
    setView('entry');setDate(todayStr());setAiOut('');setSaved(false);
    const z=LS.get('hff:'+cropId+':zones',crop.zones);setZones(z);
    const map={};LS.keys('hff:'+cropId+':d:').forEach(k=>{const e=LS.get(k,null);if(e&&e.date)map[e.date]=e;});setEntries(map);
    setStrat(LS.get('hff:'+cropId+':strat',crop.strat));
    setDefaultStage(LS.get('hff:'+cropId+':defstage','first_crop'));
    // Pull from Supabase and merge with local (async, non-blocking)
    if(sbOn()){
      setSyncSt('syncing');
      sbPull(cropId).then(rows=>{
        if(rows){
          const mapRef={};LS.keys('hff:'+cropId+':d:').forEach(k=>{const e=LS.get(k,null);if(e?.date)mapRef[e.date]=e;});
          setEntries(prev=>{
            const base={...mapRef,...prev};
            const merged=mergeRemote(base,rows);
            Object.values(merged).forEach(e=>{LS.set('hff:'+cropId+':d:'+e.date,e);});
            return {...merged};
          });
          setSyncSt('ok');setLastSync(new Date());
        }else{setSyncSt('err');}
      });
    }
  },[cropId]);

  const entry=entries[date]||emptyDay(zones,date);
  const history=Object.values(entries).sort((a,b)=>b.date.localeCompare(a.date));

  const updateField=useCallback((zoneId,field,val)=>{
    setEntries(es=>{const cur=es[date]||emptyDay(zones,date);const upd={...cur,[zoneId]:{...(cur[zoneId]||emptyZone()),[field]:val}};return{...es,[date]:upd};});
    setSaved(false);
  },[date,zones]);

  const updateAttachments=useCallback(atts=>{
    setEntries(es=>{const cur=es[date]||emptyDay(zones,date);const upd={...cur,attachments:atts};LS.set('hff:'+cropId+':d:'+date,upd);return{...es,[date]:upd};});
  },[date,zones,cropId]);

  function saveEntry(){
    const ts=new Date().toISOString();
    const stamped={...entry,_savedAt:ts};
    LS.set('hff:'+cropId+':d:'+date,stamped);
    setEntries(es=>({...es,[date]:stamped}));setSaved(true);
    if(sbOn()){
      setSyncSt('syncing');
      sbPush(stamped,cropId).then(r=>{
        if(r.ok){setSyncSt('ok');setLastSync(new Date());}
        else setSyncSt('err');
      });
    }
  }

  async function syncNow(){
    setSyncSt('syncing');
    const rows=await sbPull(cropId);
    if(rows){
      setEntries(prev=>{
        const merged=mergeRemote({...prev},rows);
        Object.values(merged).forEach(e=>{LS.set('hff:'+cropId+':d:'+e.date,e);});
        return {...merged};
      });
      setSyncSt('ok');setLastSync(new Date());
    }else setSyncSt('err');
  }

  // Switch view and auto-pull on History/Today if sync is configured
  function switchView(v){
    setView(v);
    if(sbOn()&&(v==='history'||v==='entry')){
      syncNow();
    }
  }

  // Poll Supabase every 5 minutes while the app is open
  useEffect(()=>{
    if(!sbOn())return;
    const id=setInterval(()=>{
      sbPull(cropId).then(rows=>{
        if(!rows)return;
        setEntries(prev=>{
          const merged=mergeRemote({...prev},rows);
          Object.values(merged).forEach(e=>LS.set('hff:'+cropId+':d:'+e.date,e));
          return merged;
        });
        setSyncSt('ok');setLastSync(new Date());
      });
    }, 5*60*1000); // every 5 minutes
    return ()=>clearInterval(id);
  },[cropId]);

  function saveZones(nz){setZones(nz);LS.set('hff:'+cropId+':zones',nz);}

  function updateZoneStage(zoneId,newStage){
    const updated=zones.map(z=>z.id===zoneId?{...z,stage:newStage}:z);
    setZones(updated);LS.set('hff:'+cropId+':zones',updated);
  }

  function saveStrat(s){setStrat(s);LS.set('hff:'+cropId+':strat',s);}
  function saveDefStage(s){setDefaultStage(s);LS.set('hff:'+cropId+':defstage',s);}

  async function runAI(){
    const apiKey=LS.get('hff:apikey','');
    if(!apiKey){setAiOut('⚠ No API key set — go to Settings to add your Anthropic API key.');return;}
    const prompt=buildPrompt(entry,zones,strat,crop.label,defaultStage);
    if(!prompt){setAiOut('⚠ No zone data entered yet — fill in at least one zone\'s drip EC to generate a briefing.');return;}
    setAiLoading(true);setAiOut('');
    try{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1024,messages:[{role:'user',content:prompt}]})});
      const d=await r.json();
      if(!r.ok)setAiOut('API error ('+r.status+'): '+(d?.error?.message||JSON.stringify(d)));
      else setAiOut(d.content?.[0]?.text||'No response received.');
    }catch(e){setAiOut('Network error: '+e.message);}
    setAiLoading(false);
  }

  // Alert summary
  const allD=zones.map(z=>{const d=entry[z.id]||emptyZone();const{overall,flags}=zoneStatus(d,isStraw?(z.stage||null):null,z.drainDrippers,z.privaDrippers);return{zone:z,overall,flags};});
  const alerts=allD.filter(x=>x.overall==='danger');
  const warns=allD.filter(x=>x.overall==='warn');

  const histLvl=h=>zones.reduce((w,z)=>{const{overall}=zoneStatus(h[z.id]||emptyZone(),isStraw?(z.stage||null):null,z.drainDrippers,z.privaDrippers);return overall==='danger'?'danger':w==='danger'?'danger':overall==='warn'?'warn':w;},'ok');

  const{bg,acc,act,actTxt}=crop;
  const TABS=[{id:'entry',lbl:'Today'},{id:'history',lbl:'History'},{id:'zones',lbl:'Zones'},{id:'spray',lbl:'Spray'},{id:'settings',lbl:'Settings'}];

  const FlagBox=({level,items})=>items.length===0?null:html`
  <div class=${'flag-box '+level}>
    <div class=${'flag-ttl '+level}>${level==='danger'?'⚠ Action Required':'Caution'} — ${items.length} zone${items.length>1?'s':''}</div>
    ${items.map(({zone,flags})=>html`
    <div key=${zone.id} class=${'flag-item '+level}>
      <strong>${zone.label}:</strong> ${flags.filter(f=>f.lvl===level).map(f=>f.msg).join(' · ')||flags[0]?.msg||'Check readings'}
    </div>`)}
  </div>`;

  return html`
  <div style=${{fontFamily:'-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif',maxWidth:680,margin:'0 auto',paddingBottom:40}}>

    <div class="hdr" style=${{background:bg}}>
      <div class="hdr-row">
        <div>
          <div class="hdr-sub" style=${{color:acc}}>Howe Family Farms</div>
          <div class="hdr-title">Irrigation Monitor</div>
        </div>
        <div style=${{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
          <div class="crop-tabs">
            ${Object.values(CROPS).map(c=>html`
            <button key=${c.id} class=${'ctab'+(cropId===c.id?' active':'')} style=${{borderColor:cropId===c.id?acc:'#444'}} onClick=${()=>setCropId(c.id)}>
              ${c.emoji} ${c.label}
            </button>`)}
          </div>
          ${sbOn()?html`<span class=${'sync-pill '+(syncSt==='syncing'?'sync-ing':syncSt==='ok'?'sync-ok':syncSt==='err'?'sync-err':'sync-idle')}>
            ${syncSt==='syncing'?'⟳':syncSt==='ok'?'☁ synced':syncSt==='err'?'⚠ sync error':'☁'}
          </span>`:null}
        </div>
      </div>
      <div class="vtabs">
        ${TABS.map(t=>html`
        <button key=${t.id} class="vtab" style=${{borderColor:view===t.id?acc:'#444',background:view===t.id?act:'transparent',color:view===t.id?actTxt:'#777'}} onClick=${()=>switchView(t.id)}>
          ${t.lbl}
        </button>`)}
      </div>
    </div>

    <div class="main">
      ${view==='entry'?html`
      <div>
        <div class="drow">
          <input type="date" value=${date} onChange=${e=>{setDate(e.target.value);setSaved(false);setAiOut('');}}/>
          ${sbOn()?html`<button title="Pull latest from cloud" onClick=${syncNow} disabled=${syncSt==='syncing'}
            style=${{padding:'9px 12px',borderRadius:8,border:'1.5px solid #ddd',background:'#fff',fontSize:15,cursor:syncSt==='syncing'?'default':'pointer',color:syncSt==='err'?'#c62828':syncSt==='ok'?'#2e7d32':'#666',flexShrink:0}}>
            ${syncSt==='syncing'?'⟳':syncSt==='err'?'⚠':'☁'}
          </button>`:null}
          <button class=${'btn'+(saved?' saved':'')} onClick=${saveEntry}>${saved?'✓ Saved':'Save'}</button>
        </div>
        ${isStraw?html`<${SeasonOverview} zones=${zones} onChangeStage=${updateZoneStage}/>`:null}
        <${FlagBox} level="danger" items=${alerts}/>
        <${FlagBox} level="warn" items=${warns}/>
        ${zones.map(z=>html`<${ZoneRow} key=${z.id} zone=${z} data=${entry[z.id]} onChange=${updateField}/>`)}
        <textarea class="notes-area" placeholder="Tech notes: hot day, bucket issues, maintenance, recipe change…"
          value=${entry.notes} onInput=${e=>setEntries(es=>({...es,[date]:{...(es[date]||emptyDay(zones,date)),notes:e.target.value}}))}></textarea>
        <${ImageSection} cropId=${cropId} date=${date} attachments=${entry.attachments||[]} onUpdate=${updateAttachments}
          entry=${entry} zones=${zones} stageKey=${isStraw?(entry[zones[0]?.id]?.drip_ec?zones[0]?.stage||defaultStage:defaultStage):null} cropLabel=${crop.label}/>
        <div class="ai-box">
          <div class="sec-lbl">AI Advisor</div>
          <p class="ai-hint">Evaluates each zone against its stage targets (Delphy protocol). Save first, then generate. Customise focus areas in Settings.</p>
          <button class=${'btn'+(aiLoading?' loading':'')} onClick=${runAI} disabled=${aiLoading}>${aiLoading?'Generating…':'Generate briefing ↗'}</button>
          ${aiOut?html`<div class=${'ai-out'+(aiOut.startsWith('⚠')||aiOut.startsWith('API')||aiOut.startsWith('Network')?' err':'')}>${aiOut}</div>`:null}
        </div>
      </div>`:null}

      ${view==='history'?html`
      <div>
        <${TrendChart} entries=${entries} zones=${zones}/>
        <div class="exp-row">
          <button class="btn btn-sm btn-out" onClick=${()=>exportCSV([entry],zones,cropId+'_irrigation_'+date+'.csv')}>↓ Export today</button>
          <button class="btn btn-sm" disabled=${history.length===0} style=${{opacity:history.length===0?0.4:1}} onClick=${()=>exportCSV(history,zones,cropId+'_irrigation_season_'+todayStr()+'.csv')}>↓ Export all history</button>
        </div>
        <p style=${{fontSize:13,color:'#aaa',marginBottom:10}}>${history.length} day${history.length!==1?'s':''} saved — ${crop.label}</p>
        ${history.length===0?html`<div class="empty">
          ${sbOn()?'No entries yet — if Binod has saved data, tap ☁ on the Today tab to pull from cloud.':'No saved entries yet for this crop.'}
        </div>`:null}
        ${history.map(h=>{
          const lvl=histLvl(h);
          return html`
          <button key=${h.date} class=${'hr-btn '+lvl} onClick=${()=>{setDate(h.date);setSaved(true);setAiOut('');setView('entry');}}>
            <div style=${{display:'flex',alignItems:'center',gap:8}}>
              <span class=${'dot'+(lvl==='danger'?' danger':lvl==='warn'?' warn':'')}></span>
              <span style=${{fontWeight:600,fontSize:14,color:'#222'}}>${fmtDate(h.date)}</span>
              ${h.date===todayStr()?html`<span style=${{fontSize:11,background:'#e8f5e9',color:'#2e7d32',borderRadius:5,padding:'2px 7px',fontWeight:600}}>today</span>`:null}
              ${(h.attachments||[]).length>0?html`<span style=${{fontSize:11,color:'#aaa'}}>📸 ${(h.attachments||[]).length}</span>`:null}
            </div>
            <span style=${{fontSize:12,color:'#bbb'}}>→</span>
          </button>`;
        })}
      </div>`:null}

      ${view==='zones'?html`<${ZoneEditor} zones=${zones} onSave=${saveZones}/>`:null}

      ${view==='settings'?html`
      <${SettingsView} strat=${strat} defaultStage=${defaultStage} onSaveStrat=${saveStrat}
        onSaveStage=${saveDefStage} cropLabel=${crop.label} isStraw=${isStraw}
        syncSt=${syncSt} lastSync=${lastSync} onSyncNow=${syncNow}/>`:null}

      ${view==='spray'?html`<${SprayBrain}/>`:null}
    </div>
  </div>`;
}

prender(html`<${App}/>`,document.getElementById('app'));
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
